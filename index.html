   (Publishable key memang aman berada di browser — data tetap dilindungi
   login + Row Level Security. JANGAN pernah menaruh secret key di sini.)

const SUPABASE_URL = "https://vpexyffgxdgrdwlwpjgg.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_dDnLBJdiKFQdDIZ0l5dApQ_L8dupIKT";
const FUNGSI_AI_URL = `${SUPABASE_URL}/functions/v1/skrining-ai`;
const KONFIG_BELUM_DIISI = SUPABASE_URL.includes("GANTI") || SUPABASE_PUBLISHABLE_KEY.includes("GANTI");
const supabase = KONFIG_BELUM_DIISI ? null : createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },

// Profil pengguna yang sedang login (diisi GerbangLogin sebelum App dirender):
// { id, nama, email, peran, aktif, rs: { id, kode, nama, kelas, ..., kuota_ai_bulanan, terpakai_bulan_ini } }
let PROFIL = null;
const LABEL_PERAN = { superadmin: "Superadmin", admin_rs: "Admin RS", koder: "Koder / Casemix", dpjp: "DPJP", viewer: "Pemantau" };
function bolehTulis() { return !!PROFIL && ["superadmin", "admin_rs", "koder"].includes(PROFIL.peran); }
function adminRS() { return !!PROFIL && ["superadmin", "admin_rs"].includes(PROFIL.peran); }
function namaRSAktif() { return (PROFIL && PROFIL.rs && PROFIL.rs.nama) || "Rumah Sakit"; }

// Satu-satunya jalur ke AI: Edge Function "skrining-ai" (cek login, kuota, susun
// instruksi di server, catat pemakaian). Tidak ada API key/instruksi AI di browser.
async function panggilAI(payload) {
  if (!supabase) throw new Error("Konfigurasi Supabase belum diisi.");
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error("Sesi login berakhir. Silakan masuk ulang.");
  let res;
  try {
    res = await fetch(FUNGSI_AI_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${session.access_token}`, apikey: SUPABASE_PUBLISHABLE_KEY },
      body: JSON.stringify(payload),
    });
  } catch (e) {
    throw new Error("Gagal menghubungi server AI (periksa koneksi internet): " + (e && e.message ? e.message : ""));
  }
  const sisa = res.headers.get("x-kuota-sisa");
  if (sisa !== null && typeof window.__onKuota === "function") window.__onKuota(Number(sisa), Number(res.headers.get("x-kuota-total")));
  if (!res.ok) {
    let pesan = "";
    try { const j = await res.json(); pesan = (j && j.error && (j.error.message || j.error)) || ""; } catch (e) { /* abaikan */ }
    if (typeof pesan !== "string") pesan = JSON.stringify(pesan);
    throw new Error(pesan || `Server AI mengembalikan status ${res.status}.`);
  }
  return res.json();
}

// Hasil teks AI (meniru perilaku Code.gs versi GAS: catatan bila terpotong batas token)
async function aiTeks(payload, maxTokens) {
  const data = await panggilAI(payload);
  const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
  if (!text) throw new Error("Respons AI kosong (stop_reason: " + (data.stop_reason || "?") + ")");
  if (data.stop_reason === "max_tokens") {
    return text + "\n\n_(Catatan sistem: respons AI mencapai batas panjang maksimum (" + (maxTokens || 4000) + " token) sehingga terpotong.)_";
  }
  return text;
}

// ---------------------------------------------------------------------------
// JEMBATAN PENYIMPANAN: aplikasi (berasal dari versi GAS) tetap memanggil
// gsRun("loadClaims"/"upsertClaim"/...) — di sini dialihkan ke tabel Supabase
// milik RS yang login (dijaga Row Level Security).
// ---------------------------------------------------------------------------
function _kabarSimpan(ok, pesan) { if (typeof window.__onSimpan === "function") window.__onSimpan(ok, pesan); }
async function _upsertKlaim(list) {
  if (!bolehTulis()) return true;
  const rsId = PROFIL.rs.id;
  try {
    for (let i = 0; i < list.length; i += 100) {
      const baris = list.slice(i, i + 100).map((c) => ({ rs_id: rsId, id: String(c.id), data: c }));
      const { error } = await supabase.from("klaim").upsert(baris, { onConflict: "rs_id,id" });
      if (error) throw error;
    }
    _kabarSimpan(true, `Tersimpan · ${new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" })}`);
    return true;
  } catch (e) {
    _kabarSimpan(false, "Gagal menyimpan ke server: " + (e && e.message ? e.message : "kesalahan jaringan"));
    throw e;
  }
}
let _pengaturanServer = { bobot: {}, setelan: {} };
async function gsRun(fnName, ...args) {
  if (!supabase || !PROFIL) throw new Error("Belum login.");
  const rsId = PROFIL.rs.id;
  switch (fnName) {
    case "loadClaims": {
      const hasil = [];
      for (let dari = 0; ; dari += 1000) {
        const { data, error } = await supabase.from("klaim").select("id, data").eq("rs_id", rsId).order("dibuat", { ascending: true }).range(dari, dari + 999);
        if (error) throw new Error("Gagal memuat klaim dari server: " + error.message);
        (data || []).forEach((r) => { const c = r.data || {}; hasil.push(c.aiStatus === "loading" ? { ...c, aiStatus: "idle" } : c); });
        if (!data || data.length < 1000) break;
      }
      return hasil;
    }
    case "saveClaims": case "appendClaims": return _upsertKlaim(args[0] || []);
    case "upsertClaim": { await _upsertKlaim([args[0]]); return args[0] && args[0].id; }
    case "deleteClaimById": {
      if (!bolehTulis()) return true;
      const { error } = await supabase.from("klaim").delete().eq("rs_id", rsId).eq("id", String(args[0]));
      if (error) { _kabarSimpan(false, "Gagal menghapus: " + error.message); throw error; }
      return true;
    }
    case "clearAllClaims": {
      if (!adminRS()) throw new Error("Hanya Admin RS yang dapat menghapus semua klaim.");
      const { error } = await supabase.from("klaim").delete().eq("rs_id", rsId);
      if (error) throw error;
      return true;
    }
    case "loadWeights": case "loadSettings": {
      const { data } = await supabase.from("pengaturan_rs").select("bobot, setelan").eq("rs_id", rsId).maybeSingle();
      _pengaturanServer = { bobot: (data && data.bobot) || {}, setelan: (data && data.setelan) || {} };
      const v = fnName === "loadWeights" ? _pengaturanServer.bobot : _pengaturanServer.setelan;
      return v && Object.keys(v).length ? v : null;
    }
    case "saveWeights": case "saveSettings": {
      if (!adminRS()) return true;
      const kunci = fnName === "saveWeights" ? "bobot" : "setelan";
      if (JSON.stringify(_pengaturanServer[kunci]) === JSON.stringify(args[0])) return true;
      _pengaturanServer = { ..._pengaturanServer, [kunci]: args[0] };
      const { error } = await supabase.from("pengaturan_rs").upsert({ rs_id: rsId, ..._pengaturanServer, diubah: new Date().toISOString() }, { onConflict: "rs_id" });
      if (error) _kabarSimpan(false, "Gagal menyimpan pengaturan: " + error.message);
      return true;
    }
    default:
      throw new Error("Fungsi server tidak dikenal: " + fnName);
  }
}

// Riwayat klaim NYATA RSU Allam Medica hasil ekspor grouper e-Klaim resmi (Januari–Juli
// 2026, 49.012 klaim tervalidasi). Tiap baris: [kode diagnosis utama, kelas rawat, kode
// INA-CBG paling sering dipakai utk kombinasi ini, deskripsi resmi, jumlah kejadian
// (minimal 3x supaya bukan kebetulan/typo), tarif median]. Sumber PALING otoritatif utk
// saran kode — mencerminkan pola koding & grouper sesungguhnya RS ini, bukan tebakan
// kata kunci seperti findCandidateInacbgCodes.
// Riwayat klaim NYATA RSU Allam Medica hasil ekspor grouper e-Klaim resmi (Januari–Juli
// 2026, 49.012 klaim tervalidasi). Tiap baris: [kode diagnosis utama, "Y"/"N" ada prosedur,
// kelas rawat, kode INA-CBG paling sering dipakai utk kombinasi ini, deskripsi resmi, jumlah
// kejadian (minimal 3x), tarif median]. DIMENSI "ada prosedur" WAJIB dipisah — 27 diagnosis
// terbukti punya tarif berbeda 3-30x lipat tergantung ada/tidaknya tindakan (mis. katarak
// H25.9: tanpa prosedur Rp196rb/kontrol biasa vs dengan prosedur operasi Rp7,3jt) — sebelum
// perbaikan ini, sistem salah mengambil tarif kontrol untuk kasus yang sebenarnya operasi.
let DAFTAR_RIWAYAT_DIAGNOSIS_INACBG = [];   // dimuat dari database per RS (lihat muatRiwayatRS)

// Riwayat grouping NYATA RS yang login (dipelajari dari ekspor klaim e-Klaim RS itu
// sendiri, diperbarui Admin RS kapan saja). Format baris SAMA PERSIS dengan versi GAS
// tervalidasi, sehingga seluruh logika saran kode & diagnosis sekunder terkait tetap.
let RIWAYAT_INFO = { periode: "", jumlah: 0, diubah: "" };
async function muatRiwayatRS() {
  DAFTAR_RIWAYAT_DIAGNOSIS_INACBG = []; DAFTAR_RIWAYAT_PRESISI = []; DAFTAR_DIAGNOSIS_SEKUNDER_TERKAIT = [];
  RIWAYAT_INFO = { periode: "", jumlah: 0, diubah: "" };
  if (!supabase || !PROFIL) return;
  const { data, error } = await supabase.from("riwayat_rs").select("diagnosis, presisi, dx_sekunder, periode, jumlah_klaim, diubah").eq("rs_id", PROFIL.rs.id).maybeSingle();
  if (!error && data) {
    DAFTAR_RIWAYAT_DIAGNOSIS_INACBG = Array.isArray(data.diagnosis) ? [...data.diagnosis] : [];
    DAFTAR_RIWAYAT_PRESISI = Array.isArray(data.presisi) ? [...data.presisi] : [];
    DAFTAR_DIAGNOSIS_SEKUNDER_TERKAIT = Array.isArray(data.dx_sekunder) ? [...data.dx_sekunder] : [];
    RIWAYAT_INFO = { periode: data.periode || "", jumlah: data.jumlah_klaim || 0, diubah: data.diubah || "" };
  }
  await gabungRiwayatAcuan();
}

// Pola grouping ACUAN: riwayat grouper e-Klaim sungguhan dari RS rujukan (versi tervalidasi
// dokter spesialis). Logika grouper INA-CBG (diagnosis/prosedur → kode) berlaku NASIONAL —
// yang berbeda antar RS hanya tarifnya. Jadi pola kode acuan dipakai untuk diagnosis yang
// belum ada di riwayat RS sendiri, sedangkan tarif SELALU dihitung ulang dari tabel tarif
// RS yang login. Riwayat RS sendiri tetap diutamakan (tidak pernah ditimpa).
// Penanda di akhir baris: "acuan" (diagnosis: indeks 7, presisi: indeks 8, dx sekunder: indeks 5).
let RIWAYAT_ACUAN_INFO = { jumlah: 0, periode: "", dipakai: 0 };
async function gabungRiwayatAcuan() {
  RIWAYAT_ACUAN_INFO = { jumlah: 0, periode: "", dipakai: 0 };
  if (!supabase) return;
  const { data, error } = await supabase.from("riwayat_acuan").select("diagnosis, presisi, dx_sekunder, periode, jumlah_klaim").eq("id", 1).maybeSingle();
  if (error || !data) return;
  RIWAYAT_ACUAN_INFO.jumlah = data.jumlah_klaim || 0;
  RIWAYAT_ACUAN_INFO.periode = data.periode || "";
  const desk = (kode, d) => (TARIF_REF_MAP[kode] ? TARIF_REF_MAP[kode][1] : d);
  const adaD = new Set(DAFTAR_RIWAYAT_DIAGNOSIS_INACBG.map((r) => `${r[0]}|${r[1]}|${r[2]}`));
  (data.diagnosis || []).forEach((r) => {
    if (adaD.has(`${r[0]}|${r[1]}|${r[2]}`)) return;
    DAFTAR_RIWAYAT_DIAGNOSIS_INACBG.push([r[0], r[1], r[2], r[3], desk(r[3], r[4]), r[5], tarifResmiUntuk(r[3], r[2]) || 0, "acuan"]);
    RIWAYAT_ACUAN_INFO.dipakai += 1;
  });
  const adaP = new Set(DAFTAR_RIWAYAT_PRESISI.map((r) => `${r[0]}|${r[1]}|${r[2]}|${r[3]}`));
  (data.presisi || []).forEach((r) => {
    if (adaP.has(`${r[0]}|${r[1]}|${r[2]}|${r[3]}`)) return;
    DAFTAR_RIWAYAT_PRESISI.push([r[0], r[1], r[2], r[3], r[4], desk(r[4], r[5]), r[6], tarifResmiUntuk(r[4], r[3]) || 0, "acuan"]);
  });
  const duSendiri = new Set(DAFTAR_DIAGNOSIS_SEKUNDER_TERKAIT.map((r) => r[0]));
  (data.dx_sekunder || []).forEach((r) => {
    if (duSendiri.has(r[0])) return;   // RS sudah punya pola dx sekunder sendiri utk dx utama ini
    DAFTAR_DIAGNOSIS_SEKUNDER_TERKAIT.push([r[0], r[1], r[2], r[3], r[4], "acuan"]);
  });
}

// B. Kode INA-CBG yang tidak lazim untuk diagnosis utama (dibanding pola grouping riwayat
// RS sendiri + acuan). Hanya dibandingkan dalam jenis kasus yang sama (medis "-4-" vs medis,
// prosedur vs prosedur) supaya tindakan operasi yang sah tidak ikut ditandai.
function cekKodeVsRiwayat(claim) {
  const kode = String(claim.inacbgCode || "").trim().toUpperCase();
  const dx = String(claim.primaryDxCode || "").trim().toUpperCase();
  if (!/^[A-Z]-\d-\d{2}-/.test(kode) || !dx) return null;
  const baris = DAFTAR_RIWAYAT_DIAGNOSIS_INACBG.filter((r) => r[0] === dx);
  const total = baris.reduce((n, r) => n + (Number(r[5]) || 0), 0);
  if (total < 5) return null;
  const dasar = (k) => String(k).split("-").slice(0, 3).join("-");
  const jenis = (k) => String(k).split("-")[1];
  const dasarKlaim = dasar(kode);
  if (!["4", "5"].includes(jenis(kode))) return null;   // kode prosedur ditentukan tindakannya, bukan diagnosis
  const sejenis = baris.filter((r) => jenis(r[3]) === jenis(kode));
  if (!sejenis.length || sejenis.some((r) => dasar(r[3]) === dasarKlaim)) return null;
  const peta = {};
  sejenis.forEach((r) => { const d = dasar(r[3]); peta[d] = peta[d] || { kode: r[3], deskripsi: r[4], jml: 0 }; peta[d].jml += Number(r[5]) || 0; });
  const lazim = Object.values(peta).sort((a, b) => b.jml - a.jml);
  const deskKlaim = TARIF_REF_MAP[kode] ? TARIF_REF_MAP[kode][1] : "";
  const acuan = sejenis.some((r) => r[7] === "acuan");
  const teksLazim = lazim.slice(0, 3).map((x) => `${x.kode.split("-").slice(0, 3).join("-")} (${x.deskripsi.replace(/\s*\((RINGAN|SEDANG|BERAT)\)$/, "")}, ${x.jml}x)`).join("; ");
  return {
    acuan,
    ringkas: `Kode ${kode}${deskKlaim ? ` (${deskKlaim})` : ""} tidak lazim untuk diagnosis utama ${dx} — pada ${total} klaim grouper e-Klaim ${acuan ? "pola acuan" : "riwayat RS ini"}, ${dx} dikelompokkan ke: ${teksLazim}.`,
  };
}


// Cari kode INA-CBG dari riwayat klaim nyata RS ini berdasarkan kode diagnosis + ADA/TIDAKNYA
// prosedur + kelas rawat. Fallback bertingkat: (1) kecocokan persis, (2) kelas rawat lain tapi
// status prosedur SAMA (paling penting dijaga), (3) null jika benar2 tidak ada preseden.
function findRiwayatInacbg(primaryDxCode, adaProsedur, kelasRawat) {
  if (!primaryDxCode) return null;
  const kode = primaryDxCode.trim().toUpperCase();
  const kelas = Number(kelasRawat) || 3;
  const prosedurFlag = adaProsedur ? "Y" : "N";
  const hit = DAFTAR_RIWAYAT_DIAGNOSIS_INACBG.find((r) => r[0] === kode && r[1] === prosedurFlag && r[2] === kelas);
  if (hit) return hit;
  // Coba kelas rawat lain, TAPI status ada-prosedur harus tetap sama — ini kunci perbaikan bug
  const hitLain = DAFTAR_RIWAYAT_DIAGNOSIS_INACBG.filter((r) => r[0] === kode && r[1] === prosedurFlag).sort((a, b) => b[5] - a[5])[0];
  return hitLain || null;
}

// Diagnosis sekunder yang SERING menyertai diagnosis utama tertentu, berdasarkan
// pola co-occurrence riil di 49.012 klaim RS ini (Jan-Juli 2026). SYARAT lolos
// tabel ini: minimal 3x kejadian bersama & minimal 3% dari seluruh klaim diagnosis
// utama itu — supaya bukan kebetulan/typo satu klaim. PENTING: ini pola statistik,
// BUKAN diagnosis otomatis pasien ini — tim koding WAJIB verifikasi dulu apakah
// pasien yang sedang dikoding memang benar punya kondisi ini di rekam medisnya
// sebelum menambahkan, supaya tidak jadi upcoding tanpa dasar.
// Tiap baris: [kode dx utama, kode dx sekunder, jml kejadian bersama, total klaim dx utama, persen]
let DAFTAR_DIAGNOSIS_SEKUNDER_TERKAIT = [];   // dimuat dari database per RS (lihat muatRiwayatRS)

function findDiagnosisSekunderTerkait(primaryDxCode) {
  if (!primaryDxCode) return [];
  const kode = primaryDxCode.trim().toUpperCase();
  return DAFTAR_DIAGNOSIS_SEKUNDER_TERKAIT.filter((r) => r[0] === kode).sort((a, b) => b[4] - a[4]).slice(0, 5);
}

// Riwayat klaim RS ini yang LEBIH PRESISI — mempertimbangkan bukan cuma diagnosis
// utama, tapi juga JUMLAH diagnosis sekunder yang sudah diinput (0, 1, atau 2+),
// karena severity/kode INA-CBG sering berbeda tergantung ini (72 dari 273 diagnosis
// di data historis RS ini terbukti berubah kodenya sesuai jumlah diagnosis sekunder).
// Tiap baris: [dx utama, bucket jml sekunder ("0"/"1"/"2+"), kelas rawat, kode INACBG,
// deskripsi, jml kejadian, tarif median]
let DAFTAR_RIWAYAT_PRESISI = [];   // dimuat dari database per RS (lihat muatRiwayatRS)

// Riwayat klaim RS ini yang PALING presisi — mempertimbangkan diagnosis utama, ADA/TIDAKNYA
// prosedur (paling menentukan tarif — lihat catatan di DAFTAR_RIWAYAT_DIAGNOSIS_INACBG),
// jumlah diagnosis sekunder, DAN kelas rawat. Fallback bertingkat menjaga status ada-prosedur
// tetap sama di tiap tingkat sebelum melonggarkan syarat lain.
function findRiwayatInacbgPresisi(primaryDxCode, adaProsedur, jumlahDiagnosisSekunder, kelasRawat) {
  if (!primaryDxCode) return null;
  const kode = primaryDxCode.trim().toUpperCase();
  const kelas = Number(kelasRawat) || 3;
  const prosedurFlag = adaProsedur ? "Y" : "N";
  const bucket = jumlahDiagnosisSekunder >= 2 ? "2+" : String(jumlahDiagnosisSekunder || 0);

  // 1. Kecocokan persis: diagnosis + ada-prosedur + jumlah sekunder + kelas rawat
  let hit = DAFTAR_RIWAYAT_PRESISI.find((r) => r[0] === kode && r[1] === prosedurFlag && r[2] === bucket && r[3] === kelas);
  if (hit) return { ...arrToRiwayatPresisi(hit), presisi: true };

  // 2. Sama diagnosis + ada-prosedur + jumlah sekunder, kelas rawat lain
  const sameBucket = DAFTAR_RIWAYAT_PRESISI.filter((r) => r[0] === kode && r[1] === prosedurFlag && r[2] === bucket).sort((a, b) => b[6] - a[6])[0];
  if (sameBucket) return { ...arrToRiwayatPresisi(sameBucket), presisi: true };

  // 3. Sama diagnosis + ada-prosedur SAJA (kelonggarkan jumlah sekunder, tapi status
  //    prosedur tetap dijaga sama — ini yang paling penting utk tarif benar)
  const sameProsedur = DAFTAR_RIWAYAT_PRESISI.filter((r) => r[0] === kode && r[1] === prosedurFlag).sort((a, b) => b[6] - a[6])[0];
  if (sameProsedur) return { ...arrToRiwayatPresisi(sameProsedur), presisi: true };

  // 4. Fallback terakhir: tabel dasar (dx + ada-prosedur + kelas, tanpa bucket sekunder)
  const umum = findRiwayatInacbg(primaryDxCode, adaProsedur, kelasRawat);
  if (umum) return { dxUtama: umum[0], adaProsedur: umum[1], kelasRawat: umum[2], kode: umum[3], deskripsi: umum[4], jml: umum[5], tarifMedian: umum[6], presisi: false, sumber: umum[7] || "rs" };
  return null;
}
function arrToRiwayatPresisi(r) {
  return { dxUtama: r[0], adaProsedur: r[1], bucket: r[2], kelasRawat: r[3], kode: r[4], deskripsi: r[5], jml: r[6], tarifMedian: r[7], sumber: r[8] || "rs" };
}

// Tabel tarif INA-CBG TIDAK lagi ditanam di aplikasi: dimuat dari database sesuai
// "set tarif" RS yang login (tipe/kelas RS A–D, Pemerintah/Swasta, Regional 1–5,
// Permenkes 3/2023 — atau set khusus RS dari ekspor e-Klaim). Kolom tiap baris:
// [kode, deskripsi, jenis(RI/RJ), kelas3, kelas2, kelas1]
let TARIF_REF_RAW = [];
let TARIF_REF_MAP = {};
let TARIF_INFO = { kode: "", nama: "", sumber: "", jumlah: 0 };
function labelTarif() {
  return TARIF_INFO.nama ? `${TARIF_INFO.nama}${TARIF_INFO.sumber ? ` — ${TARIF_INFO.sumber}` : ""}` : "tabel tarif RS (belum diatur)";
}
async function muatTarifRS() {
  TARIF_REF_RAW = []; TARIF_REF_MAP = {};
  const st = PROFIL && PROFIL.rs && PROFIL.rs.set_tarif;
  TARIF_INFO = st ? { kode: st.kode, nama: st.nama, sumber: st.sumber || "", jumlah: st.jumlah_kode || 0 } : { kode: "", nama: "", sumber: "", jumlah: 0 };
  if (!st || !supabase) return;
  for (let dari = 0; ; dari += 1000) {
    const { data, error } = await supabase.from("tarif_inacbg").select("kode, deskripsi, jenis, kelas3, kelas2, kelas1")
      .eq("set_id", st.id).order("kode").range(dari, dari + 999);
    if (error) throw new Error("Gagal memuat tabel tarif: " + error.message);
    (data || []).forEach((r) => TARIF_REF_RAW.push([r.kode, r.deskripsi, r.jenis, r.kelas3 === null ? null : Number(r.kelas3), r.kelas2 === null ? null : Number(r.kelas2), r.kelas1 === null ? null : Number(r.kelas1)]));
    if (!data || data.length < 1000) break;
  }
  TARIF_REF_RAW.forEach((r) => { TARIF_REF_MAP[r[0]] = r; });
}

// Cari kandidat kode INA-CBG dari tabel tarif resmi berdasarkan kemiripan kata kunci
// diagnosis — dipakai saat klaim BELUM punya kode INA-CBG (mis. diunggah dari SEP/
// Resume Medis sebelum proses grouping e-Klaim selesai). Ini heuristik kata kunci
// SEDERHANA (bukan grouper resmi) — hasilnya cuma kandidat pertimbangan utk AI,
// bukan jawaban pasti.
function findCandidateInacbgCodes(primaryDxDesc, maxResults) {
  maxResults = maxResults || 6;
  if (!primaryDxDesc) return [];
  const stopWords = new Set(["unspecified", "the", "and", "of", "with", "without", "other", "due", "to", "in", "not", "specified", "acute", "chronic", "type", "syndrome", "disease", "disorder"]);
  const words = primaryDxDesc.toLowerCase().split(/[^a-z]+/).filter((w) => w.length >= 4 && !stopWords.has(w));
  if (words.length === 0) return [];
  const scored = TARIF_REF_RAW.map((row) => {
    const desc = row[1].toLowerCase();
    let score = 0;
    words.forEach((w) => { if (desc.indexOf(w) >= 0) score += 1; });
    return { row: row, score: score };
  }).filter((x) => x.score > 0).sort((a, b) => b.score - a.score);
  return scored.slice(0, maxResults).map((x) => x.row);
}

   UTIL
---------------------------------------------------------------------- */
function parseTanggalFleksibel(str) {
  if (!str) return null;
  const s = String(str).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if (m) return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
function daysBetween(a, b) {
  const d1 = parseTanggalFleksibel(a), d2 = parseTanggalFleksibel(b);
  if (!d1 || !d2 || isNaN(d1) || isNaN(d2)) return null;
  return Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
}
// LOS mengikuti konvensi resmi aplikasi e-Klaim Kemenkes: dihitung INKLUSIF
// (hari masuk & hari keluar sama-sama dihitung), bukan sekadar selisih kalender.
// Cth: masuk 31/07, keluar 01/08 → selisih kalender 1, tapi LOS resmi = 2 hari.
// Dipakai KHUSUS untuk menghitung field LOS klaim — jangan dipakai untuk hitung
// jarak/gap readmisi antar-episode (itu tetap pakai daysBetween biasa, exclusive).
// Pengurai angka rupiah yang tahan berbagai format penulisan. Dokumen e-Klaim
// menulis tarif sbg "23,255,400.00", dokumen lain bisa "23.255.400" (gaya
// Indonesia) atau "Rp 23.255.400". Kalau langsung dipakai Number(), semua format
// bertitik/berkoma jadi NaN dan tampil sbg Rp0 — inilah sebab tarif sering
// "hilang" walau AI sudah membacanya dengan benar dari dokumen.
function parseAngka(v) {
  if (typeof v === "number") return Number.isFinite(v) ? Math.round(v) : 0;
  let s = String(v == null ? "" : v).trim();
  if (!s) return 0;
  s = s.replace(/[^\d.,-]/g, ""); // buang "Rp", spasi, dan simbol lain
  if (!s) return 0;
  const negatif = s.startsWith("-");
  // Kalau diakhiri pemisah + 1-2 digit, itu bagian desimal (mis. ".00") — buang,
  // karena tarif INA-CBG selalu bilangan bulat rupiah.
  const m = s.match(/^(.*)[.,](\d{1,2})$/);
  const bagianBulat = (m ? m[1] : s).replace(/[^\d]/g, "");
  if (!bagianBulat) return 0;
  const n = parseInt(bagianBulat, 10);
  if (!Number.isFinite(n)) return 0;
  return negatif ? -n : n;
}

function losBetween(a, b) {
  const d = daysBetween(a, b);
  if (d === null || d < 0) return d;
  return d + 1;
}
function median(arr) {
  const s = [...arr].sort((a, b) => a - b);
  const mid = Math.floor(s.length / 2);
  return s.length % 2 !== 0 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}
function quartile(arr, q) {
  const s = [...arr].sort((a, b) => a - b);
  const pos = (s.length - 1) * q;
  const base = Math.floor(pos);
  const rest = pos - base;
  return s[base + 1] !== undefined ? s[base] + rest * (s[base + 1] - s[base]) : s[base];
}
function mean(arr) { return arr.reduce((a, b) => a + b, 0) / (arr.length || 1); }
function stddev(arr) {
  const m = mean(arr);
  return Math.sqrt(mean(arr.map((x) => (x - m) ** 2)));
}
function matchHighRiskDx(code) {
  if (!code) return null;
  const c = code.trim().toUpperCase();
  for (const key of Object.keys(HIGH_RISK_DX)) if (c.startsWith(key)) return key;
  return null;
}
// bandingkan "letter+2digit" secara leksikal, cth A00 <= A41 <= B99
function icd10RangeKey(letter, num) { return letter + String(num).padStart(2, "0"); }
function findICD10Chapter(code) {
  const m = /^([A-Z])(\d{2})(\.\d{1,2})?$/i.exec((code || "").trim());
  if (!m) return { valid: false, chapter: null };
  const letter = m[1].toUpperCase();
  const num = m[2];
  const key = icd10RangeKey(letter, num);
  for (const [chap, start, end, title] of ICD10_CHAPTERS) {
    if (key >= start && key <= end) return { valid: true, chapter: chap, title };
  }
  return { valid: false, chapter: null };
}
// Cek kategori 3-digit spesifik (lebih presisi dari sekadar blok bab).
// Cakupan referensi ~1.120 kategori, tidak 100% lengkap — hasil "unknown" berarti
// "tidak ditemukan di referensi kami", BUKAN otomatis berarti kode itu salah.
function findICD10Category3(code) {
  const m = /^([A-Z]\d{2})/i.exec((code || "").trim());
  if (!m) return { known: false };
  const root = m[1].toUpperCase();
  if (ICD10_CAT3[root]) return { known: true, title: ICD10_CAT3[root] };
  return { known: false };
}
function findICD9Category(code) {
  const m = /^(\d{2})(\.\d{1,2})?$/.exec((code || "").trim());
  if (!m) return { valid: false };
  const cat = m[1];
  if (ICD9_CATEGORIES[cat]) return { valid: true, title: ICD9_CATEGORIES[cat] };
  return { valid: false };
}
// Cek kode prosedur spesifik 3-4 digit terhadap daftar lengkap (~3.972 kode).
// Sama seperti ICD-10 di atas: "unknown" = tidak ditemukan di referensi, bukan vonis salah.
function findICD9ProcExact(code) {
  const c = (code || "").trim();
  if (ICD9_PROC_FULL[c]) return { known: true, title: ICD9_PROC_FULL[c] };
  return { known: false };
}
// suffix kode INA-CBG (I/II/III/0) — dipetakan ke severity
function inacbgSuffix(code) {
  const parts = (code || "").trim().toUpperCase().split("-");
  const last = parts[parts.length - 1];
  if (["I", "II", "III"].includes(last)) return last;
  return null; // 0 atau format lain = tidak ada gradasi severity
}

/* ----------------------------------------------------------------------
   SISTEM PENGAMAN DATA — cek kewajaran data sebelum/selama diskrining.
   Dirancang khusus untuk menangkap kesalahan hasil ekstraksi AI (mis. AI
   membaca "Tanggal Kontrol" sebagai "Tanggal Keluar" sehingga LOS jadi
   puluhan/ratusan hari) SEBELUM klaim ikut mempengaruhi skor atau statistik.
   Dipakai di 3 titik: pratinjau unggah batch, input manual, dan hasil skrining.
---------------------------------------------------------------------- */
function sanityCheckClaim(claim) {
  const issues = [];
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const masuk = claim.tglMasuk ? new Date(claim.tglMasuk) : null;
  const keluar = claim.tglKeluar ? new Date(claim.tglKeluar) : null;
  const los = Number(claim.los);
  const tarif = parseAngka(claim.tarifKlaim);

  if (masuk && !isNaN(masuk.getTime()) && masuk.getTime() > today.getTime()) {
    issues.push({ id: "sanityTglMasukFuture", label: "Tanggal masuk di masa depan", detail: `Tanggal masuk (${claim.tglMasuk}) tercatat setelah hari ini — kemungkinan salah baca tanggal (format DD-MM-YYYY vs MM-DD-YYYY, atau tertukar dengan field tanggal lain).` });
  }
  if (masuk && keluar && !isNaN(masuk.getTime()) && !isNaN(keluar.getTime()) && keluar.getTime() < masuk.getTime()) {
    issues.push({ id: "sanityTglTerbalik", label: "Tanggal keluar lebih awal dari tanggal masuk", detail: `Tanggal masuk ${claim.tglMasuk}, tanggal keluar ${claim.tglKeluar}. Urutan ini janggal secara kalender — ada baiknya dicek apakah salah satu tanggal tertukar dengan field lain di dokumen sumber.` });
  }
  if (!isNaN(los) && claim.los !== "" && (los < 0 || los > 60)) {
    issues.push({ id: "sanityLOS", label: "Lama rawat (LOS) tidak wajar", detail: `LOS tercatat ${claim.los} hari (${claim.tglMasuk || "?"} s.d. ${claim.tglKeluar || "?"}). Di luar rentang wajar rawat inap RS Kelas C. Sering disebabkan tanggal keluar tertukar dengan tanggal kontrol/follow-up atau field tanggal lain — verifikasi manual ke resume medis sebelum melanjutkan.` });
  }
  if (!claim.tarifKlaim || isNaN(tarif) || tarif <= 0) {
    issues.push({ id: "sanityTarifKosong", label: "Tarif klaim kosong atau nol", detail: "Field tarif tidak terbaca atau bernilai 0 — periksa apakah kolom tarif pada dokumen sumber terbaca dengan benar." });
  } else if (tarif < 50000) {
    issues.push({ id: "sanityTarifKecil", label: "Tarif klaim tidak wajar kecil", detail: `Rp${tarif.toLocaleString("id-ID")} sangat kecil untuk klaim INA-CBG rawat inap/jalan — kemungkinan salah baca angka (mis. titik ribuan hilang).` });
  } else if (tarif > 300000000) {
    issues.push({ id: "sanityTarifBesar", label: "Tarif klaim tidak wajar besar", detail: `Rp${tarif.toLocaleString("id-ID")} jauh di atas kewajaran umum — periksa kembali kecuali memang kasus katastropik/Special CMG yang terverifikasi.` });
  }
  if (!claim.noRM || claim.noRM.trim().length < 2) {
    issues.push({ id: "sanityNoRM", label: "No. Rekam Medis kosong/tidak lengkap", detail: "No. RM tidak terbaca dengan baik dari dokumen sumber." });
  }
  if (!claim.primaryDxCode || !claim.primaryDxCode.trim()) {
    issues.push({ id: "sanityDxKosong", label: "Diagnosis utama kosong", detail: "Kode diagnosis utama tidak ditemukan — klaim ini tidak bisa diskrining dengan akurat tanpa diagnosis utama." });
  }
  if (claim.inacbgCode && claim.inacbgCode.trim() && !/^[A-Z]-\d{1,2}-\d{1,2}-[IVX0]+$/i.test(claim.inacbgCode.trim())) {
    issues.push({ id: "sanityKodeFormat", label: "Format kode INA-CBG tidak lazim", detail: `"${claim.inacbgCode}" tidak mengikuti pola umum huruf-angka-angka-severity (mis. A-4-10-III) — periksa kemungkinan salah ketik/salah baca.` });
  }
  return issues;
}

   SEP tidak lengkap bisa membuat klaim ditolak verifikator BPJS meski secara

// lumrah kosong pada kunjungan tanpa rujukan, jadi tidak dihitung sebagai kekurangan)
const SEP_REQUIRED_FIELDS = ["noSep", "tglSep", "noKartu", "dokter", "diagnosaAwal", "jenisKunjungan", "kelasHak", "penjamin", "noTelepon"];

function sepCompletenessCheck(claim) {
  if (!claim.sep) return [];
  const isBlank = (v) => !v || v.trim() === "" || v.trim() === "-";
  const missing = SEP_REQUIRED_FIELDS.filter((f) => isBlank(claim.sep[f]));
  if (missing.length === 0) return [];
  return [{
    id: "sepIncomplete",
    label: `SEP tidak lengkap — ${missing.length} field kosong`,
    detail: `Field berikut kosong/tidak terisi pada SEP: ${missing.map((f) => SEP_FIELD_LABELS[f]).join(", ")}. SEP yang tidak lengkap berisiko ditolak verifikator BPJS meski secara klinis/koding klaim sudah benar — koordinasikan dengan petugas BPJS Center untuk melengkapi.`,
  }];
}

/* ----------------------------------------------------------------------
   RULE ENGINE
---------------------------------------------------------------------- */
// Baca vonis "Risiko Pending" dari teks opini AI (baris terakhir yang diwajibkan
// prompt). Dipakai supaya hasil telaah AI atas ISI berkas (resume, CPPT, lab,
// radiologi) ikut menentukan label risiko — bukan cuma teks yang dibaca manual.
function bacaRisikoPendingAI(teks, status) {
  if (status !== "done" || !teks) return { level: null, alasan: "" };
  const m = String(teks).match(/Risiko\s+Pending\s*:?\s*\**\s*:?\s*\**\s*(TINGGI|SEDANG|RENDAH)\b\**\s*[—–\-:]*\s*([^\n]*)/i);
  if (!m) return { level: null, alasan: "" };
  const mentah = m[2].replace(/[*_\[\]]+/g, "").trim();
  let alasan = mentah.replace(/^[\s,;:.\-—–]+/, "").trim();
  if (alasan.length < 20 || /^[,;:.]/.test(mentah)) {
    // format jawaban tidak rapi → pakai poin pertama "Area yang Perlu Diverifikasi"
    const poin = String(teks).match(/Area yang Perlu Diverifikasi[^\n]*\n+\s*1\.\s*([^\n]+)/i);
    if (poin) alasan = poin[1].replace(/[*_\[\]]+/g, "").trim();
  }
  return { level: m[1].toUpperCase(), alasan: alasan.slice(0, 300) };
}

  { re: /\bsyok\b|\bshock\b/i, ada: (dx) => dx.some((c) => /^(R57|R65\.1|A4[01]|T78\.2|T79\.4|O75\.1|T81\.1|T88\.2)/.test(c)), saran: "R57.x/R65.1 Syok sesuai jenisnya" },
  { re: /sepsis/i, ada: (dx) => dx.some((c) => /^(A4[01]|O85|P36|R65\.1|A02\.1|A32\.7|B37\.7)/.test(c)), saran: "A41.x Sepsis (bila kriteria terpenuhi)" },
  { re: /\bAKI\b|gagal\s+ginjal\s+akut|acute\s+kidney/i, ada: (dx) => dx.some((c) => /^(N17|O90\.4)/.test(c)), saran: "N17.9 Gagal ginjal akut" },
  { re: /\bCKD\b|gagal\s+ginjal\s+kronik|chronic\s+kidney/i, ada: (dx) => dx.some((c) => /^(N18|N19|I12|I13)/.test(c)), saran: "N18.x Penyakit ginjal kronik" },
  { re: /diabetes|\bDM\b/i, ada: (dx) => dx.some((c) => /^(E1[0-4]|O24)/.test(c)), saran: "E11.x Diabetes melitus (digit ke-4 sesuai komplikasi)" },
  { re: /hipertensi|\bHT\b/i, ada: (dx) => dx.some((c) => /^(I1[0-5]|O1[0-6])/.test(c)), saran: "I10–I15 Hipertensi" },
  { re: /\bCHF\b|gagal\s+jantung|heart\s+failure/i, ada: (dx) => dx.some((c) => /^(I50|I11\.0|I13\.[02])/.test(c)), saran: "I50.x Gagal jantung" },
  { re: /\bPPOK\b|\bCOPD\b/i, ada: (dx) => dx.some((c) => /^J44/.test(c)), saran: "J44.x PPOK" },
  { re: /anemia/i, ada: (dx) => dx.some((c) => /^(D5\d|D6[0-4]|O99\.0)/.test(c)), saran: "D50–D64 Anemia (bila Hb rendah & ditatalaksana)" },
  { re: /hipokalemi|hypokalemi/i, ada: (dx) => dx.some((c) => /^E87\.6/.test(c)), saran: "E87.6 Hipokalemia" },
  { re: /hiponatremi|hyponatremi/i, ada: (dx) => dx.some((c) => /^E87\.1/.test(c)), saran: "E87.1 Hiponatremia" },
  { re: /hipoglikemi/i, ada: (dx) => dx.some((c) => /^(E16\.[0-2]|E1[0-4]\.6)/.test(c)), saran: "E16.x / E1x.6 Hipoglikemia" },
  // Obat yang menyiratkan kondisi yang belum dikode (diberikan di RS / saat pulang)
  { re: /amlodipin|captopril|kaptopril|lisinopril|ramipril|candesartan|valsartan|losartan|irbesartan|telmisartan|nifedipin|hidroklorotiazid/i, ada: (dx) => dx.some((c) => /^(I1[0-5]|I2[0-5]|I50|O1[0-6])/.test(c)), saran: "I10 Hipertensi esensial (obat antihipertensi diberikan — kode bila hipertensi ditegakkan DPJP & ditatalaksana)" },
  { re: /rifampi|isoniazid|\bINH\b|pirazinamid|etambutol|\bOAT\b/i, ada: (dx) => dx.some((c) => /^(A1[5-9]|B90|Z20\.1)/.test(c)), saran: "A15.x/A16.x Tuberkulosis (obat anti-TB diberikan)" },
  { re: /allopurinol/i, ada: (dx) => dx.some((c) => /^(E79|M10|N18)/.test(c)), saran: "E79.0 Hiperurisemia / M10.x Gout (allopurinol diberikan)" },
  { re: /\bKSR\b|KCl\b|kalium\s+klorida/i, ada: (dx) => dx.some((c) => /^E87\.6/.test(c)), saran: "E87.6 Hipokalemia (suplemen kalium diberikan)" },
  { re: /NaCl\s*3\s*%|nacl\s+3%/i, ada: (dx) => dx.some((c) => /^E87\.1/.test(c)), saran: "E87.1 Hiponatremia (NaCl 3% diberikan)" },
  { re: /nephrolit|batu\s+ginjal|nefrolit/i, ada: (dx) => dx.some((c) => /^(N2[0-3])/.test(c)), saran: "N20.0 Batu ginjal (bila ditegakkan — kesan radiologi \"DD\" saja wajib dikonfirmasi DPJP)" },
];

// Kondisi kronis yang lazim terus ada lintas episode — dipakai membaca RIWAYAT pasien.
const POLA_KRONIS = /^(E1[0-4]|I1[0-5]|I25|I48|I50|N18|J44|J45|A1[5-9]|B2[0-4]|C\d|G40|E05|I69|F2\d)/;

function deteksiCDI(claim, allClaims) {
  const hasil = [];
  const dx = [claim.primaryDxCode, ...(claim.secondaryDx || []).map((d) => d.code)]
    .map((c) => String(c || "").trim().toUpperCase()).filter(Boolean);
  const pr = (claim.procedures || []).map((p) => String(p.code || "").trim()).filter(Boolean);
  const isRJ = claim.jenisRawat === "Rawat Jalan";

  // 1. Tindakan yang tercatat tanpa diagnosis yang lazim menjadi indikasinya
  TINDAKAN_BUTUH_DX.forEach((t) => {
    const tind = pr.filter((p) => t.kode.test(p));
    if (tind.length && !dx.some((c) => t.dx.test(c))) {
      hasil.push({ id: "cdi-tindakan", label: `CDI: ${t.nama} (${tind.join(", ")}) tanpa diagnosis indikasinya`,
        detail: `Tindakan ${t.nama} tercatat, tetapi belum ada diagnosis yang lazim menjadi indikasinya. Saran: ${t.saran}. Bila kondisinya terdokumentasi & ditatalaksana → kode sebagai diagnosis (kalau terlewat = potensi downcoding, RS rugi). Bila belum terdokumentasi → lengkapi catatan DPJP, karena tindakan tanpa indikasi tertulis berisiko pending.` });
    }
  });

  // 2. Kondisi yang TERTULIS di ringkasan klinis berkas tapi belum ada kodenya
  const teks = String(claim.resumeMedis || "");
  if (teks.length > 20) {
    KATA_KUNCI_CDI.forEach((k) => {
      const m = teks.match(k.re);
      if (!m || k.ada(dx, pr)) return;
      const i = m.index;
      const sebelum = teks.slice(Math.max(0, i - 25), i).toLowerCase();
      const sesudah = teks.slice(i + m[0].length, i + m[0].length + 12).toLowerCase();
      // Abaikan yang jelas disangkal/negatif ("riwayat DM (-)", "tidak ada sesak", dll)
      if (/(tidak|tanpa|bukan|disangkal|negatif|riwayat keluarga)\s*\S*\s*$/.test(sebelum)) return;
      if (/^\s*[:=]?\s*(\(-\)|-\/-|negatif|tidak)/.test(sesudah)) return;
      const ragu = /\b(dd|susp\.?|suspek|curiga|kemungkinan|r\/o)\s*\S*\s*$/.test(sebelum);
      const kutip = teks.slice(Math.max(0, i - 40), Math.min(teks.length, i + m[0].length + 40)).replace(/\s+/g, " ").trim();
      hasil.push({ id: "cdi-kata", label: `CDI: "${m[0]}" tertulis di berkas tapi belum dikode${ragu ? " (masih diagnosis banding)" : ""}`,
        detail: `Kutipan: "…${kutip}…". Saran kode: ${k.saran}. ${ragu ? "Masih ditulis sebagai kemungkinan/diagnosis banding — buat query ke DPJP untuk konfirmasi; jangan dikode sebelum ditegakkan." : "Kode hanya bila kondisi ini ditegakkan DPJP DAN memengaruhi tatalaksana/pemeriksaan/lama rawat (Permenkes 26/2021). Kalau terlewat = potensi downcoding."}` });
    });
  }

  // 3. RIWAYAT PASIEN: kondisi kronis yang dikode di episode rawat inap sebelumnya
  //    tapi tidak muncul di episode ini
  if (!isRJ && claim.noRM && claim.tglMasuk) {
    const kat = (c) => c.slice(0, 3);
    const sekarang = new Set(dx.map(kat));
    const temuan = {};
    (allClaims || []).forEach((o) => {
      if (o.id === claim.id || o.noRM !== claim.noRM || !o.tglMasuk || String(o.tglMasuk) >= String(claim.tglMasuk)) return;
      [o.primaryDxCode, ...(o.secondaryDx || []).map((d) => d.code)].forEach((c) => {
        const k = String(c || "").trim().toUpperCase();
        if (!k || !POLA_KRONIS.test(k) || sekarang.has(kat(k))) return;
        if (!temuan[k] || temuan[k] < o.tglMasuk) temuan[k] = o.tglMasuk;
      });
    });
    Object.entries(temuan).slice(0, 6).forEach(([kode, tgl]) => {
      hasil.push({ id: "cdi-riwayat", label: `CDI riwayat pasien: ${kode} pernah dikode (episode ${tgl}) — tidak ada di episode ini`,
        detail: `Kondisi kronis ${kode} tercatat pada episode sebelumnya pasien No. RM ${claim.noRM}. Bila di episode ini kondisi tsb masih ada DAN ditatalaksana/dipantau (mis. obat rutin dilanjutkan, cek gula darah/tensi), wajib dikode sebagai diagnosis sekunder — kalau terlewat = potensi downcoding. Kalau tidak ditatalaksana di episode ini, JANGAN dikode hanya karena riwayat.` });
    });
  }
  return hasil;
}

// Blok saran koding terstruktur yang diletakkan AI di akhir opininya.
function bacaSaranKodingAI(teks) {
  const m = String(teks || "").match(/<<<SARAN_KODING\s*([\s\S]*?)\s*SARAN_KODING>>>/);
  if (!m) return null;
  try {
    const o = parseJsonLonggar(m[1]);
    return o && typeof o === "object" && !Array.isArray(o) ? o : null;
  } catch (e) { return null; }
}
function teksOpiniTanpaBlok(teks) {
  return String(teks || "").replace(/<<<SARAN_KODING[\s\S]*?(SARAN_KODING>>>|$)/, "").trim();
}
function escHtml(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// REKAP REKOMENDASI — gabungan saran kode (AI), penunjang, terapi, layanan &
// administrasi (AI + aturan sistem) per klaim, dikelompokkan per DPJP dan per unit,
// dengan kolom keputusan & paraf. Dipakai utk rapat koder–DPJP & tindak lanjut unit.
// ============================================================================
const ASPEK_LAYANAN_AI = ["Penunjang", "Terapi", "Layanan"];
function rekomendasiLayananAI(s) {
  const arr = s && Array.isArray(s.rekomendasiLayanan) ? s.rekomendasiLayanan : [];
  return arr
    .filter((r) => r && typeof r === "object" && (String(r.temuan || "").trim() || String(r.saran || "").trim()))
    .map((r) => {
      const a = String(r.aspek || "").trim();
      const aspek = ASPEK_LAYANAN_AI.find((x) => x.toLowerCase() === a.toLowerCase()) || "Layanan";
      return { aspek, temuan: String(r.temuan || "").trim(), saran: String(r.saran || "").trim(), unitTerkait: String(r.unitTerkait || "").trim() };
    });
}

function kumpulkanRekomendasi(claim) {
  const up = (x) => String(x || "").trim().toUpperCase();
  const s = claim.aiStatus === "done" ? bacaSaranKodingAI(claim.aiAnalysis) : null;
  const koding = [];
  const layanan = [];
  if (s) {
    const du = s.diagnosisUtama || {};
    if (du.kodeSaran && up(du.kodeSaran) !== up(claim.primaryDxCode)) {
      koding.push({ jenis: "Ganti DU", kode: `${claim.primaryDxCode || "-"} → ${du.kodeSaran}`, uraian: [du.deskripsi, du.alasan].filter(Boolean).join(" — "), bukti: du.bukti || "", sumber: "AI" });
    }
    (s.diagnosisSekunderTambah || []).filter((d) => d && d.kode).forEach((d) => koding.push({ jenis: "+ Dx sekunder", kode: d.kode, uraian: [d.deskripsi, d.alasan].filter(Boolean).join(" — "), bukti: d.bukti || "", sumber: "AI" }));
    (s.diagnosisSekunderHapus || []).filter((d) => d && d.kode).forEach((d) => koding.push({ jenis: "− Dx sekunder", kode: d.kode, uraian: d.alasan || "", bukti: "", sumber: "AI" }));
    (s.prosedurTambah || []).filter((p) => p && p.kode).forEach((p) => koding.push({ jenis: "+ Prosedur", kode: p.kode, uraian: p.deskripsi || "", bukti: p.bukti || "", sumber: "AI" }));
    (s.prosedurHapus || []).filter((p) => p && p.kode).forEach((p) => koding.push({ jenis: "− Prosedur", kode: p.kode, uraian: p.alasan || "", bukti: "", sumber: "AI" }));
    rekomendasiLayananAI(s).forEach((r) => layanan.push({ ...r, sumber: "AI" }));
  }
  (claim.flags || []).forEach((f) => {
    const m = RULE_ASPEK[f.id];
    if (!m) return;
    if (m[0] === "Koding") koding.push({ jenis: "Temuan sistem", kode: "", uraian: `${f.label} — ${m[1]}`, bukti: "", sumber: "Sistem" });
    else layanan.push({ aspek: m[0], temuan: f.label, saran: m[1], unitTerkait: m[2], sumber: "Sistem" });
  });
  (claim.notes || []).filter((n) => String(n.id || "").indexOf("cdi") === 0).forEach((n) => {
    if (n.id === "cdi-riwayat") koding.push({ jenis: "CDI riwayat", kode: "", uraian: `${n.label} — kode hanya bila di episode ini ditatalaksana/dipantau`, bukti: "", sumber: "Sistem" });
    else layanan.push({ aspek: "Terapi", temuan: n.label, saran: "Konfirmasi ke DPJP: kode bila terdokumentasi & ditatalaksana, atau lengkapi indikasi tertulis", unitTerkait: "DPJP", sumber: "Sistem" });
  });
  daftarInkonsistensi(claim).filter((it) => it.status === "Belum ditindaklanjuti" || it.status === "Dikonfirmasi — perlu perbaikan").forEach((it) => {
    layanan.push({ aspek: "Administrasi", temuan: `${it.kategori}: ${it.dokumenA} "${it.isiA}" vs ${it.dokumenB} "${it.isiB}"`, saran: it.dampak || "Selaraskan isi dokumen", unitTerkait: it.unitTerkait || "Rekam Medis", sumber: "Inkonsistensi" });
  });
  const query = s ? (s.queryDPJP || []).filter((q) => q && String(q).trim()).map((q) => String(q).trim()) : [];
  return { koding, layanan, query, dampak: s ? String(s.perkiraanDampak || "") : "", aiSelesai: !!s, ada: koding.length + layanan.length + query.length > 0 };
}

function rekapRekomendasiHtml(claims, opsi) {
  const o = opsi || {};

  const data = claims.map((c) => ({ c, r: kumpulkanRekomendasi(c) }))
    .filter((x) => !o.hanyaAda || x.r.ada)
    .sort((a, b) => String(a.c.dpjp || "~").localeCompare(String(b.c.dpjp || "~")) || (urutRisiko[a.c.riskLevel] - urutRisiko[b.c.riskLevel]) || (b.c.score - a.c.score));

  const tgl = data.map((x) => x.c.tglMasuk).filter(Boolean).sort();

  const periode = tgl.length ? `${tgl[0]} s.d. ${tglK[tglK.length - 1]}` : "-";
  const belumAI = data.filter((x) => !x.r.aiSelesai).length;

  const perDPJP = {};
  data.forEach((x) => { const k = x.c.dpjp || "(DPJP belum diisi)"; (perDPJP[k] = perDPJP[k] || []).push(x); });

  const ringkasan = `
  <div class="hal">
    <div class="sub">${e(namaRSAktif())} — Rekap Rekomendasi Hasil Skrining Klaim INA-CBG</div>

    <table class="tb"><tr>
      <th style="${th}">Klaim direkap</th><th style="${th}">Ganti DU</th><th style="${th}">+ Dx sek.</th><th style="${th}">− Dx sek.</th><th style="${th}">± Prosedur</th>
      <th style="${th}">Penunjang</th><th style="${th}">Terapi</th><th style="${th}">Layanan</th><th style="${th}">Administrasi</th><th style="${th}">Query DPJP</th></tr>
      <tr><td style="${td}"><b>${data.length}</b></td><td style="${td}">${jmlKoding("Ganti DU")}</td><td style="${td}">${jmlKoding("+ Dx sekunder")}</td><td style="${td}">${jmlKoding("− Dx sekunder")}</td>
      <td style="${td}">${jmlKoding("+ Prosedur") + jmlKoding("− Prosedur")}</td><td style="${td}">${jmlAspek("Penunjang")}</td><td style="${td}">${jmlAspek("Terapi")}</td><td style="${td}">${jmlAspek("Layanan")}</td>
      <td style="${td}">${jmlAspek("Administrasi")}</td><td style="${td}">${hitung((x) => x.r.query.length)}</td></tr></table>
    ${belumAI ? `<p class="peringatan">${belumAI} klaim belum dijalankan Opini AI — rekomendasinya hanya dari aturan sistem (tanpa saran kode diagnosis/prosedur). Jalankan AI dulu agar rekap lengkap.</p>` : ""}
    <h3>Rekap per DPJP</h3>
    <table class="tb"><tr><th style="${th}">DPJP</th><th style="${th}">Klaim</th><th style="${th}">Risiko Tinggi</th><th style="${th}">Risiko Sedang</th><th style="${th}">Saran koding</th><th style="${th}">Penunjang/Terapi/Layanan</th><th style="${th}">Query</th></tr>
      ${Object.keys(perDPJP).map((k) => { const g = perDPJP[k]; return `<tr><td style="${td}">${e(k)}</td><td style="${td}">${g.length}</td><td style="${td}">${g.filter((x) => x.c.riskLevel === "Tinggi").length}</td><td style="${td}">${g.filter((x) => x.c.riskLevel === "Sedang").length}</td><td style="${td}">${g.reduce((n, x) => n + x.r.koding.length, 0)}</td><td style="${td}">${g.reduce((n, x) => n + x.r.layanan.filter((l) => l.aspek !== "Administrasi").length, 0)}</td><td style="${td}">${g.reduce((n, x) => n + x.r.query.length, 0)}</td></tr>`; }).join("")}
    </table>
    <h3>Cara memakai lembar ini</h3>
    <ol class="ket">
      <li>Koder/Casemix menyerahkan lembar per DPJP. DPJP menelaah setiap rekomendasi terhadap rekam medis.</li>
      <li>DPJP mencentang keputusan dan menulis catatan. Bila setuju, kondisi/indikasi WAJIB dituliskan di rekam medis (resume/CPPT), bukan hanya diparaf di lembar ini.</li>
      <li>Setelah rekam medis direvisi, koder menerapkan kode di sistem (tombol "Terapkan ke klaim"), melakukan grouping ulang di e-Klaim, lalu menjalankan skrining ulang.</li>
      <li>Item penunjang/terapi/layanan/administrasi diteruskan ke unit terkait (lihat Daftar Tindak Lanjut per Unit).</li>
    </ol>
    <p class="kaki">Rekomendasi adalah hasil skrining otomatis (aturan + AI), bukan keputusan final. Kode hanya boleh ditambah/diubah bila didukung dokumentasi klinis tertulis — bukan untuk menaikkan nilai klaim.</p>
  </div>`;

  let no = 0;
  const kartu = (x) => {
    no += 1;
    const c = x.c, r = x.r;
    const sek = (c.secondaryDx || []).map((d) => d.code).filter(Boolean).join(", ") || "-";
    const px = (c.procedures || []).map((p) => p.code).filter(Boolean).join(", ") || "-";
    const kodingRows = r.koding.length
      ? `<table class="tb"><tr><th style="${th} width:15%;">Rekomendasi</th><th style="${th} width:15%;">Kode</th><th style="${th}">Uraian &amp; bukti tertulis</th></tr>${r.koding.map((k) => `<tr><td style="${td}">${e(k.jenis)}</td><td style="${td} font-family:monospace; font-weight:bold;">${e(k.kode)}</td><td style="${td}">${e(k.uraian)}${k.bukti ? `<br><i>Bukti: "${e(k.bukti)}"</i>` : ""}</td></tr>`).join("")}</table>`
      : `<p class="ket">Tidak ada saran perubahan kode.</p>`;
    const layananRows = r.layanan.length
      ? `<table class="tb"><tr><th style="${th} width:13%;">Aspek</th><th style="${th}">Temuan</th><th style="${th}">Saran tindak lanjut</th><th style="${th} width:13%;">Unit</th></tr>${r.layanan.map((l) => `<tr><td style="${td}"><b>${e(l.aspek)}</b></td><td style="${td}">${e(l.temuan)}</td><td style="${td}">${e(l.saran)}</td><td style="${td}">${e(l.unitTerkait)}</td></tr>`).join("")}</table>`
      : "";
    return `<div class="kartu">
      <div class="kepala"><b>${no}. ${e(c.namaPasien || "-")}</b> · RM ${e(c.noRM)} · ${e(c.tglMasuk || "")}${c.tglKeluar && c.tglKeluar !== c.tglMasuk ? "–" + e(c.tglKeluar) : ""} · ${e(c.jenisRawat || "Rawat Inap")} · <span style="font-family:monospace;">${e(c.inacbgCode || "-")}</span>
        <span class="lencana" style="background:${riskBgHex(c.riskLevel)}; color:${riskColorHex(c.riskLevel)};">Risiko ${e(c.riskLevel)} (${c.score})</span></div>
      <div class="ket">Kode saat ini — DU: <b>${e(c.primaryDxCode || "-")}</b> ${e(c.primaryDxDesc || "")} · Dx sekunder: ${e(sek)} · Prosedur: ${e(px)}${r.aiSelesai ? "" : " · <i>Opini AI belum dijalankan</i>"}</div>
      ${kodingRows}
      ${layananRows}
      ${r.query.length ? `<div class="query"><b>Pertanyaan ke DPJP:</b><ol>${r.query.map((q) => `<li>${e(q)}</li>`).join("")}</ol></div>` : ""}
      ${r.dampak ? `<p class="ket"><b>Perkiraan dampak:</b> ${e(r.dampak)}</p>` : ""}
      <table class="tb keputusan"><tr>
        <td style="${td} width:58%;"><b>Keputusan DPJP:</b> &#9744; Setuju &nbsp; &#9744; Setuju sebagian &nbsp; &#9744; Tidak setuju &nbsp; &#9744; RM perlu direvisi<br><br>Catatan: ..................................................................................</td>
        <td style="${td}">Paraf DPJP<br><br><br>Tgl:</td><td style="${td}">Paraf Koder<br><br><br>Tgl:</td></tr></table>
    </div>`;
  };

  const bagianDPJP = o.perDPJP !== false
    ? Object.keys(perDPJP).map((k) => `<div class="hal"><div class="sub">Lembar Rekomendasi &amp; Konfirmasi DPJP</div><h2>${e(k)} — ${perDPJP[k].length} klaim</h2>${perDPJP[k].map(kartu).join("")}
        <table class="tb" style="margin-top:14px;"><tr><td style="${td} height:60px;">Mengetahui DPJP,<br><br><br>( ${e(k)} )</td><td style="${td}">Koder / Casemix,<br><br><br>( ................................ )</td><td style="${td}">Kepala Rekam Medis / Komite Medik,<br><br><br>( ................................ )</td></tr></table></div>`).join("")
    : `<div class="hal">${data.map(kartu).join("")}</div>`;

  let bagianUnit = "";
  if (o.perUnit !== false) {
    const perUnit = {};
    data.forEach((x) => x.r.layanan.forEach((l) => { const u = l.unitTerkait || "Belum ditentukan"; (perUnit[u] = perUnit[u] || []).push({ c: x.c, l }); }));
    const units = Object.keys(perUnit).sort();
    if (units.length) {
      bagianUnit = `<div class="hal"><div class="sub">Daftar Tindak Lanjut per Unit</div><h2>Penunjang, Terapi, Layanan &amp; Administrasi</h2>
        ${units.map((u) => `<h3>${e(u)} — ${perUnit[u].length} item</h3><table class="tb"><tr><th style="${th} width:20%;">Pasien / RM</th><th style="${th} width:11%;">Aspek</th><th style="${th}">Temuan</th><th style="${th}">Saran</th><th style="${th} width:11%;">Selesai</th></tr>
          ${perUnit[u].map(({ c, l }) => `<tr><td style="${td}">${e(c.namaPasien || "-")}<br>RM ${e(c.noRM)} · ${e(c.dpjp || "")}</td><td style="${td}">${e(l.aspek)}</td><td style="${td}">${e(l.temuan)}</td><td style="${td}">${e(l.saran)}</td><td style="${td}">&#9744; Tgl:</td></tr>`).join("")}</table>`).join("")}</div>`;
    }
  }

  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Rekap Rekomendasi Skrining INA-CBG</title>
    <style>
      @page { size: A4; margin: 12mm; }
      body { margin:0; font-family: Arial, Helvetica, sans-serif; color:#0F2A3D; font-size:10.5px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

      .hal:last-child { page-break-after: auto; }

      .ket { font-size:10px; color:#334652; margin:4px 0; } .kaki { font-size:9px; color:#94A3AC; margin-top:14px; }
      .peringatan { font-size:10px; background:#FCF1DD; color:#9A6300; padding:6px 8px; border-radius:4px; }
      .tb { width:100%; border-collapse:collapse; margin:5px 0; font-size:10px; }
      .kartu { border:1px solid #9FB3BD; border-radius:6px; padding:8px 10px; margin-bottom:10px; page-break-inside: avoid; }

      .query { background:#FBF8F0; border:1px solid #F0E6C8; border-radius:4px; padding:4px 8px; margin:5px 0; font-size:10px; } .query ol { margin:2px 0 0 16px; padding:0; }
      .keputusan td { font-size:10px; }
    </style></head><body>${ringkasan}${bagianDPJP}${bagianUnit}</body></html>`;
}

function bukaJendelaCetak(html, namaFile) {
  let win = null;
  try { win = window.open("", "_blank"); } catch (e) { win = null; }
  if (win && !win.closed) {
    try {
      win.document.write(html);
      win.document.close();
      setTimeout(() => { win.focus(); win.print(); }, 400);
      return;
    } catch (e) { /* lanjut ke unduhan */ }
  }
  try {
    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = namaFile;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    alert("Tab baru diblokir browser — file cetak sudah diunduh sebagai HTML. Buka file itu lalu tekan Ctrl+P untuk mencetak atau menyimpan sebagai PDF.");
  } catch (e2) {
    alert("Gagal membuat berkas cetak: " + (e2 && e2.message ? e2.message : "kesalahan tidak diketahui"));
  }
}

function eksporRekapRekomendasi(claims, hanyaAda) {
  const rows = [];
  claims.forEach((c) => {
    const r = kumpulkanRekomendasi(c);
    if (hanyaAda && !r.ada) return;
    const dasar = { no_rm: c.noRM, nama_pasien: c.namaPasien, dpjp: c.dpjp, tgl_masuk: c.tglMasuk, tgl_keluar: c.tglKeluar, jenis_rawat: c.jenisRawat, kode_inacbg: c.inacbgCode, risiko: c.riskLevel, skor: c.score };
    const isi = { keputusan_dpjp: "", catatan: "", status_tindak_lanjut: "Belum ditindaklanjuti" };
    r.koding.forEach((k) => rows.push({ ...dasar, kategori: "Koding", jenis: k.jenis, kode: k.kode, temuan_uraian: k.uraian, saran: "", bukti: k.bukti, unit: "Casemix/DPJP", sumber: k.sumber, ...isi }));
    r.layanan.forEach((l) => rows.push({ ...dasar, kategori: l.aspek, jenis: "", kode: "", temuan_uraian: l.temuan, saran: l.saran, bukti: "", unit: l.unitTerkait, sumber: l.sumber, ...isi }));
    r.query.forEach((q) => rows.push({ ...dasar, kategori: "Query DPJP", jenis: "", kode: "", temuan_uraian: q, saran: "", bukti: "", unit: "DPJP", sumber: "AI", ...isi }));
  });
  if (!rows.length) { alert("Tidak ada rekomendasi untuk diekspor pada cakupan ini."); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Rekap Rekomendasi");
  XLSX.writeFile(wb, `rekap_rekomendasi_inacbg_${new Date().toISOString().slice(0, 10)}.xlsx`);
}

  return `<h4 style="font-size:13px; margin:14px 0 6px;">Rekomendasi Koding AI (wajib verifikasi koder & DPJP)</h4>

      <tr><td style="border:1px solid #ddd; padding:4px 8px; width:28%;"><b>Diagnosis utama</b></td><td style="border:1px solid #ddd; padding:4px 8px;">${ganti ? `${escHtml(claim.primaryDxCode)} → <b>${escHtml(du.kodeSaran)}</b> ${escHtml(du.deskripsi)}` : `${escHtml(claim.primaryDxCode)} — sudah tepat`}${du.alasan ? `<br><i>${escHtml(du.alasan)}</i>` : ""}${du.bukti ? `<br>Bukti: "${escHtml(du.bukti)}"` : ""}</td></tr>

      ${baris(s.diagnosisSekunderHapus, (d) => `<tr><td style="border:1px solid #ddd; padding:4px 8px;">− Dx sekunder</td><td style="border:1px solid #ddd; padding:4px 8px;"><b>${escHtml(d.kode)}</b> — ${escHtml(d.alasan)}</td></tr>`)}
      ${baris(s.prosedurTambah, (p) => `<tr><td style="border:1px solid #ddd; padding:4px 8px;">+ Prosedur</td><td style="border:1px solid #ddd; padding:4px 8px;"><b>${escHtml(p.kode)}</b> ${escHtml(p.deskripsi)}${p.bukti ? ` — Bukti: "${escHtml(p.bukti)}"` : ""}</td></tr>`)}
      ${baris(s.prosedurHapus, (p) => `<tr><td style="border:1px solid #ddd; padding:4px 8px;">− Prosedur</td><td style="border:1px solid #ddd; padding:4px 8px;"><b>${escHtml(p.kode)}</b> — ${escHtml(p.alasan)}</td></tr>`)}
      ${(s.queryDPJP || []).filter((q) => q && String(q).trim()).map((q) => `<tr><td style="border:1px solid #ddd; padding:4px 8px;">Query ke DPJP</td><td style="border:1px solid #ddd; padding:4px 8px;">${escHtml(q)}</td></tr>`).join("")}
      ${rekomendasiLayananAI(s).map((r) => `<tr><td style="border:1px solid #ddd; padding:4px 8px;">${escHtml(r.aspek)}</td><td style="border:1px solid #ddd; padding:4px 8px;">${escHtml(r.temuan)}${r.saran ? ` → <b>${escHtml(r.saran)}</b>` : ""}${r.unitTerkait ? ` <i>(${escHtml(r.unitTerkait)})</i>` : ""}</td></tr>`).join("")}
      ${s.perkiraanDampak ? `<tr><td style="border:1px solid #ddd; padding:4px 8px;">Perkiraan dampak</td><td style="border:1px solid #ddd; padding:4px 8px;">${escHtml(s.perkiraanDampak)}</td></tr>` : ""}

// ============================================================================
// KAJIAN INKONSISTENSI DOKUMEN — ketidaksesuaian antar dokumen rekam medis yang
// ditemukan AI (mis. GCS triase vs CPPT, ruang rawat, jam meninggal, tanggal
// kontrol pada pasien meninggal) DIARSIPKAN per klaim, bisa ditindaklanjuti, dan
// direkap lintas klaim sbg bahan kajian mutu RS (Rekam Medis, PMKP, Komite Medik).
// ============================================================================
const KATEGORI_INKONSISTENSI = ["Waktu/jam", "Ruang rawat", "Klinis (GCS/tanda vital/diagnosis)", "Keadaan/cara pulang", "Identitas pasien", "Tindakan/obat", "Tanda tangan/otentikasi", "Administrasi lain"];
const STATUS_TINDAK_LANJUT = ["Belum ditindaklanjuti", "Dikonfirmasi — perlu perbaikan", "Sudah diperbaiki", "Bukan masalah (sesuai)"];

function kunciInkonsistensi(it) {
  return [it.kategori, it.dokumenA, it.dokumenB, it.isiA, it.isiB]
    .map((x) => String(x || "").trim().toLowerCase().replace(/\s+/g, " ")).join("|").slice(0, 240);
}
function ekstrakInkonsistensi(teksAI) {
  const s = bacaSaranKodingAI(teksAI);
  const arr = s && Array.isArray(s.inkonsistensi) ? s.inkonsistensi : [];
  const waktu = new Date().toISOString();
  return arr
    .filter((it) => it && typeof it === "object" && (String(it.isiA || "").trim() || String(it.isiB || "").trim()))
    .map((it) => ({
      kategori: KATEGORI_INKONSISTENSI.indexOf(it.kategori) >= 0 ? it.kategori : (it.kategori ? String(it.kategori) : "Administrasi lain"),
      dokumenA: String(it.dokumenA || ""), isiA: String(it.isiA || ""), dokumenB: String(it.dokumenB || ""), isiB: String(it.isiB || ""),
      unitTerkait: String(it.unitTerkait || "Belum ditentukan"), tingkat: ["Tinggi", "Sedang", "Rendah"].indexOf(it.tingkat) >= 0 ? it.tingkat : "Sedang",
      dampak: String(it.dampak || ""), ditemukan: waktu,
    }))
    .map((it) => ({ ...it, key: kunciInkonsistensi(it) }));
}
// Gabung arsip lama + temuan baru (tanpa duplikat) — temuan tidak hilang walau
// opini AI dijalankan ulang atau saran koding diterapkan.
function gabungInkonsistensi(lama, baru) {
  const out = [...(lama || [])];
  (baru || []).forEach((it) => { if (!out.some((x) => x.key === it.key)) out.push(it); });
  return out;
}
// Pemeriksaan inkonsistensi TERSTRUKTUR (tanpa AI) dari daftar tanggal & diagnosis per
// dokumen yang dicatat saat ekstraksi berkas: tanggal dokumen di luar episode rawat
// (termasuk format hari-bulan tertukar), dan diagnosis resume vs diagnosis yang dikode.
function tebakUnitDokumen(nama) {
  const n = String(nama || "");
  if (/triase|IGD|gawat/i.test(n)) return "IGD";
  if (/SEP|elegibilitas|formulir|permintaan\s+rawat|admisi/i.test(n)) return "Admisi";
  if (/lab/i.test(n)) return "Laboratorium";
  if (/radiolog|thorax|toraks|BNO|rontgen|USG|CT/i.test(n)) return "Radiologi";
  if (/billing|kasir|rincian/i.test(n)) return "Kasir";
  if (/obat|farmasi|resep/i.test(n)) return "Farmasi";
  if (/CPPT|S\.?O\.?A\.?P|keperawatan/i.test(n)) return "Rawat Inap";
  if (/resume|DPJP/i.test(n)) return "DPJP";

function inkonsistensiDitutup(claim, key) {
  const tl = (claim.tindakLanjutInkonsistensi || {})[key];

function cekInkonsistensiTerstruktur(claim) {
  const out = [];

  const keluar = parseTanggalFleksibel(claim.tglKeluar) || masuk;

  if (masuk && Array.isArray(claim.tanggalDokumen)) {
    // Toleransi 1 hari (mis. triase IGD sebelum tengah malam, pulang dini hari)
    const batasAwal = masuk.getTime() - HARI;
    const batasAkhir = keluar.getTime() + HARI;
    const sudah = new Set();
    claim.tanggalDokumen.forEach((t) => {
      if (!t || typeof t !== "object" || !t.tanggal) return;
      if (/lahir|kontrol|cetak/i.test(`${t.keterangan || ""} ${t.dokumen || ""}`)) return;
      const d = parseTanggalFleksibel(t.tanggal);
      if (!d || (d.getTime() >= batasAwal && d.getTime() <= batasAkhir)) return;
      const asli = String(t.tanggalAsli || t.tanggal);
      let tertukar = false;
      const m = asli.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
      if (m) {
        const alt = new Date(Number(m[3]), Number(m[1]) - 1, Number(m[2]));
        tertukar = alt.getTime() >= batasAwal && alt.getTime() <= batasAkhir;
      }
      const kunci = `${t.dokumen}|${asli}`;
      if (sudah.has(kunci)) return;
      sudah.add(kunci);
      out.push({
        kategori: "Waktu/jam", sumber: "otomatis",
        dokumenA: String(t.dokumen || "Dokumen"), isiA: `${t.keterangan ? t.keterangan + ": " : ""}${asli}${t.jam ? " " + t.jam : ""}`,
        dokumenB: "Episode klaim (berkas klaim/SEP)", isiB: `masuk ${claim.tglMasuk} s.d. keluar ${claim.tglKeluar || claim.tglMasuk}`,
        unitTerkait: tebakUnitDokumen(t.dokumen), tingkat: tertukar ? "Sedang" : "Tinggi",
        dampak: tertukar
          ? "Urutan hari-bulan tampak tertukar (tercetak format bulan-hari) — seragamkan format DD-MM-YYYY di sistem asal dokumen; verifikator bisa menganggap dokumen tidak sesuai episode."
          : "Tanggal dokumen berada di luar rentang episode rawat — verifikator bisa menganggap dokumen bukan milik episode ini.",
      });
    });
  }
  // 2. Diagnosis yang tertulis di dokumen vs diagnosis yang dikode di klaim
  if (Array.isArray(claim.diagnosisDokumen) && claim.diagnosisDokumen.length) {
    const kat = (c) => String(c || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 3);
    const utamaKlaim = kat(claim.primaryDxCode);
    const sekKlaim = (claim.secondaryDx || []).map((d) => kat(d.code)).filter(Boolean);
    const dok = claim.diagnosisDokumen.filter((x) => x && typeof x === "object" && /^[A-Z]\d\d$/.test(kat(x.kode)) && !/e-?klaim|berkas\s+klaim/i.test(String(x.dokumen || "")));
    const utamaDok = dok.filter((x) => /utama/i.test(String(x.peran || "")));
    const sekDok = dok.filter((x) => /sekunder/i.test(String(x.peran || "")));
    utamaDok.forEach((x) => {
      if (utamaKlaim && kat(x.kode) !== utamaKlaim) {
        out.push({ kategori: "Klinis (GCS/tanda vital/diagnosis)", sumber: "otomatis",
          dokumenA: String(x.dokumen || "Resume medis"), isiA: `diagnosis utama ${x.kode}${x.diagnosis ? " " + x.diagnosis : ""}`,
          dokumenB: "Klaim (e-Klaim)", isiB: `diagnosis utama ${claim.primaryDxCode}${claim.primaryDxDesc ? " " + claim.primaryDxDesc : ""}`,
          unitTerkait: "Rekam Medis", tingkat: "Tinggi",
          dampak: "Diagnosis utama yang dikode berbeda dengan yang ditulis DPJP — koding harus mengikuti dokumentasi DPJP (atau DPJP memperbarui resume bila memang berubah)." });
      }
    });
    const semuaDok = new Set([...utamaDok, ...sekDok].map((x) => kat(x.kode)));
    sekDok.forEach((x) => {
      const k = kat(x.kode);
      if (k !== utamaKlaim && sekKlaim.indexOf(k) < 0) {
        out.push({ kategori: "Klinis (GCS/tanda vital/diagnosis)", sumber: "otomatis",
          dokumenA: String(x.dokumen || "Resume medis"), isiA: `diagnosis sekunder ${x.kode}${x.diagnosis ? " " + x.diagnosis : ""}`,
          dokumenB: "Klaim (e-Klaim)", isiB: "tidak dikode",
          unitTerkait: "Rekam Medis", tingkat: "Sedang",
          dampak: "Diagnosis sekunder yang ditulis DPJP tidak ikut dikode — potensi downcoding, atau resume perlu diperbarui bila kondisi itu memang tidak relevan." });
      }
    });
    if (semuaDok.size > 0) {
      (claim.secondaryDx || []).forEach((d) => {
        const k = kat(d.code);
        if (k && !semuaDok.has(k)) {
          out.push({ kategori: "Klinis (GCS/tanda vital/diagnosis)", sumber: "otomatis",
            dokumenA: "Klaim (e-Klaim)", isiA: `diagnosis sekunder ${d.code}${d.desc ? " " + d.desc : ""}`,
            dokumenB: "Resume medis", isiB: "tidak tertulis",
            unitTerkait: "Rekam Medis", tingkat: "Tinggi",
            dampak: "Diagnosis dikode tanpa tertulis di resume DPJP — berisiko dianggap tidak terdokumentasi & dihapus verifikator." });
        }
      });
    }

  return out.map((it) => ({ ...it, key: kunciInkonsistensi(it) }));
}

function daftarInkonsistensi(claim) {
  let semua = [...(claim.arsipInkonsistensi || [])];
  if (claim.aiStatus === "done" && claim.aiAnalysis) semua = gabungInkonsistensi(semua, ekstrakInkonsistensi(claim.aiAnalysis));

}
function inkonsistensiHtml(claim) {
