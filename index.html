    { value: "tinggi", label: "Hanya risiko Tinggi", desc: "Cuma klaim skor ≥5 yang otomatis dianalisis — hemat, fokus ke yang paling berisiko" },
    { value: "sedang_tinggi", label: "Sedang + Tinggi (default)", desc: "Klaim skor ≥2 otomatis dianalisis — keseimbangan cakupan & biaya" },
    { value: "semua", label: "Semua termasuk Rendah", desc: "Semua klaim otomatis dianalisis — paling lengkap, tapi paling boros token" },
  ];
  return (
    <div className="space-y-5">
      <Section title="Akun & Langganan" subtitle="Data tersimpan di server Supabase — terhubung ke akun dan rumah sakit Anda">
        {PROFIL && (
          <div className="grid sm:grid-cols-2 gap-3 text-sm">
            <div className="bg-[#F4F9FA] border border-[#CFE4E8] rounded-lg p-3">
              <p className="text-xs text-[#94A3AC]">Pengguna</p>
              <p className="font-semibold text-[#0F2A3D]">{PROFIL.nama}</p>
              <p className="text-xs text-[#5B6B76]">{PROFIL.email} · {LABEL_PERAN[PROFIL.peran] || PROFIL.peran}</p>
            </div>
            <div className="bg-[#F4F9FA] border border-[#CFE4E8] rounded-lg p-3">
              <p className="text-xs text-[#94A3AC]">Rumah sakit</p>
              <p className="font-semibold text-[#0F2A3D]">{PROFIL.rs.nama}</p>
              <p className="text-xs text-[#5B6B76]">Paket {PROFIL.rs.paket} · {PROFIL.rs.berlaku_sampai ? `berlaku s.d. ${PROFIL.rs.berlaku_sampai}` : "tanpa batas waktu"}</p>
              <p className="text-xs text-[#5B6B76] mt-1">Tabel tarif: {labelTarif()}{TARIF_INFO.jumlah ? ` · ${TARIF_INFO.jumlah} kode` : ""}</p>
              <p className="text-xs text-[#5B6B76] mt-1">Riwayat grouping RS: {RIWAYAT_INFO.jumlah ? `${RIWAYAT_INFO.jumlah.toLocaleString("id-ID")} klaim${RIWAYAT_INFO.periode ? " · " + RIWAYAT_INFO.periode : ""}` : "belum diunggah"}</p>
            </div>
            <div className="sm:col-span-2 bg-white border border-[#E2E8ED] rounded-lg p-3">
              <div className="flex justify-between text-xs text-[#5B6B76] mb-1.5"><span>Kuota analisis AI bulan ini</span><span>{Math.max(0, PROFIL.rs.kuota_ai_bulanan - PROFIL.rs.terpakai_bulan_ini)} tersisa dari {PROFIL.rs.kuota_ai_bulanan}</span></div>
              <div className="h-2 rounded-full bg-[#EEF3F5] overflow-hidden"><div className="h-full bg-[#0B7285]" style={{ width: `${Math.min(100, (PROFIL.rs.terpakai_bulan_ini / Math.max(1, PROFIL.rs.kuota_ai_bulanan)) * 100)}%` }} /></div>
              <p className="text-[11px] text-[#94A3AC] mt-1.5">Skrining berbasis aturan tidak memakai kuota. Kuota hanya terpakai saat opini AI, ekstraksi berkas, atau analisis teks klinis dijalankan.</p>
            </div>
          </div>
        )}
        <button onClick={keluarAplikasi} className="mt-3 inline-flex items-center gap-1.5 text-xs font-semibold text-[#B3261E] hover:text-[#961F19]"><LogOut size={14} /> Keluar dari akun</button>
      </Section>
      {!adminRS() && <div className="text-xs bg-[#FCF1DD] text-[#9A6300] rounded-lg px-3 py-2">Bobot skor & tingkat AI otomatis berlaku untuk seluruh rumah sakit — hanya Admin RS yang dapat mengubahnya.</div>}
      <Section title="Analisis AI" subtitle="Opini AI adalah bagian bawaan dari alur skrining, bukan langkah terpisah">
        <p className="text-xs text-[#5B6B76] mb-3">Sebagian besar sistem ini (skrining, kandidat kode+tarif, riwayat pasien, kelengkapan SEP, dll) berjalan <b>tanpa AI sama sekali</b> — gratis, langsung dari data lokal. Pengaturan di bawah cuma soal opini AI, yang memang butuh panggilan API berbayar.</p>
        <div className="space-y-2">
          {AUTOAI_OPTIONS.map((opt) => (
            <label key={opt.value} className={`flex items-start gap-2.5 p-2.5 rounded-lg border cursor-pointer ${currentLevel === opt.value ? "border-[#0B7285] bg-[#F4F9FA]" : "border-[#E2E8ED]"}`}>
              <input type="radio" name="autoAILevel" checked={currentLevel === opt.value} disabled={!adminRS()} onChange={() => onSetAutoAILevel(opt.value)} className="mt-0.5 w-4 h-4 accent-[#0B7285]" />
              <span className="text-sm">
                <span className="font-medium text-[#0F2A3D]">{opt.label}</span>
                <span className="block text-xs text-[#5B6B76] mt-0.5">{opt.desc}</span>
              </span>
            </label>
          ))}
        </div>
        <p className="text-xs text-[#94A3AC] mt-3">Berapa pun tingkatnya, klaim di luar cakupan otomatis tetap bisa dianalisis manual kapan saja dari halaman detail klaim.</p>
      </Section>
      <Section title="Pengaturan Bobot Skor" subtitle="Sesuaikan bobot tiap aturan skrining sesuai kebijakan internal RS"
        right={<button onClick={onReset} className="inline-flex items-center gap-1.5 text-xs font-medium text-[#0B7285] hover:text-[#095e6b]"><RotateCcw size={13} /> Kembalikan default</button>}>
        <div className="space-y-3">
          {Object.keys(RULE_LABELS).map((key) => (
            <div key={key} className="flex items-center justify-between gap-4 py-2 border-b border-[#F0F3F5] last:border-0">
              <span className="text-sm text-[#334652]">{RULE_LABELS[key]}</span>
              <input type="number" min={0} max={10} value={weights[key]} disabled={!adminRS()} onChange={(e) => onChange(key, Number(e.target.value))}
                className="w-16 rounded-lg border border-[#D7DEE3] px-2 py-1.5 text-sm text-center font-mono" />
            </div>
          ))}
        </div>
        <p className="text-xs text-[#94A3AC] mt-4">Ambang risiko: skor 0 = Rendah, 1–3 = Sedang, ≥4 = Tinggi. Perubahan bobot langsung memengaruhi seluruh klaim di Dashboard.</p>
      </Section>
    </div>
  );
}

/* ----------------------------------------------------------------------
   APP
---------------------------------------------------------------------- */
export default function App() {
  useFonts();
  const [rawClaims, setRawClaims] = useState([]);
  const [weights, setWeights] = useState(DEFAULT_WEIGHTS);
  const [settings, setSettings] = useState({ autoAI: "sedang_tinggi" });
  const [tab, setTab] = useState("dashboard");
  const [selected, setSelected] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [saveMsg, setSaveMsg] = useState("");
  const [galatMuat, setGalatMuat] = useState("");
  const [kuota, setKuota] = useState(() => PROFIL ? { sisa: Math.max(0, PROFIL.rs.kuota_ai_bulanan - PROFIL.rs.terpakai_bulan_ini), total: PROFIL.rs.kuota_ai_bulanan } : null);
  const [statusServer, setStatusServer] = useState({ ok: true, pesan: "" });
  useEffect(() => {
    window.__onKuota = (sisa, total) => { setKuota({ sisa, total }); if (PROFIL) PROFIL.rs.terpakai_bulan_ini = Math.max(0, total - sisa); };
    window.__onSimpan = (ok, pesan) => setStatusServer({ ok, pesan });
    return () => { window.__onKuota = null; window.__onSimpan = null; };
  }, []);
  // Muat ulang dari server — melihat klaim yang baru diinput petugas lain.
  const muatUlang = async () => {
    setSaveMsg("Memuat ulang...");
    try { setRawClaims(await loadClaims()); setSaveMsg(`Dimuat ulang · ${new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" })}`); }
    catch (e) { setSaveMsg("Gagal memuat ulang: " + (e && e.message ? e.message : "")); }
    setTimeout(() => setSaveMsg(""), 4000);
  };

  const queueRef = useRef([]);
  const processingRef = useRef(false);
  const claimsRef = useRef([]);
  useEffect(() => { claimsRef.current = claims; });

  useEffect(() => {
    Promise.all([loadClaims(), loadWeights()]).then(async ([c, w]) => {
      const s = await loadSettings();
      setRawClaims(c); setWeights(w); setSettings(s); setLoaded(true);
    }).catch((e) => setGalatMuat(e && e.message ? e.message : String(e)));
  }, []);
  // Persistensi klaim kini terjadi per-mutasi (lihat addClaim/updateClaim/dst di
  // bawah) — bukan lagi menyimpan ulang seluruh daftar tiap ada perubahan apa pun.
  useEffect(() => { if (loaded) saveWeights(weights); }, [weights, loaded]);
  useEffect(() => { if (loaded) saveSettings(settings); }, [settings, loaded]);

  // Data sebenarnya sudah otomatis tersimpan tiap ada perubahan (lihat 3 useEffect
  // di atas). Tombol ini memberi konfirmasi visual + jalan sebagai pengaman manual.
  const handleManualSave = async () => {
    setSaveMsg("Menyimpan...");
    await Promise.all([saveClaims(rawClaims), saveWeights(weights), saveSettings(settings)]);
    setSaveMsg(`Tersimpan · ${new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" })}`);
    setTimeout(() => setSaveMsg(""), 3000);
  };

  const claims = useMemo(() => screenAllClaims(rawClaims, weights), [rawClaims, weights]);

  // Jalankan opini AI untuk sebuah klaim dan simpan hasilnya kembali ke data mentah —
  // ini membuat analisis AI menjadi bagian permanen dari data klaim (bukan hasil sementara).
  const runAIForClaim = async (id) => {
    setRawClaims((prev) => prev.map((c) => (c.id === id ? { ...c, aiStatus: "loading" } : c)));
    const target = claimsRef.current.find((c) => c.id === id);
    if (!target) return;
    const persistOne = (updater) => setRawClaims((prev) => {
      const next = prev.map((c) => (c.id === id ? updater(c) : c));
      const updated = next.find((c) => c.id === id);
      if (updated) gsRun("upsertClaim", updated).catch(() => {});
      return next;
    });
    try {
      const text = await runClaimAI(target, claimsRef.current);
      persistOne((c) => ({ ...c, aiStatus: "done", aiAnalysis: text, arsipInkonsistensi: gabungInkonsistensi(c.arsipInkonsistensi, ekstrakInkonsistensi(text)) }));
    } catch (e) {
      const msg = (e && e.message) ? e.message : "Kesalahan tidak diketahui";
      persistOne((c) => ({ ...c, aiStatus: "error", aiAnalysis: msg }));
    }
  };

  const processQueue = async () => {
    if (processingRef.current) return;
    processingRef.current = true;
    while (queueRef.current.length > 0) {
      const id = queueRef.current.shift();
      await runAIForClaim(id);
    }
    processingRef.current = false;
  };

  // Skrining otomatis memicu analisis AI dengan sendirinya sesuai tingkat yang
  // dipilih di Pengaturan — terintegrasi ke alur, bukan langkah manual terpisah.
  useEffect(() => {
    if (!loaded) return;
    // Kompatibel dgn versi lama (autoAI dulu boolean true/false)
    const level = settings.autoAI === true ? "sedang_tinggi" : settings.autoAI === false ? "off" : settings.autoAI;
    if (level === "off" || !bolehTulis()) return;
    const eligible = level === "tinggi" ? ["Tinggi"] : level === "semua" ? ["Rendah", "Sedang", "Tinggi", "Belum Lengkap"] : ["Sedang", "Tinggi", "Belum Lengkap"];
    // Label "Rendah" hanya hasil aturan administratif — tidak membaca isi klinis. Karena
    // itu rawat inap severity II/III atau bertarif ≥ Rp5 jt TETAP dianalisis AI (terbukti:
    // klaim pending BPJS bisa berlabel "Rendah" krn diagnosisnya tidak didukung lab).
    const wajibAI = (c) => level !== "tinggi" && c.jenisRawat !== "Rawat Jalan" &&
      (c.severityLevel === "II" || c.severityLevel === "III" || Number(String(c.tarifKlaim || "").replace(/\D/g, "")) >= 5000000);
    claims.forEach((c) => {
      if ((eligible.includes(c.riskLevel) || wajibAI(c)) && (!c.aiStatus || c.aiStatus === "idle") && !queueRef.current.includes(c.id)) {
        queueRef.current.push(c.id);
      }
    });
    processQueue();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [claims, loaded, settings.autoAI]);

  const addClaim = (c) => { setRawClaims((prev) => [...prev, c]); gsRun("upsertClaim", c).catch(() => {}); };
  const addMany = (list) => { setRawClaims((prev) => [...prev, ...list]); if (list.length > 0) gsRun("appendClaims", list).catch(() => {}); };
  const deleteClaim = (id) => { setRawClaims((prev) => prev.filter((c) => c.id !== id)); gsRun("deleteClaimById", id).catch(() => {}); };
  const updateClaim = (id, patch) => setRawClaims((prev) => {
    const next = prev.map((c) => (c.id === id ? { ...c, ...patch } : c));
    const updated = next.find((c) => c.id === id);
    if (updated) gsRun("upsertClaim", updated).catch(() => {});
    return next;
  });
  const deleteAllClaims = () => { setRawClaims([]); gsRun("clearAllClaims").catch(() => {}); };

  // Konfirmasi bahwa dua episode memang sah terpisah (Rujukan Internal beda hari,
  // sesuai definisi BA Kemenkes-BPJS No. 3760/2024) — menekan flag readmisi untuk
  // pasangan klaim ini tanpa mengubah data lain.
  const confirmSeparateEpisodes = (claimId, otherClaimId) => {
    setRawClaims((prev) => {
      const next = prev.map((c) => {
        if (c.id === claimId) return { ...c, confirmedSeparateEpisodes: [...(c.confirmedSeparateEpisodes || []), otherClaimId] };
        if (c.id === otherClaimId) return { ...c, confirmedSeparateEpisodes: [...(c.confirmedSeparateEpisodes || []), claimId] };
        return c;
      });
      const u1 = next.find((c) => c.id === claimId);
      const u2 = next.find((c) => c.id === otherClaimId);
      if (u1) gsRun("upsertClaim", u1).catch(() => {});
      if (u2) gsRun("upsertClaim", u2).catch(() => {});
      return next;
    });
  };

  // Gabungkan dua episode jadi satu (Konsul Internal — dikembalikan ke dokter perujuk,
  // sesuai definisi resmi: "klaim jadi satu episode walaupun dikerjakan di lain hari").
  // Episode yang lebih AWAL (targetId) jadi induk; diagnosis/prosedur dari episode
  // kedua (sourceId) digabungkan ke situ, lalu episode kedua dihapus.
  const mergeClaims = (targetId, sourceId) => {
    setRawClaims((prev) => {
      const target = prev.find((c) => c.id === targetId);
      const source = prev.find((c) => c.id === sourceId);
      if (!target || !source) return prev;
      const mergedSecondaryDx = [...(target.secondaryDx || []), ...(source.secondaryDx || [])];
      const mergedProcedures = [...(target.procedures || []), ...(source.procedures || [])];
      const mergedTarif = parseAngka(target.tarifKlaim) + parseAngka(source.tarifKlaim);
      const catatanGabung = `\n\n[Digabung otomatis dari episode No. SEP/RM ${source.noRM}, ${source.tglMasuk} — Konsul Internal, dikembalikan ke DPJP perujuk sesuai BA Kemenkes-BPJS No. 3760/2024]`;
      const merged = {
        ...target,
        secondaryDx: mergedSecondaryDx,
        procedures: mergedProcedures,
        tarifKlaim: String(mergedTarif),
        resumeMedis: (target.resumeMedis || "") + catatanGabung,
      };
      gsRun("upsertClaim", merged).catch(() => {});
      gsRun("deleteClaimById", sourceId).catch(() => {});
      return prev.filter((c) => c.id !== sourceId).map((c) => (c.id === targetId ? merged : c));
    });
  };

  const setWeight = (key, val) => setWeights((w) => ({ ...w, [key]: val }));
  const resetWeights = () => setWeights({ ...DEFAULT_WEIGHTS });
  const setAutoAILevel = (val) => setSettings((s) => ({ ...s, autoAI: val }));

  const tabs = [
    { id: "dashboard", label: "Dashboard", icon: Activity },
    { id: "input", label: "Input Manual", icon: FileText },
    { id: "batch", label: "Unggah Batch", icon: Upload },
    { id: "dpjp", label: "Pola DPJP", icon: Users },
    { id: "kajian", label: "Kajian Dokumen", icon: ClipboardList },
    { id: "settings", label: "Pengaturan", icon: Sliders },
    ...(adminRS() ? [{ id: "adminrs", label: "Admin RS", icon: UserCog }] : []),
    ...(PROFIL && PROFIL.peran === "superadmin" ? [{ id: "sistem", label: "Admin Sistem", icon: Building2 }] : []),
  ];

  return (
    <div style={{ fontFamily: "'IBM Plex Sans',sans-serif" }} className="min-h-screen bg-[#F7F9FA]">
      <header className="bg-[#0F2A3D] text-white">
        <div className="max-w-5xl mx-auto px-5 py-5 flex items-start justify-between gap-4 flex-wrap">
          <div>
            <p className="text-xs uppercase tracking-wider text-[#7FA8B5] font-medium">Skrining Kepatuhan Klaim</p>
            <h1 style={{ fontFamily: "'Space Grotesk',sans-serif" }} className="text-xl sm:text-2xl font-bold mt-0.5">Deteksi Dini Klaim INA-CBG</h1>
            <p className="text-sm text-[#A9C1CA] mt-1 max-w-2xl">Alat bantu skrining awal untuk menandai berkas klaim yang berpotensi tidak sesuai — termasuk indikasi upcoding — dengan opini AI otomatis, sebelum diajukan.</p>
          </div>
          <div className="flex flex-col items-end gap-1 shrink-0">
            <button onClick={handleManualSave}
              className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-white/10 hover:bg-white/20 text-white text-xs font-semibold border border-white/20 whitespace-nowrap">
              <Save size={14} /> Simpan Data
            </button>
            {saveMsg && <span className="text-[11px] text-[#7FA8B5]">{saveMsg}</span>}
            {!statusServer.ok && <span className="text-[11px] text-[#FFB4A9] max-w-xs text-right">{statusServer.pesan}</span>}
            {PROFIL && <span className="text-[11px] text-[#A9C1CA] text-right">{PROFIL.nama} · {LABEL_PERAN[PROFIL.peran] || PROFIL.peran}<br />{PROFIL.rs.nama}{kuota ? ` · kuota AI ${kuota.sisa}/${kuota.total}` : ""}</span>}
            <div className="flex gap-1.5">
              <button onClick={muatUlang} title="Muat ulang data dari server" className="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white text-[11px] font-semibold border border-white/20"><RefreshCw size={12} /> Muat ulang</button>
              <button onClick={keluarAplikasi} title="Keluar" className="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white text-[11px] font-semibold border border-white/20"><LogOut size={12} /> Keluar</button>
            </div>
          </div>
        </div>
      </header>

      <div className="max-w-5xl mx-auto px-5">
        <div className="flex gap-1 -mt-px pt-3 flex-wrap">
          {tabs.map((t) => {
            const Icon = t.icon; const active = tab === t.id;
            return (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={`inline-flex items-center gap-1.5 px-4 py-2.5 text-sm font-medium rounded-t-lg border-b-2 transition-colors ${active ? "border-[#0B7285] text-[#0B7285] bg-white" : "border-transparent text-[#5B6B76] hover:text-[#0F2A3D]"}`}>
                <Icon size={15} /> {t.label}
              </button>
            );
          })}
        </div>
      </div>

      <main className="max-w-5xl mx-auto px-5 py-6">
        <div className="flex items-start gap-2 bg-[#EAF4F6] border border-[#CFE4E8] text-[#0B5568] text-xs rounded-lg px-3 py-2.5 mb-5">
          <Info size={14} className="mt-0.5 shrink-0" />
          <span>Hasil skrining disusun mengikuti 4 tahap verifikasi (Administrasi → Kesesuaian Kode → Kewajaran Medis → Pola Sistemik), meniru alur pikir verifikasi digital Vedika BPJS — bukan vonis kecurangan, sekadar peta area yang perlu ditelaah lebih dulu. Klaim yang ditandai tetap perlu diverifikasi koder/verifikator dan DPJP terhadap rekam medis sebelum keputusan final.</span>
        </div>

        {galatMuat && <div className="mb-4 text-sm bg-[#FCE9E7] text-[#B3261E] rounded-lg px-3 py-2.5">{galatMuat} <button onClick={() => window.location.reload()} className="underline font-semibold ml-1">Coba lagi</button></div>}
        {!bolehTulis() && <div className="mb-4 text-xs bg-[#F0F3F5] text-[#334652] rounded-lg px-3 py-2">Anda masuk sebagai <b>{LABEL_PERAN[PROFIL && PROFIL.peran] || "pemantau"}</b> — mode lihat saja. Perubahan tidak disimpan ke server dan opini AI tidak dapat dijalankan.</div>}
        {loaded && TARIF_REF_RAW.length === 0 && <div className="mb-4 text-xs bg-[#FCF1DD] text-[#9A6300] rounded-lg px-3 py-2"><b>Tabel tarif INA-CBG untuk RS ini belum diatur</b> — validasi tarif & kandidat kode belum berjalan. {adminRS() ? "Atur di tab Admin RS → Tabel Tarif." : "Hubungi Admin RS."}</div>}
        {!loaded && !galatMuat && <div className="flex items-center gap-2 text-sm text-[#5B6B76] py-10 justify-center"><Loader2 size={16} className="animate-spin" /> Memuat data klaim dari server...</div>}
        {tab === "dashboard" && loaded && <Dashboard claims={claims} onSelect={setSelected} onDelete={deleteClaim} onDeleteAll={adminRS() ? deleteAllClaims : null} />}
        {tab === "input" && <InputManual onAdd={addClaim} />}
        {tab === "batch" && <BatchUpload onAddMany={addMany} onDone={() => setTab("dashboard")} />}
        {tab === "dpjp" && <DpjpPattern claims={claims} />}
        {tab === "kajian" && <KajianInkonsistensi claims={claims} onSelect={setSelected} />}
        {tab === "settings" && <Settings weights={weights} onChange={setWeight} onReset={resetWeights} autoAI={settings.autoAI} onSetAutoAILevel={setAutoAILevel} />}
        {tab === "adminrs" && adminRS() && <PortalAdminRS />}
        {tab === "sistem" && PROFIL && PROFIL.peran === "superadmin" && <PortalAdminSistem />}
      </main>

      {selected && <DetailModal claim={claims.find((c) => c.id === selected.id) || selected} allClaims={claims} onClose={() => setSelected(null)} onReanalyze={runAIForClaim} onMerge={mergeClaims} onConfirmSeparate={confirmSeparateEpisodes} onUpdateClaim={updateClaim} />}
    </div>
  );
}



/* ----------------------------------------------------------------------
   PORTAL ADMIN — Admin RS (pengguna, pola pending, PPK, tabel tarif) dan
   Admin Sistem/superadmin (rumah sakit, set tarif, pemakaian AI).
   Semua hak akses tetap dijaga di server (RLS + Edge Function).
---------------------------------------------------------------------- */
const KELAS_INPUT = "w-full rounded-lg border border-[#D7DEE3] px-2.5 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#0B7285]/40";
const TOMBOL_UTAMA = "inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-[#0B7285] text-white text-xs font-semibold hover:bg-[#095e6b] disabled:opacity-50";
const TOMBOL_KEDUA = "inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-[#D7DEE3] text-[#334652] text-xs font-semibold hover:bg-[#F4F9FA] disabled:opacity-50";

async function panggilFungsi(nama, payload) {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error("Sesi login berakhir. Silakan masuk ulang.");
  const res = await fetch(`${SUPABASE_URL}/functions/v1/${nama}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${session.access_token}`, apikey: SUPABASE_PUBLISHABLE_KEY },
    body: JSON.stringify(payload),
  });
  let j = null;
  try { j = await res.json(); } catch (e) { /* abaikan */ }
  if (!res.ok) throw new Error((j && j.error) || `Server mengembalikan status ${res.status}.`);
  return j;
}

function useKabar() {
  const [kabar, setKabar] = useState({ ok: true, teks: "" });
  const tampil = (ok, teks) => { setKabar({ ok, teks }); if (ok) setTimeout(() => setKabar((k) => (k.teks === teks ? { ok: true, teks: "" } : k)), 5000); };
  const elemen = kabar.teks ? <div className={`text-sm rounded-lg px-3 py-2 mb-3 ${kabar.ok ? "bg-[#E4F3EC] text-[#1E6B4C]" : "bg-[#FCE9E7] text-[#B3261E]"}`}>{kabar.teks}</div> : null;
  return [elemen, tampil];
}

function SubTab({ pilihan, aktif, onPilih }) {

// ---------------------------------------------------------------- pengguna
function KelolaPengguna({ rsId, rsNama }) {
  const [daftar, setDaftar] = useState([]);
  const [memuat, setMemuat] = useState(true);
  const [ubahan, setUbahan] = useState({});
  const [baru, setBaru] = useState({ nama: "", email: "", peran: "koder", sandi: "" });
  const [proses, setProses] = useState(false);
  const [kabarEl, kabar] = useKabar();
  const superAdmin = PROFIL && PROFIL.peran === "superadmin";
  const peranBoleh = Object.keys(LABEL_PERAN).filter((p) => superAdmin || p !== "superadmin");

  const muat = async () => {
    setMemuat(true);
    try { const r = await panggilFungsi("kelola-pengguna", { aksi: "daftar", rs_id: rsId }); setDaftar(r.pengguna || []); setUbahan({}); }
    catch (e) { kabar(false, e.message); }
    setMemuat(false);
  };
  useEffect(() => { muat(); }, [rsId]);
  const nilai = (p, k) => (ubahan[p.id] && k in ubahan[p.id] ? ubahan[p.id][k] : p[k]);
  const set = (p, k, v) => setUbahan((u) => ({ ...u, [p.id]: { ...(u[p.id] || {}), [k]: v } }));
  const jalankan = async (fn, pesanOk) => {
    setProses(true);
    try { await fn(); kabar(true, pesanOk); await muat(); } catch (e) { kabar(false, e.message); }
    setProses(false);
  };
  const simpan = (p) => jalankan(() => panggilFungsi("kelola-pengguna", { aksi: "ubah", id: p.id, ...ubahan[p.id] }), `Perubahan ${p.email} disimpan.`);
  const resetSandi = (p) => {
    const sandi = window.prompt(`Kata sandi baru untuk ${p.nama} (${p.email}) — minimal 8 karakter.\nSampaikan langsung ke orangnya, jangan lewat grup.`);
    if (!sandi) return;
    jalankan(() => panggilFungsi("kelola-pengguna", { aksi: "reset_sandi", id: p.id, sandi }), `Kata sandi ${p.email} diganti.`);
  };
  const tambah = (e) => {
    e.preventDefault();
    jalankan(async () => { await panggilFungsi("kelola-pengguna", { aksi: "buat", ...baru, rs_id: rsId }); setBaru({ nama: "", email: "", peran: "koder", sandi: "" }); }, `Akun ${baru.email} dibuat — bisa langsung login.`);
  };

  return (
    <div className="space-y-4">
      {kabarEl}
      <Section title={`Pengguna${rsNama ? " — " + rsNama : ""}`} subtitle="Ubah peran, nonaktifkan akun (langsung tidak bisa login), atau ganti kata sandi" right={<button onClick={muat} className={TOMBOL_KEDUA}><RefreshCw size={12} /> Muat ulang</button>}>
        {memuat ? <div className="flex items-center gap-2 text-sm text-[#5B6B76]"><Loader2 size={15} className="animate-spin" /> Memuat...</div> : (
          <div className="overflow-x-auto -mx-6 px-6">
            <table className="w-full text-sm">
              <thead><tr className="text-left text-xs text-[#5B6B76] border-b border-[#E2E8ED]"><th className="py-2 pr-3">Nama</th><th className="py-2 pr-3">Email</th><th className="py-2 pr-3">Peran</th><th className="py-2 pr-3">Aktif</th><th className="py-2 pr-3">Login terakhir</th><th className="py-2"></th></tr></thead>
              <tbody>
                {daftar.length === 0 && <tr><td colSpan={6} className="py-3 text-sm text-[#94A3AC]">Belum ada pengguna.</td></tr>}
                {daftar.map((p) => {
                  const diri = PROFIL && p.id === PROFIL.id;
                  const terkunci = !superAdmin && p.peran === "superadmin";
                  return (
                    <tr key={p.id} className="border-b border-[#F0F3F5]">
                      <td className="py-2 pr-3"><input value={nilai(p, "nama")} disabled={terkunci} onChange={(e) => set(p, "nama", e.target.value)} className={KELAS_INPUT + " w-40"} /></td>
                      <td className="py-2 pr-3 text-xs">{p.email}{diri && <span className="text-[#94A3AC]"> (Anda)</span>}</td>
                      <td className="py-2 pr-3"><select value={nilai(p, "peran")} disabled={diri || terkunci} onChange={(e) => set(p, "peran", e.target.value)} className={KELAS_INPUT}>{Object.keys(LABEL_PERAN).filter((k) => peranBoleh.includes(k) || k === p.peran).map((k) => <option key={k} value={k}>{LABEL_PERAN[k]}</option>)}</select></td>
                      <td className="py-2 pr-3"><input type="checkbox" checked={!!nilai(p, "aktif")} disabled={diri || terkunci} onChange={(e) => set(p, "aktif", e.target.checked)} className="w-4 h-4 accent-[#0B7285]" /></td>
                      <td className="py-2 pr-3 text-xs text-[#5B6B76]">{p.login_terakhir ? new Date(p.login_terakhir).toLocaleString("id-ID", { dateStyle: "short", timeStyle: "short" }) : "—"}</td>
                      <td className="py-2 text-right whitespace-nowrap">
                        {ubahan[p.id] && <button onClick={() => simpan(p)} disabled={proses} className={TOMBOL_UTAMA + " mr-1.5"}>Simpan</button>}
                        {!terkunci && <button onClick={() => resetSandi(p)} disabled={proses} className="text-xs font-medium text-[#0B7285]">Ganti sandi</button>}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </Section>
      <Section title="Tambah Pengguna" subtitle="Akun langsung aktif dengan email & kata sandi awal di bawah">
        <form onSubmit={tambah} className="grid sm:grid-cols-2 gap-3">
          <div><label className="block text-xs text-[#5B6B76] mb-1">Nama lengkap</label><input required value={baru.nama} onChange={(e) => setBaru({ ...baru, nama: e.target.value })} className={KELAS_INPUT} /></div>
          <div><label className="block text-xs text-[#5B6B76] mb-1">Email</label><input required type="email" value={baru.email} onChange={(e) => setBaru({ ...baru, email: e.target.value })} className={KELAS_INPUT} /></div>
          <div><label className="block text-xs text-[#5B6B76] mb-1">Peran</label><select value={baru.peran} onChange={(e) => setBaru({ ...baru, peran: e.target.value })} className={KELAS_INPUT}>{peranBoleh.map((k) => <option key={k} value={k}>{LABEL_PERAN[k]}</option>)}</select></div>
          <div><label className="block text-xs text-[#5B6B76] mb-1">Kata sandi awal (min. 8 karakter)</label><input required minLength={8} value={baru.sandi} onChange={(e) => setBaru({ ...baru, sandi: e.target.value })} className={KELAS_INPUT + " font-mono"} /></div>
          <div className="sm:col-span-2"><button type="submit" disabled={proses} className={TOMBOL_UTAMA}><Plus size={13} /> Tambah pengguna</button></div>
        </form>
      </Section>
    </div>
  );
}

// ---------------------------------------------------------------- editor tabel sederhana (pola pending, PPK)
function EditorTabelDB({ tabel, judul, subjudul, kolom, urutan }) {
  const [baris, setBaris] = useState([]);
  const [ubahan, setUbahan] = useState({});
  const [memuat, setMemuat] = useState(true);
  const [proses, setProses] = useState(false);
  const [kabarEl, kabar] = useKabar();
  const rsId = PROFIL.rs.id;
  const muat = async () => {
    setMemuat(true);
    const { data, error } = await supabase.from(tabel).select("*").eq("rs_id", rsId).order(urutan || "id");
    if (error) kabar(false, error.message); else { setBaris(data || []); setUbahan({}); }
    setMemuat(false);
  };
  useEffect(() => { muat(); }, []);
  const nilai = (r, k) => (ubahan[r.id] && k in ubahan[r.id] ? ubahan[r.id][k] : r[k]);
  const set = (r, k, v) => setUbahan((u) => ({ ...u, [r.id]: { ...(u[r.id] || {}), [k]: v } }));
  const simpanSemua = async () => {
    setProses(true);
    try {
      for (const id of Object.keys(ubahan)) {
        const { error } = await supabase.from(tabel).update({ ...ubahan[id], diubah: new Date().toISOString() }).eq("id", id).eq("rs_id", rsId);
        if (error) throw error;
      }
      kabar(true, "Perubahan disimpan. Berlaku untuk analisis AI berikutnya.");
      await muat();
    } catch (e) { kabar(false, e.message); }
    setProses(false);
  };
  const tambah = async () => {
    const kosong = { rs_id: rsId };
    kolom.forEach((k) => { kosong[k.key] = k.tipe === "angka" ? 0 : k.tipe === "cek" ? true : (k.awal || ""); });
    if (urutan === "urut") kosong.urut = baris.length + 1;
    const { error } = await supabase.from(tabel).insert(kosong);
    if (error) kabar(false, error.message); else await muat();
  };
  const hapus = async (r) => {
    if (!window.confirm("Hapus baris ini?")) return;
    const { error } = await supabase.from(tabel).delete().eq("id", r.id).eq("rs_id", rsId);
    if (error) kabar(false, error.message); else await muat();
  };
  return (
    <Section title={judul} subtitle={subjudul} right={<div className="flex gap-1.5">{Object.keys(ubahan).length > 0 && <button onClick={simpanSemua} disabled={proses} className={TOMBOL_UTAMA}><Save size={12} /> Simpan perubahan</button>}<button onClick={tambah} className={TOMBOL_KEDUA}><Plus size={12} /> Tambah baris</button></div>}>
      {kabarEl}
      {memuat ? <div className="flex items-center gap-2 text-sm text-[#5B6B76]"><Loader2 size={15} className="animate-spin" /> Memuat...</div> : (
        <div className="overflow-x-auto -mx-6 px-6">
          <table className="w-full text-sm">
            <thead><tr className="text-left text-xs text-[#5B6B76] border-b border-[#E2E8ED]">{kolom.map((k) => <th key={k.key} className="py-2 pr-2">{k.label}</th>)}<th></th></tr></thead>
            <tbody>
              {baris.length === 0 && <tr><td colSpan={kolom.length + 1} className="py-3 text-sm text-[#94A3AC]">Belum ada data. Klik "Tambah baris".</td></tr>}
              {baris.map((r) => (
                <tr key={r.id} className="border-b border-[#F0F3F5] align-top">
                  {kolom.map((k) => (
                    <td key={k.key} className="py-1.5 pr-2" style={{ minWidth: k.lebar || 90 }}>
                      {k.tipe === "cek" ? <input type="checkbox" checked={!!nilai(r, k.key)} onChange={(e) => set(r, k.key, e.target.checked)} className="w-4 h-4 accent-[#0B7285] mt-1.5" />
                        : k.tipe === "panjang" ? <textarea rows={2} value={nilai(r, k.key) || ""} onChange={(e) => set(r, k.key, e.target.value)} className={KELAS_INPUT} />
                        : <input type={k.tipe === "angka" ? "number" : "text"} value={nilai(r, k.key) ?? ""} onChange={(e) => set(r, k.key, k.tipe === "angka" ? Number(e.target.value) : e.target.value)} className={KELAS_INPUT} />}
                    </td>
                  ))}
                  <td className="py-1.5"><button onClick={() => hapus(r)} className="text-[#C7D2D9] hover:text-[#B3261E] mt-1.5"><Trash2 size={14} /></button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </Section>
  );
}

// ---------------------------------------------------------------- impor tabel tarif
const TARIF_KOLOM_TEMPLATE = ["kode", "deskripsi", "jenis", "kelas3", "kelas2", "kelas1"];
function unduhTemplateTarif() {
  const ws = XLSX.utils.aoa_to_sheet([TARIF_KOLOM_TEMPLATE, ["A-4-14-I", "PENYAKIT INFEKSI BAKTERI DAN PARASIT LAIN-LAIN (RINGAN)", "RI", 2269000, 2643400, 3017700], ["Q-5-44-0", "PENYAKIT KRONIS KECIL LAIN-LAIN", "RJ", 196100, "", ""]]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Tarif");
  XLSX.writeFile(wb, "template_tarif_inacbg.xlsx");
}
const angkaTarif = (v) => {
  if (v === null || v === undefined || String(v).trim() === "") return null;
  const n = Number(String(v).replace(/[^\d.,]/g, "").replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", "."));
  return isNaN(n) ? null : Math.round(n);
};
// Baca file tarif: (a) template [kode, deskripsi, jenis, kelas3, kelas2, kelas1], atau
// (b) ekspor klaim e-Klaim (kolom INACBG, DESKRIPSI_INACBG, KELAS_RAWAT, TARIF_INACBG, PTD)
// → tarif dipelajari dari klaim nyata RS (nilai terbanyak per kode & kelas).
async function bacaFileTarif(file) {
  const buf = await file.arrayBuffer();
  const wb = /\.(txt|csv)$/i.test(file.name) ? XLSX.read(new TextDecoder().decode(buf), { type: "string" }) : XLSX.read(buf, { type: "array" });
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames.find((n) => /^ina$/i.test(n)) || wb.SheetNames[0]], { defval: "" });
  if (!rows.length) throw new Error("File kosong.");
  const kunci = (r, ...nama) => { const k = Object.keys(r).find((x) => nama.includes(String(x).trim().toLowerCase().replace(/[\s.]+/g, "_"))); return k === undefined ? undefined : r[k]; };
  const polaKode = /^[A-Z]-\d-\d{2}-(0|I|II|III)$/;
  const hasil = new Map();
  let formatEklaim = false;
  if (kunci(rows[0], "inacbg") !== undefined && kunci(rows[0], "tarif_inacbg") !== undefined) {
    formatEklaim = true;
    const hitung = {};
    rows.forEach((r) => {
      const kode = String(kunci(r, "inacbg") || "").trim().toUpperCase();
      const tarif = angkaTarif(kunci(r, "tarif_inacbg"));
      if (!polaKode.test(kode) || !tarif) return;
      const ptd = String(kunci(r, "ptd") || "").trim();
      const jenis = ptd === "2" || kode.endsWith("-0") ? "RJ" : "RI";
      const kelas = jenis === "RJ" ? "3" : String(kunci(r, "kelas_rawat") || "3").trim();
      const k = `${kode}|${kelas}`;
      hitung[k] = hitung[k] || { kode, jenis, kelas, nilai: {}, desk: String(kunci(r, "deskripsi_inacbg") || "").trim() };
      hitung[k].nilai[tarif] = (hitung[k].nilai[tarif] || 0) + 1;
    });
    Object.values(hitung).forEach((h) => {
      const terbanyak = Number(Object.keys(h.nilai).sort((a, b) => h.nilai[b] - h.nilai[a])[0]);
      const t = hasil.get(h.kode) || { kode: h.kode, deskripsi: h.desk, jenis: h.jenis, kelas3: null, kelas2: null, kelas1: null };
      if (["1", "2", "3"].includes(h.kelas)) t["kelas" + h.kelas] = terbanyak;
      hasil.set(h.kode, t);
    });
  } else {
    rows.forEach((r) => {
      const kode = String(kunci(r, "kode", "kode_inacbg", "inacbg", "kode_ina_cbg") || "").trim().toUpperCase();
      if (!polaKode.test(kode)) return;
      const jenisTulis = String(kunci(r, "jenis", "rirj", "jenis_rawat") || "").trim().toUpperCase();
      const jenis = jenisTulis.startsWith("RJ") || /JALAN/.test(jenisTulis) || kode.endsWith("-0") ? "RJ" : "RI";
      hasil.set(kode, { kode, deskripsi: String(kunci(r, "deskripsi", "deskripsi_inacbg", "nama") || "").trim(), jenis,
        kelas3: angkaTarif(kunci(r, "kelas3", "kelas_3", "tarif_kelas_3", "tarif")), kelas2: angkaTarif(kunci(r, "kelas2", "kelas_2", "tarif_kelas_2")), kelas1: angkaTarif(kunci(r, "kelas1", "kelas_1", "tarif_kelas_1")) });
    });
  }
  // Kode tarif e-Klaim (mis. CS = Kelas C Swasta, BP = Kelas B Pemerintah) untuk pengecekan silang
  let kodeTarif = "";
  if (formatEklaim) {
    const n = {};
    rows.forEach((r) => { const k = String(kunci(r, "kode_tarif") || "").trim().toUpperCase(); if (k) n[k] = (n[k] || 0) + 1; });
    kodeTarif = Object.keys(n).sort((x, y) => n[y] - n[x])[0] || "";
  }
  const daftar = [...hasil.values()].filter((t) => t.kelas3 || t.kelas2 || t.kelas1);
  if (!daftar.length) throw new Error("Tidak ada baris tarif yang valid. Pastikan kolom sesuai template (kode, deskripsi, jenis, kelas3, kelas2, kelas1) atau ekspor klaim e-Klaim.");
  return { daftar, formatEklaim, kodeTarif };
}

async function simpanBarisTarif(setId, daftar, onProgres) {
  for (let i = 0; i < daftar.length; i += 500) {
    const potong = daftar.slice(i, i + 500).map((t) => ({ set_id: setId, ...t }));
    const { error } = await supabase.from("tarif_inacbg").upsert(potong, { onConflict: "set_id,kode" });
    if (error) throw new Error("Gagal menyimpan tarif: " + error.message);
    if (onProgres) onProgres(Math.min(daftar.length, i + 500), daftar.length);
  }
  const { data, error } = await supabase.rpc("hitung_ulang_set", { p_set: setId });
  if (error) throw new Error(error.message);
  return data;
}

function FormImporTarif({ rsKhusus, onSelesai }) {
  const [f, setF] = useState({ kode: "", nama: "", kelas_rs: PROFIL.rs.kelas || "C", kepemilikan: PROFIL.rs.kepemilikan || "Swasta", regional: PROFIL.rs.regional_tarif || "1", sumber: rsKhusus ? "Ekspor e-Klaim RS" : "Permenkes No. 3 Tahun 2023", dasar: "" });
  const [file, setFile] = useState(null);
  const [setDasar, setSetDasar] = useState([]);
  const [proses, setProses] = useState("");
  const [kabarEl, kabar] = useKabar();
  useEffect(() => { supabase.from("set_tarif").select("id, kode, nama").is("rs_id", null).eq("aktif", true).order("kode").then(({ data }) => setSetDasar(data || [])); }, []);
  const kodeOtomatis = `${f.kelas_rs}${f.kepemilikan === "Pemerintah" ? "P" : "S"}-R${f.regional}${rsKhusus ? "-" + PROFIL.rs.kode : ""}`;
  const namaOtomatis = `RS Kelas ${f.kelas_rs} ${f.kepemilikan} — Regional ${f.regional}${rsKhusus ? " (khusus " + PROFIL.rs.nama + ")" : ""}`;
  const kirim = async (e) => {
    e.preventDefault();
    if (!file) { kabar(false, "Pilih file tarif dulu."); return; }
    try {
      setProses("Membaca file...");
      const { daftar, formatEklaim, kodeTarif } = await bacaFileTarif(file);
      if (/^[ABCD][PS]$/.test(kodeTarif) && (kodeTarif[0] !== f.kelas_rs || (kodeTarif[1] === "P") !== (f.kepemilikan === "Pemerintah"))) {
        const label = `Kelas ${kodeTarif[0]} ${kodeTarif[1] === "P" ? "Pemerintah" : "Swasta"}`;
        if (!window.confirm(`File e-Klaim memakai kode tarif ${kodeTarif} (${label}), sedangkan pilihan Anda Kelas ${f.kelas_rs} ${f.kepemilikan}.\n\nLanjutkan dengan pilihan Anda? (Batal untuk memperbaiki pilihan)`)) { setProses(""); return; }
      }
      setProses(`Membuat set tarif (${daftar.length} kode${formatEklaim ? " dari ekspor e-Klaim" : ""})...`);
      const { data: set, error } = await supabase.from("set_tarif").insert({
        kode: (f.kode || kodeOtomatis).toUpperCase(), nama: f.nama || namaOtomatis, kelas_rs: f.kelas_rs, kepemilikan: f.kepemilikan, regional: f.regional,
        sumber: f.sumber, rs_id: rsKhusus ? PROFIL.rs.id : null,
      }).select("id").single();
      if (error) throw new Error(/duplicate|unique/i.test(error.message) ? `Kode set "${(f.kode || kodeOtomatis).toUpperCase()}" sudah ada — isi kode lain atau perbarui set yang ada.` : error.message);
      if (f.dasar) {
        setProses("Menyalin tarif dari set dasar...");
        const dasar = [];
        for (let dari = 0; ; dari += 1000) {
          const { data } = await supabase.from("tarif_inacbg").select("kode, deskripsi, jenis, kelas3, kelas2, kelas1").eq("set_id", f.dasar).range(dari, dari + 999);
          (data || []).forEach((r) => dasar.push(r));
          if (!data || data.length < 1000) break;
        }
        await simpanBarisTarif(set.id, dasar);
      }
      const n = await simpanBarisTarif(set.id, daftar, (x, t) => setProses(`Menyimpan ${x}/${t} kode...`));
      kabar(true, `Set tarif tersimpan: ${n} kode.${formatEklaim && !f.dasar ? " Catatan: set dari ekspor e-Klaim hanya berisi kode yang pernah diklaim RS — pertimbangkan memilih set dasar agar lengkap." : ""}`);
      setFile(null);
      if (onSelesai) onSelesai(set.id);
    } catch (err) { kabar(false, err.message); }
    setProses("");
  };
  return (
    <form onSubmit={kirim} className="space-y-3">
      {kabarEl}
      <div className="grid sm:grid-cols-3 gap-3">
        <div><label className="block text-xs text-[#5B6B76] mb-1">Tipe/kelas RS</label><select value={f.kelas_rs} onChange={(e) => setF({ ...f, kelas_rs: e.target.value })} className={KELAS_INPUT}>{["A", "B", "C", "D"].map((k) => <option key={k}>{k}</option>)}</select></div>
        <div><label className="block text-xs text-[#5B6B76] mb-1">Kepemilikan</label><select value={f.kepemilikan} onChange={(e) => setF({ ...f, kepemilikan: e.target.value })} className={KELAS_INPUT}><option>Swasta</option><option>Pemerintah</option></select></div>
        <div><label className="block text-xs text-[#5B6B76] mb-1">Regional tarif</label><select value={f.regional} onChange={(e) => setF({ ...f, regional: e.target.value })} className={KELAS_INPUT}>{["1", "2", "3", "4", "5"].map((k) => <option key={k}>{k}</option>)}</select></div>
        <div><label className="block text-xs text-[#5B6B76] mb-1">Kode set</label><input value={f.kode} placeholder={kodeOtomatis} onChange={(e) => setF({ ...f, kode: e.target.value })} className={KELAS_INPUT + " font-mono"} /></div>
        <div className="sm:col-span-2"><label className="block text-xs text-[#5B6B76] mb-1">Nama set</label><input value={f.nama} placeholder={namaOtomatis} onChange={(e) => setF({ ...f, nama: e.target.value })} className={KELAS_INPUT} /></div>
        <div className="sm:col-span-2"><label className="block text-xs text-[#5B6B76] mb-1">Sumber</label><input value={f.sumber} onChange={(e) => setF({ ...f, sumber: e.target.value })} className={KELAS_INPUT} /></div>
        <div><label className="block text-xs text-[#5B6B76] mb-1">Lengkapi dari set dasar (opsional)</label><select value={f.dasar} onChange={(e) => setF({ ...f, dasar: e.target.value })} className={KELAS_INPUT}><option value="">— tanpa —</option>{setDasar.map((d) => <option key={d.id} value={d.id}>{d.kode}</option>)}</select></div>
      </div>
      <div className="flex flex-wrap items-center gap-2">
        <input type="file" accept=".xlsx,.xls,.csv,.txt" onChange={(e) => setFile(e.target.files[0] || null)} className="text-xs" />
        <button type="button" onClick={unduhTemplateTarif} className={TOMBOL_KEDUA}><Download size={12} /> Template Excel</button>
        <button type="submit" disabled={!!proses} className={TOMBOL_UTAMA}>{proses ? <Loader2 size={12} className="animate-spin" /> : <Upload size={12} />} {proses || "Impor tarif"}</button>
      </div>
      <p className="text-[11px] text-[#94A3AC]">Format diterima: template (kode, deskripsi, jenis RI/RJ, kelas3, kelas2, kelas1) dari lampiran Permenkes 3/2023, atau file ekspor klaim e-Klaim (TXT/Excel) — tarif dipelajari dari klaim nyata RS per kode & kelas rawat.</p>
    </form>
  );
}

// ---------------------------------------------------------------- admin sistem (superadmin)
const RS_KOSONG = { kode: "", nama: "", kelas: "C", kepemilikan: "Swasta", provinsi: "", regional_tarif: "1", set_tarif_id: "", paket: "Standar", kuota_ai_bulanan: 500, berlaku_sampai: "", aktif: true, catatan: "" };

function KelolaRS({ onPengguna }) {
  const [daftar, setDaftar] = useState([]);
  const [ringkas, setRingkas] = useState({});
  const [sets, setSets] = useState([]);
  const [form, setForm] = useState(null);
  const [proses, setProses] = useState(false);
  const [kabarEl, kabar] = useKabar();
  const muat = async () => {
    const [r1, r2, r3] = await Promise.all([
      supabase.from("rumah_sakit").select("*").order("nama"),
      supabase.rpc("ringkasan_rs"),
      supabase.from("set_tarif").select("id, kode, nama, kelas_rs, kepemilikan, regional, jumlah_kode, rs_id").eq("aktif", true).order("kode"),
    ]);
    if (r1.error) kabar(false, r1.error.message);
    setDaftar(r1.data || []);
    const m = {}; (r2.data || []).forEach((x) => { m[x.rs_id] = x; }); setRingkas(m);
    setSets(r3.data || []);
  };
  useEffect(() => { muat(); }, []);
  const pilihSet = (id) => {
    const st = sets.find((x) => x.id === id);
    setForm((f) => ({ ...f, set_tarif_id: id, ...(st ? { kelas: st.kelas_rs, kepemilikan: st.kepemilikan, regional_tarif: st.regional } : {}) }));
  };
  const simpan = async (e) => {
    e.preventDefault();
    setProses(true);
    try {
      const data = { ...form, kode: form.kode.trim().toUpperCase(), set_tarif_id: form.set_tarif_id || null, berlaku_sampai: form.berlaku_sampai || null, kuota_ai_bulanan: Number(form.kuota_ai_bulanan) || 0 };
      ["id", "dibuat", "pola_pending_total", "pola_pending_periode"].forEach((k) => delete data[k]);
      if (!/^[A-Z0-9_-]{2,20}$/.test(data.kode)) throw new Error("Kode RS 2–20 karakter: huruf besar, angka, - atau _.");
      if (form.id) {
        const { error } = await supabase.from("rumah_sakit").update(data).eq("id", form.id);
        if (error) throw error;
      } else {
        const { data: baru, error } = await supabase.from("rumah_sakit").insert(data).select("id").single();
        if (error) throw new Error(/duplicate|unique/i.test(error.message) ? "Kode RS sudah dipakai." : error.message);
        await supabase.from("pengaturan_rs").insert({ rs_id: baru.id, setelan: { autoAI: "sedang_tinggi" } });
      }
      kabar(true, form.id ? "Data RS diperbarui." : "RS baru didaftarkan. Lanjutkan dengan membuat akun Admin RS-nya lewat tombol Pengguna.");
      setForm(null);
      await muat();
    } catch (err) { kabar(false, err.message); }
    setProses(false);
  };
  const setLabel = (id) => { const st = sets.find((x) => x.id === id); return st ? st.kode : "— belum —"; };
  return (
    <div className="space-y-4">
      {kabarEl}
      <Section title="Rumah Sakit Pelanggan" subtitle="Daftarkan RS, atur paket, kuota AI, masa berlaku, dan tabel tarifnya" right={<button onClick={() => setForm({ ...RS_KOSONG })} className={TOMBOL_UTAMA}><Plus size={12} /> RS baru</button>}>
        <div className="overflow-x-auto -mx-6 px-6">
          <table className="w-full text-sm">
            <thead><tr className="text-left text-xs text-[#5B6B76] border-b border-[#E2E8ED]"><th className="py-2 pr-3">RS</th><th className="py-2 pr-3">Tipe · Regional</th><th className="py-2 pr-3">Set tarif</th><th className="py-2 pr-3">Paket</th><th className="py-2 pr-3">AI bln ini</th><th className="py-2 pr-3">Pengguna</th><th className="py-2 pr-3">Klaim</th><th className="py-2 pr-3">Status</th><th className="py-2"></th></tr></thead>
            <tbody>
              {daftar.map((r) => {
                const g = ringkas[r.id] || {};
                const habis = r.berlaku_sampai && r.berlaku_sampai < new Date().toISOString().slice(0, 10);
                return (
                  <tr key={r.id} className="border-b border-[#F0F3F5]">
                    <td className="py-2 pr-3"><b>{r.nama}</b><span className="block text-[11px] font-mono text-[#94A3AC]">{r.kode}</span></td>
                    <td className="py-2 pr-3 text-xs">{r.kelas} {r.kepemilikan} · R{r.regional_tarif}</td>
                    <td className="py-2 pr-3 text-xs font-mono">{setLabel(r.set_tarif_id)}</td>
                    <td className="py-2 pr-3 text-xs">{r.paket}</td>
                    <td className="py-2 pr-3 text-xs">{g.terpakai_bulan_ini ?? 0}/{r.kuota_ai_bulanan}</td>
                    <td className="py-2 pr-3 text-xs">{g.jumlah_pengguna ?? 0}</td>
                    <td className="py-2 pr-3 text-xs">{g.jumlah_klaim ?? 0}</td>
                    <td className="py-2 pr-3 text-xs">{!r.aktif ? <span className="text-[#B3261E]">Nonaktif</span> : habis ? <span className="text-[#9A6300]">Kedaluwarsa</span> : <span className="text-[#1E6B4C]">Aktif</span>}{r.berlaku_sampai && <span className="block text-[11px] text-[#94A3AC]">s.d. {r.berlaku_sampai}</span>}</td>
                    <td className="py-2 text-right whitespace-nowrap"><button onClick={() => setForm({ ...RS_KOSONG, ...r, set_tarif_id: r.set_tarif_id || "", berlaku_sampai: r.berlaku_sampai || "", provinsi: r.provinsi || "", catatan: r.catatan || "" })} className="text-xs font-medium text-[#0B7285] mr-2">Ubah</button><button onClick={() => onPengguna(r)} className="text-xs font-medium text-[#0B7285]">Pengguna</button></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </Section>
      {form && (
        <Section title={form.id ? `Ubah RS — ${form.nama}` : "Daftarkan RS baru"} right={<button onClick={() => setForm(null)} className={TOMBOL_KEDUA}>Batal</button>}>
          <form onSubmit={simpan} className="grid sm:grid-cols-3 gap-3">
            <div><label className="block text-xs text-[#5B6B76] mb-1">Kode RS</label><input required value={form.kode} onChange={(e) => setForm({ ...form, kode: e.target.value.toUpperCase() })} className={KELAS_INPUT + " font-mono"} placeholder="mis. RSXYZ" /></div>
            <div className="sm:col-span-2"><label className="block text-xs text-[#5B6B76] mb-1">Nama RS</label><input required value={form.nama} onChange={(e) => setForm({ ...form, nama: e.target.value })} className={KELAS_INPUT} /></div>
            <div className="sm:col-span-2"><label className="block text-xs text-[#5B6B76] mb-1">Set tarif INA-CBG (menentukan tipe, kepemilikan & regional)</label>
              <select value={form.set_tarif_id} onChange={(e) => pilihSet(e.target.value)} className={KELAS_INPUT}><option value="">— pilih set tarif —</option>{sets.filter((st) => !st.rs_id || st.rs_id === form.id).map((st) => <option key={st.id} value={st.id}>{st.kode} — {st.nama} ({st.jumlah_kode} kode)</option>)}</select></div>
            <div><label className="block text-xs text-[#5B6B76] mb-1">Provinsi</label><input value={form.provinsi} onChange={(e) => setForm({ ...form, provinsi: e.target.value })} className={KELAS_INPUT} /></div>
            <div><label className="block text-xs text-[#5B6B76] mb-1">Tipe/kelas RS</label><select value={form.kelas} onChange={(e) => setForm({ ...form, kelas: e.target.value })} className={KELAS_INPUT}>{["A", "B", "C", "D"].map((k) => <option key={k}>{k}</option>)}</select></div>
            <div><label className="block text-xs text-[#5B6B76] mb-1">Kepemilikan</label><select value={form.kepemilikan} onChange={(e) => setForm({ ...form, kepemilikan: e.target.value })} className={KELAS_INPUT}><option>Swasta</option><option>Pemerintah</option></select></div>
            <div><label className="block text-xs text-[#5B6B76] mb-1">Regional tarif</label><select value={form.regional_tarif} onChange={(e) => setForm({ ...form, regional_tarif: e.target.value })} className={KELAS_INPUT}>{["1", "2", "3", "4", "5"].map((k) => <option key={k}>{k}</option>)}</select></div>
            <div><label className="block text-xs text-[#5B6B76] mb-1">Paket</label><input value={form.paket} onChange={(e) => setForm({ ...form, paket: e.target.value })} className={KELAS_INPUT} /></div>
            <div><label className="block text-xs text-[#5B6B76] mb-1">Kuota AI / bulan</label><input type="number" min={0} value={form.kuota_ai_bulanan} onChange={(e) => setForm({ ...form, kuota_ai_bulanan: e.target.value })} className={KELAS_INPUT} /></div>
            <div><label className="block text-xs text-[#5B6B76] mb-1">Berlaku sampai (kosong = tanpa batas)</label><input type="date" value={form.berlaku_sampai} onChange={(e) => setForm({ ...form, berlaku_sampai: e.target.value })} className={KELAS_INPUT} /></div>
            <div className="sm:col-span-2"><label className="block text-xs text-[#5B6B76] mb-1">Catatan</label><input value={form.catatan} onChange={(e) => setForm({ ...form, catatan: e.target.value })} className={KELAS_INPUT} /></div>
            <div className="flex items-end gap-2"><label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={!!form.aktif} onChange={(e) => setForm({ ...form, aktif: e.target.checked })} className="w-4 h-4 accent-[#0B7285]" /> Langganan aktif</label></div>
            <div className="sm:col-span-3"><button type="submit" disabled={proses} className={TOMBOL_UTAMA}><Save size={12} /> Simpan</button></div>
          </form>
        </Section>
      )}
    </div>
  );
}

function KelolaSetTarif() {
  const [sets, setSets] = useState([]);
  const [imporBuka, setImporBuka] = useState(false);
  const [kabarEl, kabar] = useKabar();
  const muat = async () => { const { data, error } = await supabase.from("set_tarif").select("*").order("kode"); if (error) kabar(false, error.message); setSets(data || []); };
  useEffect(() => { muat(); }, []);
  const ubahAktif = async (st) => { const { error } = await supabase.from("set_tarif").update({ aktif: !st.aktif }).eq("id", st.id); if (error) kabar(false, error.message); else muat(); };
  const ekspor = async (st) => {
    const baris = [];
    for (let dari = 0; ; dari += 1000) {
      const { data } = await supabase.from("tarif_inacbg").select("kode, deskripsi, jenis, kelas3, kelas2, kelas1").eq("set_id", st.id).order("kode").range(dari, dari + 999);
      (data || []).forEach((r) => baris.push(r));
      if (!data || data.length < 1000) break;
    }
    const ws = XLSX.utils.json_to_sheet(baris, { header: TARIF_KOLOM_TEMPLATE });
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Tarif");
    XLSX.writeFile(wb, `tarif_${st.kode}.xlsx`);
  };
  return (
    <div className="space-y-4">
      {kabarEl}
      <Section title="Set Tarif INA-CBG" subtitle="Satu set per kombinasi tipe RS (A–D), kepemilikan, dan regional (1–5). Set resmi dipakai bersama semua RS dengan profil yang sama." right={<button onClick={() => setImporBuka(!imporBuka)} className={TOMBOL_UTAMA}><Upload size={12} /> {imporBuka ? "Tutup impor" : "Impor set baru"}</button>}>
        {imporBuka && <div className="mb-4 border border-[#CFE4E8] rounded-lg p-3 bg-[#F8FBFC]"><FormImporTarif rsKhusus={false} onSelesai={() => { setImporBuka(false); muat(); }} /></div>}
        <div className="overflow-x-auto -mx-6 px-6">
          <table className="w-full text-sm">
            <thead><tr className="text-left text-xs text-[#5B6B76] border-b border-[#E2E8ED]"><th className="py-2 pr-3">Kode</th><th className="py-2 pr-3">Nama</th><th className="py-2 pr-3">Jumlah kode</th><th className="py-2 pr-3">Sumber</th><th className="py-2 pr-3">Cakupan</th><th className="py-2 pr-3">Aktif</th><th className="py-2"></th></tr></thead>
            <tbody>
              {sets.map((st) => (
                <tr key={st.id} className="border-b border-[#F0F3F5]">

// ---------------------------------------------------------------- riwayat grouping RS dari ekspor e-Klaim
// Menghasilkan 3 tabel dengan format & ambang yang SAMA dengan data riwayat versi GAS:
//   diagnosis : [dx utama, "Y"/"N" ada prosedur, kelas, kode INA-CBG tersering, deskripsi, jumlah (≥3), tarif median]
//   presisi   : [dx utama, "Y"/"N", bucket jml dx sekunder "0"/"1"/"2+", kelas, kode, deskripsi, jumlah (≥3), tarif median]
//   dx_sekunder: [dx utama, dx sekunder, jml bersama (≥3), total klaim dx utama, persen (≥3%)]
function bangunRiwayatDariEklaim(rows) {
  const kunci = (r, ...nama) => { const k = Object.keys(r).find((x) => nama.includes(String(x).trim().toLowerCase().replace(/[\s.]+/g, "_"))); return k === undefined ? undefined : r[k]; };
  if (!rows.length || kunci(rows[0], "diaglist") === undefined || kunci(rows[0], "inacbg") === undefined) {
    throw new Error("Bukan file ekspor e-Klaim: kolom DIAGLIST dan INACBG tidak ditemukan.");
  }
  const median = (a) => { const b = [...a].sort((x, y) => x - y); const m = Math.floor(b.length / 2); return b.length % 2 ? b[m] : Math.round((b[m - 1] + b[m]) / 2); };
  const kel = {}; const kelP = {}; const totalDU = {}; const bersama = {};
  let n = 0;
  rows.forEach((r) => {
    const dx = String(kunci(r, "diaglist") || "").split(";").map((x) => x.trim().toUpperCase()).filter((x) => x && x !== "-");
    const kode = String(kunci(r, "inacbg") || "").trim().toUpperCase();
    if (!dx.length || !/^[A-Z]-\d-\d{2}-(0|I|II|III)$/.test(kode)) return;
    n += 1;
    const px = String(kunci(r, "proclist") || "").split(";").map((x) => x.trim()).filter((x) => x && x !== "-");
    const ada = px.length ? "Y" : "N";
    const kelas = Number(String(kunci(r, "kelas_rawat") || "3").trim()) || 3;
    const tarif = Number(String(kunci(r, "tarif_inacbg") || "0").replace(/[^\d]/g, "")) || 0;
    const desk = String(kunci(r, "deskripsi_inacbg") || "").trim();
    const du = dx[0]; const sek = [...new Set(dx.slice(1))];
    const bucket = sek.length === 0 ? "0" : sek.length === 1 ? "1" : "2+";
    const tambah = (peta, k) => { peta[k] = peta[k] || {}; peta[k][kode] = peta[k][kode] || { n: 0, t: [], d: desk }; peta[k][kode].n += 1; if (tarif) peta[k][kode].t.push(tarif); };
    tambah(kel, `${du}|${ada}|${kelas}`);
    tambah(kelP, `${du}|${ada}|${bucket}|${kelas}`);
    totalDU[du] = (totalDU[du] || 0) + 1;
    sek.forEach((x) => { const k = `${du}|${x}`; bersama[k] = (bersama[k] || 0) + 1; });
  });
  const tersering = (peta, susun) => Object.keys(peta).map((k) => {
    const [kode, v] = Object.entries(peta[k]).sort((a, b) => b[1].n - a[1].n)[0];
    return v.n >= 3 ? susun(k.split("|"), kode, v) : null;
  }).filter(Boolean);
  const diagnosis = tersering(kel, ([du, ada, kelas], kode, v) => [du, ada, Number(kelas), kode, v.d, v.n, v.t.length ? median(v.t) : 0]);
  const presisi = tersering(kelP, ([du, ada, bucket, kelas], kode, v) => [du, ada, bucket, Number(kelas), kode, v.d, v.n, v.t.length ? median(v.t) : 0]);
  const dxSekunder = Object.keys(bersama).map((k) => {
    const [du, x] = k.split("|"); const j = bersama[k]; const tot = totalDU[du]; const persen = Math.round((j / tot) * 1000) / 10;
    return j >= 3 && persen >= 3 ? [du, x, j, tot, persen] : null;
  }).filter(Boolean).sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : b[2] - a[2]));
  return { diagnosis, presisi, dxSekunder, jumlah: n };
}

function PanelRiwayatGrouping() {
  const [file, setFile] = useState(null);
  const [periode, setPeriode] = useState(RIWAYAT_INFO.periode || "");
  const [proses, setProses] = useState("");
  const [kabarEl, kabar] = useKabar();
  const unggah = async (e) => {
    e.preventDefault();
    if (!file) { kabar(false, "Pilih file ekspor e-Klaim dulu."); return; }
    try {
      setProses("Membaca file...");
      const buf = await file.arrayBuffer();
      const wb = /\.(txt|csv)$/i.test(file.name) ? XLSX.read(new TextDecoder().decode(buf), { type: "string" }) : XLSX.read(buf, { type: "array" });
      const sheet = wb.SheetNames.find((x) => /^ina$/i.test(x)) || wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheet], { defval: "" });
      setProses(`Mempelajari ${rows.length.toLocaleString("id-ID")} baris klaim...`);
      const h = bangunRiwayatDariEklaim(rows);
      if (!h.diagnosis.length) throw new Error("Data terlalu sedikit — belum ada kombinasi diagnosis yang muncul minimal 3x.");
      setProses("Menyimpan...");
      const { error } = await supabase.from("riwayat_rs").upsert({ rs_id: PROFIL.rs.id, diagnosis: h.diagnosis, presisi: h.presisi, dx_sekunder: h.dxSekunder, periode, jumlah_klaim: h.jumlah, sumber: file.name, diubah: new Date().toISOString() }, { onConflict: "rs_id" });
      if (error) throw new Error(error.message);
      await muatRiwayatRS();
      kabar(true, `Riwayat grouping diperbarui dari ${h.jumlah.toLocaleString("id-ID")} klaim: ${h.diagnosis.length} pola diagnosis, ${h.presisi.length} pola presisi, ${h.dxSekunder.length} pasangan diagnosis sekunder. Langsung dipakai untuk saran kode.`);
      setFile(null);
    } catch (err) { kabar(false, err.message); }
    setProses("");
  };
  return (
    <Section title="Riwayat Grouping RS" subtitle="Saran kode INA-CBG & diagnosis sekunder yang sering menyertai, dipelajari dari klaim nyata RS Anda sendiri">
      {kabarEl}
      <p className="text-xs bg-[#E4F3EC] text-[#1E6B4C] rounded-lg px-3 py-2 mb-3">Pola grouping acuan sistem{RIWAYAT_ACUAN_INFO.jumlah ? ` (${RIWAYAT_ACUAN_INFO.jumlah.toLocaleString("id-ID")} klaim${RIWAYAT_ACUAN_INFO.periode ? ", " + RIWAYAT_ACUAN_INFO.periode : ""})` : ""} {RIWAYAT_ACUAN_INFO.jumlah ? `aktif — melengkapi ${RIWAYAT_ACUAN_INFO.dipakai} pola diagnosis yang belum ada di riwayat RS ini. Riwayat RS sendiri selalu diutamakan; tarif selalu dari tabel tarif RS ini.` : "belum tersedia."}</p>
      {PROFIL && PROFIL.peran === "superadmin" && RIWAYAT_INFO.jumlah > 0 && (
        <button type="button" onClick={async () => {
          if (!window.confirm(`Jadikan riwayat grouping ${PROFIL.rs.nama} (${RIWAYAT_INFO.jumlah.toLocaleString("id-ID")} klaim) sebagai POLA ACUAN untuk semua RS? Yang dibagikan hanya pasangan diagnosis → kode INA-CBG + jumlah kejadian (tanpa data pasien & tanpa tarif).`)) return;
          const tanpaTarif = (arr, iTarif) => arr.filter((r) => r[r.length - 1] !== "acuan").map((r) => r.map((v, i) => (i === iTarif ? 0 : v)));
          const { error } = await supabase.from("riwayat_acuan").upsert({ id: 1, diagnosis: tanpaTarif(DAFTAR_RIWAYAT_DIAGNOSIS_INACBG, 6), presisi: tanpaTarif(DAFTAR_RIWAYAT_PRESISI, 7), dx_sekunder: DAFTAR_DIAGNOSIS_SEKUNDER_TERKAIT.filter((r) => r[5] !== "acuan"), periode: RIWAYAT_INFO.periode, jumlah_klaim: RIWAYAT_INFO.jumlah, sumber: PROFIL.rs.kode, diubah: new Date().toISOString() }, { onConflict: "id" });
          if (error) kabar(false, error.message); else { await muatRiwayatRS(); kabar(true, "Pola acuan diperbarui — langsung dipakai semua RS saat login berikutnya."); }
        }} className="mb-3 text-xs font-semibold text-[#0B7285] hover:underline">Jadikan riwayat RS ini pola acuan untuk semua RS (superadmin)</button>
      )}
      <p className="text-sm text-[#334652] mb-3">Saat ini: {RIWAYAT_INFO.jumlah ? <b>{RIWAYAT_INFO.jumlah.toLocaleString("id-ID")} klaim{RIWAYAT_INFO.periode ? " · " + RIWAYAT_INFO.periode : ""}</b> : <b>belum ada data</b>} · {DAFTAR_RIWAYAT_DIAGNOSIS_INACBG.length} pola diagnosis, {DAFTAR_RIWAYAT_PRESISI.length} pola presisi, {DAFTAR_DIAGNOSIS_SEKUNDER_TERKAIT.length} pasangan dx sekunder</p>
      <form onSubmit={unggah} className="space-y-2">
        <div className="flex flex-wrap gap-2 items-end">
          <div><label className="block text-xs text-[#5B6B76] mb-1">File ekspor klaim e-Klaim (TXT/Excel)</label><input type="file" accept=".xlsx,.xls,.csv,.txt" onChange={(e) => setFile(e.target.files[0] || null)} className="text-xs" /></div>
          <div className="flex-1 min-w-[180px]"><label className="block text-xs text-[#5B6B76] mb-1">Periode data</label><input value={periode} onChange={(e) => setPeriode(e.target.value)} placeholder="mis. Januari–September 2026" className={KELAS_INPUT} /></div>
          <button type="submit" disabled={!!proses} className={TOMBOL_UTAMA}>{proses ? <Loader2 size={12} className="animate-spin" /> : <Upload size={12} />} {proses || "Pelajari & simpan"}</button>
        </div>
        <p className="text-[11px] text-[#94A3AC]">Gunakan ekspor klaim e-Klaim beberapa bulan sekaligus (makin banyak makin akurat). Unggahan baru MENGGANTI riwayat sebelumnya — gabungkan periode lama + baru dalam satu file. Hanya pola yang muncul minimal 3x yang dipakai; data pasien tidak disimpan, hanya ringkasan statistiknya.</p>
      </form>
    </Section>
  );
}

async function keluarAplikasi() {
  if (supabase) await supabase.auth.signOut();
  PROFIL = null;
  window.location.reload();
}

/* ----------------------------------------------------------------------
   GERBANG LOGIN — aplikasi hanya dirender setelah login & profil RS valid
---------------------------------------------------------------------- */
function GerbangLogin() {
  useFonts();
  const [tahap, setTahap] = useState(KONFIG_BELUM_DIISI ? "konfig" : "cek");   // konfig | cek | login | siap
  const [profil, setProfil] = useState(null);
  const [email, setEmail] = useState("");
  const [sandi, setSandi] = useState("");
  const [galat, setGalat] = useState("");
  const [proses, setProses] = useState(false);

  const muatProfil = async () => {
    const { data, error } = await supabase.rpc("profil_saya");
    if (error) throw new Error("Gagal membaca profil: " + error.message);
    if (!data) throw new Error("Akun ini belum didaftarkan ke rumah sakit mana pun. Hubungi admin RS / penyedia layanan.");
    if (!data.aktif) throw new Error("Akun ini sedang dinonaktifkan. Hubungi admin RS.");
    if (!data.rs) throw new Error("Akun ini belum terhubung ke rumah sakit. Hubungi penyedia layanan.");
    if (!data.rs.aktif) throw new Error(`Langganan ${data.rs.nama} sedang nonaktif. Hubungi penyedia layanan.`);
    PROFIL = data;
    await muatTarifRS();
    await muatRiwayatRS();
    setProfil(data);
    setTahap("siap");
  };

  useEffect(() => {
    if (KONFIG_BELUM_DIISI) return;
    supabase.auth.getSession().then(async ({ data }) => {
      if (!data.session) { setTahap("login"); return; }
      try { await muatProfil(); } catch (e) { setGalat(e.message); await supabase.auth.signOut(); setTahap("login"); }
    });
    const { data: langganan } = supabase.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT") { PROFIL = null; setProfil(null); setTahap("login"); } });
    return () => langganan.subscription.unsubscribe();
  }, []);

  const masuk = async (e) => {
    e.preventDefault();
    setGalat(""); setProses(true);
    try {
      const { error } = await supabase.auth.signInWithPassword({ email: email.trim(), password: sandi });
      if (error) throw new Error(/invalid/i.test(error.message) ? "Email atau kata sandi salah." : error.message);
      await muatProfil();
    } catch (err) {
      setGalat(err.message || String(err));
      if (supabase) await supabase.auth.signOut();
    }
    setProses(false);
  };

  if (tahap === "siap" && profil) return <App key={profil.id} />;

  return (
    <div style={{ fontFamily: "'IBM Plex Sans',sans-serif" }} className="min-h-screen bg-[#0F2A3D] flex items-center justify-center p-4">
      <div className="w-full max-w-sm">
        <div className="text-center mb-6">
          <div className="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-[#0B7285] mb-3"><ShieldCheck size={24} className="text-white" /></div>
          <p className="text-xs uppercase tracking-wider text-[#7FA8B5] font-medium">Skrining Kepatuhan Klaim</p>
          <h1 style={{ fontFamily: "'Space Grotesk',sans-serif" }} className="text-2xl font-bold text-white mt-1">Deteksi Dini Klaim INA-CBG</h1>
        </div>
        <div className="bg-white rounded-2xl shadow-xl p-6">
          {tahap === "konfig" && (
            <div className="text-sm text-[#334652] space-y-2">
              <p className="font-semibold text-[#B3261E]">Konfigurasi belum diisi</p>
              <p>Buka file <code className="bg-[#F0F3F5] px-1 rounded">index.html</code>, cari bagian <b>KONFIGURASI SUPABASE</b>, lalu isi <code className="bg-[#F0F3F5] px-1 rounded">SUPABASE_URL</code> dan <code className="bg-[#F0F3F5] px-1 rounded">SUPABASE_PUBLISHABLE_KEY</code> dari Project Settings Supabase.</p>
            </div>
          )}
          {tahap === "cek" && <div className="flex items-center justify-center gap-2 text-sm text-[#5B6B76] py-6"><Loader2 size={16} className="animate-spin" /> Memeriksa sesi...</div>}
          {tahap === "login" && (
            <form onSubmit={masuk} className="space-y-3">
              <div>
                <label className="block text-xs font-medium text-[#5B6B76] mb-1">Email</label>
                <input type="email" required autoComplete="username" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full rounded-lg border border-[#D7DEE3] px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#0B7285]/40" placeholder="nama@rumahsakit.id" />
              </div>
              <div>
                <label className="block text-xs font-medium text-[#5B6B76] mb-1">Kata sandi</label>
                <input type="password" required autoComplete="current-password" value={sandi} onChange={(e) => setSandi(e.target.value)} className="w-full rounded-lg border border-[#D7DEE3] px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#0B7285]/40" />
              </div>
              {galat && <p className="text-xs text-[#B3261E] bg-[#FCE9E7] rounded-lg px-3 py-2">{galat}</p>}
              <button type="submit" disabled={proses} className="w-full inline-flex items-center justify-center gap-2 py-2.5 rounded-lg bg-[#0B7285] text-white text-sm font-semibold hover:bg-[#095e6b] disabled:opacity-50">
                {proses && <Loader2 size={15} className="animate-spin" />} {proses ? "Memproses..." : "Masuk"}
              </button>
              <p className="text-[11px] text-[#94A3AC] text-center">Lupa kata sandi atau belum punya akun? Hubungi admin rumah sakit Anda.</p>
            </form>
          )}
        </div>
        <p className="text-[11px] text-[#7FA8B5] text-center mt-4">Data klaim dilindungi login & pemisahan data per rumah sakit. Hasil skrining adalah alat bantu, bukan keputusan koding.</p>
      </div>
    </div>
  );
}

createRoot(document.getElementById("root")).render(<GerbangLogin />);

</script>
