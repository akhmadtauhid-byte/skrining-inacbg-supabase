function mdToHtml(text) {
  if (!text) return "";
  return text
    .split("\n\n").map((para) => {
      const escaped = para.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const bolded = escaped.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
      return `<p style="margin:4px 0; font-size:12px; line-height:1.5;">${bolded.replace(/\n/g, "<br/>")}</p>`;
    }).join("");
}

function riskColorHex(level) {
  if (level === "Tinggi") return "#B3261E";
  if (level === "Sedang") return "#9A6300";
  if (level === "Belum Lengkap") return "#5B6B76";
  return "#1E6B4C";
}
function riskBgHex(level) {
  if (level === "Tinggi") return "#FCE9E7";
  if (level === "Sedang") return "#FCF1DD";
  if (level === "Belum Lengkap") return "#F0F3F5";
  return "#E4F3EC";
}

function buildClaimPrintSection(claim, isLast) {
  const flagsHtml = claim.flags.length === 0
    ? `<p style="font-size:12px; color:#1E6B4C;">Tidak ada penanda risiko terdeteksi pada skrining awal.</p>`
    : `<ul style="margin:4px 0; padding-left:18px;">${claim.flags.map((f) => `<li style="font-size:12px; margin-bottom:4px;"><b>${f.label}</b> — ${f.detail}</li>`).join("")}</ul>`;

  const notesHtml = (claim.notes && claim.notes.length > 0)
    ? `<h4 style="font-size:13px; margin:14px 0 6px;">Catatan Validitas Kode</h4><ul style="margin:4px 0; padding-left:18px;">${claim.notes.map((n) => `<li style="font-size:12px; margin-bottom:4px;"><b>${n.label}</b> — ${n.detail}</li>`).join("")}</ul>`
    : "";

  const sepHtml = claim.sep
    ? `<h4 style="font-size:13px; margin:14px 0 6px;">Kelengkapan SEP</h4>
       <table style="width:100%; border-collapse:collapse;">
         ${Object.keys(SEP_FIELD_LABELS).map((f) => {
           const val = claim.sep[f];
           const filled = val && val.trim() !== "" && val.trim() !== "-";
           return `<tr><td style="border:1px solid #ddd; padding:4px 8px; font-size:11px; width:40%;">${SEP_FIELD_LABELS[f]}</td><td style="border:1px solid #ddd; padding:4px 8px; font-size:11px; color:${filled ? "#1E6B4C" : "#B3261E"};">${filled ? (val || "-") : "(kosong)"}</td></tr>`;
         }).join("")}
       </table>`
    : "";

  const aiHtml = claim.aiStatus === "done" && claim.aiAnalysis
    ? `<h4 style="font-size:13px; margin:14px 0 6px;">Opini AI</h4><div style="background:#F4F9FA; border:1px solid #CFE4E8; border-radius:6px; padding:10px 12px;">${mdToHtml(teksOpiniTanpaBlok(claim.aiAnalysis))}</div>`
    : "";

  const saranHtml = claim.aiStatus === "done" ? saranKodingHtml(claim) : "";

  return `
  <div style="padding:28px 32px; font-family: Arial, Helvetica, sans-serif; color:#0F2A3D; ${isLast ? "" : "page-break-after: always;"}">
    <div style="border-bottom:2px solid #0F2A3D; padding-bottom:10px; margin-bottom:16px;">
      <div style="font-size:10px; color:#7FA8B5; text-transform:uppercase; letter-spacing:0.06em;">${escHtml(namaRSAktif())} — Lembar Skrining Klaim INA-CBG</div>
      <div style="font-size:17px; font-weight:bold; margin-top:2px;">No. RM ${claim.noRM} — ${claim.namaPasien || "-"}</div>
      <div style="font-size:11px; color:#5B6B76;">${claim.inacbgCode} · ${claim.dpjp || "DPJP tidak diisi"}</div>
    </div>

    <div style="margin-bottom:12px;">
      <span style="display:inline-block; padding:3px 12px; border-radius:12px; font-size:12px; font-weight:bold; background:${riskBgHex(claim.riskLevel)}; color:${riskColorHex(claim.riskLevel)};">Risiko ${claim.riskLevel}</span>
      <span style="font-size:12px; color:#5B6B76; margin-left:8px;">Skor risiko: <b>${claim.score}</b></span>
    </div>

    <table style="width:100%; border-collapse:collapse; margin-bottom:12px;">
      <tr><td style="border:1px solid #ddd; padding:5px 8px; font-size:11px; color:#5B6B76; width:22%;">Diagnosis utama</td><td style="border:1px solid #ddd; padding:5px 8px; font-size:11px;">${claim.primaryDxCode} ${claim.primaryDxDesc || ""}</td>
          <td style="border:1px solid #ddd; padding:5px 8px; font-size:11px; color:#5B6B76; width:18%;">Jenis perawatan</td><td style="border:1px solid #ddd; padding:5px 8px; font-size:11px;">${claim.jenisRawat || "Rawat Inap"}</td></tr>
      <tr><td style="border:1px solid #ddd; padding:5px 8px; font-size:11px; color:#5B6B76;">Severity</td><td style="border:1px solid #ddd; padding:5px 8px; font-size:11px;">${claim.severityLevel}</td>
          <td style="border:1px solid #ddd; padding:5px 8px; font-size:11px; color:#5B6B76;">Kelas rawat</td><td style="border:1px solid #ddd; padding:5px 8px; font-size:11px;">Kelas ${claim.kelasRawat}</td></tr>
      <tr><td style="border:1px solid #ddd; padding:5px 8px; font-size:11px; color:#5B6B76;">Lama rawat (LOS)</td><td style="border:1px solid #ddd; padding:5px 8px; font-size:11px;">${claim.los} hari</td>
          <td style="border:1px solid #ddd; padding:5px 8px; font-size:11px; color:#5B6B76;">Tarif klaim</td><td style="border:1px solid #ddd; padding:5px 8px; font-size:11px;">Rp${parseAngka(claim.tarifKlaim).toLocaleString("id-ID")}</td></tr>
      <tr><td style="border:1px solid #ddd; padding:5px 8px; font-size:11px; color:#5B6B76;">Bukti penunjang</td><td style="border:1px solid #ddd; padding:5px 8px; font-size:11px;">${claim.buktiPenunjang ? "Ada" : "Belum ditandai"}</td>
          <td style="border:1px solid #ddd; padding:5px 8px; font-size:11px; color:#5B6B76;">Special CMG</td><td style="border:1px solid #ddd; padding:5px 8px; font-size:11px;">${claim.specialCMG ? claim.specialCMGKategori : "Tidak"}</td></tr>
    </table>

    <h4 style="font-size:13px; margin:14px 0 6px;">Penanda Risiko yang Terpicu (${claim.flags.length})</h4>
    ${flagsHtml}
    ${notesHtml}
    ${sepHtml}
    ${aiHtml}
    ${saranHtml}
    ${inkonsistensiHtml(claim)}

    <div style="margin-top:28px; padding-top:10px; border-top:1px solid #E2E8ED; font-size:9px; color:#94A3AC;">
      Dicetak: ${new Date().toLocaleString("id-ID")} — Hasil skrining adalah indikasi awal berbasis aturan + opini AI otomatis, bukan vonis kecurangan. Tetap perlu diverifikasi koder/verifikator dan DPJP terhadap rekam medis sebelum keputusan final.
    </div>
  </div>`;
}

function printClaims(claims) {
  if (!claims || claims.length === 0) return;
  const sections = claims.map((c, i) => buildClaimPrintSection(c, i === claims.length - 1)).join("");
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Cetak Berkas Skrining INA-CBG</title>
    <style>@page { size: A4; margin: 0; } body { margin:0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }</style>
    </head><body>${sections}</body></html>`;

  // Jalur utama: coba buka tab baru & langsung print (ideal, tapi sering diblokir
  // panel artifact claude.ai karena berjalan di iframe sandbox).
  let win = null;
  try { win = window.open("", "_blank"); } catch (e) { win = null; }

  if (win && !win.closed) {
    try {
      win.document.write(html);
      win.document.close();
      setTimeout(() => { win.focus(); win.print(); }, 300);
      return;
    } catch (e) { /* lanjut ke jalur cadangan di bawah */ }
  }

  // Jalur cadangan: kalau tab baru gagal dibuka/diblokir, unduh sebagai file HTML —
  // buka file itu di luar claude.ai lalu tekan Ctrl+P (atau Cmd+P) utk cetak/simpan PDF.
  try {
    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `cetak-klaim-inacbg-${new Date().toISOString().slice(0, 10)}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    alert('Tab baru diblokir oleh panel claude.ai — file cetak sudah diunduh sebagai HTML ke perangkat Anda. Buka file itu (folder Downloads), lalu tekan Ctrl+P (Windows) atau Cmd+P (Mac) untuk mencetak atau menyimpan sebagai PDF.');
  } catch (e2) {
    alert('Gagal membuat berkas cetak: ' + (e2 && e2.message ? e2.message : 'kesalahan tidak diketahui') + '. Coba buka sistem ini lewat file HTML standalone (di luar claude.ai) untuk mencetak.');
  }
}

// Panel rekomendasi koding dari AI: diagnosis utama, sekunder (tambah/hapus),
// prosedur, dan draf query ke DPJP — masing-masing dengan bukti tertulis. Bisa
// diterapkan ke klaim HANYA lewat klik + konfirmasi; kode lama disimpan di riwayat.
function PanelSaranKoding({ claim, onUpdateClaim }) {
  const [disalin, setDisalin] = useState(false);
  const s = bacaSaranKodingAI(claim.aiAnalysis);
  if (!s) return null;
  const up = (x) => String(x || "").trim().toUpperCase();
  const du = s.diagnosisUtama || {};
  const tambah = (s.diagnosisSekunderTambah || []).filter((d) => d && d.kode);
  const hapus = (s.diagnosisSekunderHapus || []).filter((d) => d && d.kode);
  const prTambah = (s.prosedurTambah || []).filter((p) => p && p.kode);
  const prHapus = (s.prosedurHapus || []).filter((p) => p && p.kode);
  const query = (s.queryDPJP || []).filter((q) => q && String(q).trim());
  const gantiUtama = !!du.kodeSaran && up(du.kodeSaran) !== up(claim.primaryDxCode);
  const adaPerubahan = gantiUtama || tambah.length > 0 || hapus.length > 0 || prTambah.length > 0 || prHapus.length > 0;

  const terapkan = () => {
    if (!window.confirm("Terapkan rekomendasi koding AI ke klaim ini?\n\nPastikan SUDAH diverifikasi koder & DPJP terhadap rekam medis. Kode lama disimpan di riwayat koreksi klaim; skrining & opini AI akan dihitung ulang. Setelah ini lakukan grouping ulang di e-Klaim lalu perbarui Kode INA-CBG & tarif lewat tombol Edit.")) return;
    const utamaKode = gantiUtama ? String(du.kodeSaran).trim() : claim.primaryDxCode;
    const utamaDesc = gantiUtama ? (du.deskripsi || "") : claim.primaryDxDesc;
    const setHapus = new Set(hapus.map((d) => up(d.kode)));
    let sekunder = (claim.secondaryDx || []).filter((d) => !setHapus.has(up(d.code)));
    tambah.forEach((d) => { if (!sekunder.some((x) => up(x.code) === up(d.kode))) sekunder.push({ code: String(d.kode).trim(), desc: d.deskripsi || "" }); });
    sekunder = sekunder.filter((d) => up(d.code) !== up(utamaKode));
    const setPrHapus = new Set(prHapus.map((p) => up(p.kode)));
    const prosedur = (claim.procedures || []).filter((p) => !setPrHapus.has(up(p.code)));
    prTambah.forEach((p) => { if (!prosedur.some((x) => up(x.code) === up(p.kode))) prosedur.push({ code: String(p.kode).trim(), desc: p.deskripsi || "" }); });
    const catatan = {
      waktu: new Date().toISOString(), sumber: "Rekomendasi koding AI (diterapkan manual setelah verifikasi)",
      sebelum: { primaryDxCode: claim.primaryDxCode, primaryDxDesc: claim.primaryDxDesc, secondaryDx: claim.secondaryDx || [], procedures: claim.procedures || [], inacbgCode: claim.inacbgCode },
      opiniAI: claim.aiAnalysis,
    };
    onUpdateClaim(claim.id, { primaryDxCode: utamaKode, primaryDxDesc: utamaDesc, secondaryDx: sekunder, procedures: prosedur,
      riwayatKoreksi: [...(claim.riwayatKoreksi || []), catatan], aiStatus: "idle", aiAnalysis: "",
      arsipInkonsistensi: gabungInkonsistensi(claim.arsipInkonsistensi, ekstrakInkonsistensi(claim.aiAnalysis)) });
  };

  const salinQuery = () => {
    const teks = `Kepada Yth. ${claim.dpjp || "DPJP"}\nPerihal: Konfirmasi dokumentasi klaim — No. RM ${claim.noRM}${claim.namaPasien ? ` (${claim.namaPasien})` : ""}${claim.tglMasuk ? `, masuk ${claim.tglMasuk}` : ""}\n\nMohon konfirmasi/kelengkapan catatan berikut di rekam medis:\n${query.map((q, i) => `${i + 1}. ${q}`).join("\n")}\n\nTerima kasih.\nTim Koding/Casemix`;
    try {
      navigator.clipboard.writeText(teks).then(() => { setDisalin(true); setTimeout(() => setDisalin(false), 2500); }, () => window.prompt("Salin teks query berikut:", teks));
    } catch (e) { window.prompt("Salin teks query berikut:", teks); }
  };

  const Bukti = ({ t }) => (t ? <p className="text-xs text-[#5B6B76] italic mt-0.5">Bukti: "{t}"</p> : null);
  return (
    <div className="mt-3 border border-[#CFE4E8] rounded-lg overflow-hidden">
      <div className="bg-[#0F2A3D] text-white text-sm font-semibold px-3 py-2">Rekomendasi Koding AI <span className="font-normal text-xs text-[#BFD6DD]">— wajib diverifikasi koder & DPJP</span></div>
      <div className="p-3 space-y-3 text-sm">
        <div>
          <p className="text-xs text-[#94A3AC] mb-0.5">Diagnosis utama</p>
          {gantiUtama ? (
            <p><span className="font-mono line-through text-[#B3261E]">{claim.primaryDxCode}</span> → <span className="font-mono font-semibold text-[#1E6B4C]">{du.kodeSaran}</span> {du.deskripsi}</p>
          ) : (
            <p><span className="font-mono">{claim.primaryDxCode}</span> <span className="text-[#1E6B4C]">— sudah tepat</span></p>
          )}
          {du.alasan && <p className="text-xs text-[#334652] mt-0.5">{du.alasan}</p>}
          <Bukti t={du.bukti} />
        </div>
        {tambah.length > 0 && (
          <div>
            <p className="text-xs text-[#94A3AC] mb-1">Diagnosis sekunder yang disarankan ditambah</p>
            <ul className="space-y-1.5">{tambah.map((d, i) => <li key={i}><span className="font-mono font-semibold text-[#1E6B4C]">+ {d.kode}</span> {d.deskripsi}{d.alasan && <span className="block text-xs text-[#334652]">{d.alasan}</span>}<Bukti t={d.bukti} /></li>)}</ul>
          </div>
        )}
        {hapus.length > 0 && (
          <div>
            <p className="text-xs text-[#94A3AC] mb-1">Diagnosis sekunder yang disarankan dihapus</p>
            <ul className="space-y-1">{hapus.map((d, i) => <li key={i}><span className="font-mono font-semibold text-[#B3261E]">− {d.kode}</span> <span className="text-xs text-[#334652]">{d.alasan}</span></li>)}</ul>
          </div>
        )}
        {(prTambah.length > 0 || prHapus.length > 0) && (
          <div>
            <p className="text-xs text-[#94A3AC] mb-1">Prosedur (ICD-9-CM)</p>
            <ul className="space-y-1">
              {prTambah.map((p, i) => <li key={"t" + i}><span className="font-mono font-semibold text-[#1E6B4C]">+ {p.kode}</span> {p.deskripsi}<Bukti t={p.bukti} /></li>)}
              {prHapus.map((p, i) => <li key={"h" + i}><span className="font-mono font-semibold text-[#B3261E]">− {p.kode}</span> <span className="text-xs text-[#334652]">{p.alasan}</span></li>)}
            </ul>
          </div>
        )}
        {query.length > 0 && (
          <div className="bg-[#FBF8F0] border border-[#F0E6C8] rounded-lg p-2.5">
            <p className="text-xs font-medium text-[#9A6300] mb-1">Perlu konfirmasi DPJP (belum cukup bukti tertulis)</p>
            <ul className="text-xs text-[#5B6B76] list-decimal list-inside space-y-0.5">{query.map((q, i) => <li key={i}>{q}</li>)}</ul>
          </div>
        )}
        {rekomendasiLayananAI(s).length > 0 && (
          <div>
            <p className="text-xs text-[#94A3AC] mb-1">Penunjang · Terapi · Layanan</p>
            <ul className="space-y-1.5">{rekomendasiLayananAI(s).map((r, i) => (
              <li key={i} className="text-xs text-[#334652]">
                <span className="inline-block px-1.5 py-0.5 mr-1.5 rounded bg-[#EEF4F6] text-[#0B7285] font-semibold">{r.aspek}</span>
                {r.temuan}{r.saran && <span className="block mt-0.5 text-[#0F2A3D]">→ {r.saran}{r.unitTerkait && <span className="text-[#94A3AC]"> ({r.unitTerkait})</span>}</span>}
              </li>
            ))}</ul>
          </div>
        )}
        {s.perkiraanDampak && <p className="text-xs text-[#334652]"><b>Perkiraan dampak:</b> {s.perkiraanDampak}</p>}
        <div className="flex flex-wrap gap-2 pt-1">
          {adaPerubahan && onUpdateClaim && (
            <button onClick={terapkan} className="text-xs font-semibold px-3 py-1.5 rounded-lg bg-[#1E6B4C] text-white hover:bg-[#175a3d]">Terapkan ke klaim (setelah diverifikasi)</button>
          )}
          {query.length > 0 && (
            <button onClick={salinQuery} className="text-xs font-semibold px-3 py-1.5 rounded-lg bg-white border border-[#D7DEE3] text-[#334652] hover:bg-[#F4F9FA]">{disalin ? "Tersalin ✓" : "Salin draf query ke DPJP"}</button>
          )}
        </div>
      </div>
    </div>
  );
}


// Keterangan di bawah kolom tarif: asal angka & tombol isi dari tabel tarif RS
function InfoTarifOtomatis({ kode, kelas, tarif, otomatis, onIsi }) {
  const t = tarifResmiUntuk(kode, kelas);
  if (!String(kode || "").trim()) return null;
  if (!t) return <span className="block text-[11px] text-[#94A3AC] mt-1">Kode tidak ada di tabel tarif RS — isi tarif sesuai e-Klaim.</span>;
  if (otomatis && parseAngka(tarif) === t) return <span className="block text-[11px] text-[#1E6B4C] mt-1">Terisi otomatis dari tabel tarif RS ({labelTarif()}). Ubah bila ada top-up/special CMG.</span>;
  return <button type="button" onClick={() => onIsi(t)} className="block text-[11px] text-[#0B7285] font-semibold mt-1 hover:underline">Isi dari tabel tarif: Rp{t.toLocaleString("id-ID")}</button>;
}


// Daftar deskripsi RESMI (tabel tarif RS) untuk setiap kode INA-CBG yang disebut AI —
// supaya salah-sebut nama kode oleh AI langsung kelihatan oleh koder.
function KodeResmiDisebutAI({ teks, kelas }) {
  const kode = [...new Set((String(teks || "").match(/\b[A-Z]-\d-\d{2}-(?:0|III|II|I)\b/g) || []))].slice(0, 8);
  if (!kode.length) return null;
  return (
    <div className="mt-2 text-xs bg-white border border-[#E2E8ED] rounded-lg p-2.5">
      <p className="font-semibold text-[#0F2A3D] mb-1">Deskripsi resmi kode yang disebut AI (tabel tarif RS, Kelas {kelas || "3"})</p>
      <ul className="space-y-0.5">
        {kode.map((k) => {
          const r = TARIF_REF_MAP[k]; const t = tarifResmiUntuk(k, kelas);
          return <li key={k}><span className="font-mono font-semibold">{k}</span> — {r ? r[1] : <span className="text-[#B3261E]">tidak ada di tabel tarif RS ini — perlu dicek di e-Klaim</span>}{t ? ` · Rp${t.toLocaleString("id-ID")}` : ""}</li>;
        })}
      </ul>
    </div>
  );
}


// Lembar Input Koding e-Klaim: diagnosis utama, sekunder & tindakan (ICD-9-CM) yang siap
// disalin ke aplikasi e-Klaim/berkas BPJS. Bisa menampilkan data klaim saat ini, atau
// USULAN setelah rekomendasi AI (ditandai jelas belum diverifikasi).
function LembarKodingEklaim({ claim }) {
  const [tersalin, setTersalin] = useState("");
  const [versi, setVersi] = useState("klaim");
  const up = (x) => String(x || "").trim().toUpperCase();
  const deskDx = (code, desc) => {
    if (String(desc || "").trim()) return desc;
    const c = findICD10Category3(code);
    return c.known ? `${c.title} (kategori)` : "";
  };
  const deskPr = (code, desc) => {
    if (String(desc || "").trim()) return desc;
    const f = findICD9ProcExact(code);
    if (f.known) return f.title;
    const k = findICD9Category(code);
    return k.valid ? `${k.title} (kategori)` : "";
  };
  const klaim = {
    du: { code: claim.primaryDxCode, desc: deskDx(claim.primaryDxCode, claim.primaryDxDesc) },
    sek: (claim.secondaryDx || []).filter((d) => (d.code || "").trim()).map((d) => ({ code: d.code.trim(), desc: deskDx(d.code, d.desc) })),
    pr: (claim.procedures || []).filter((p) => (p.code || "").trim()).map((p) => ({ code: p.code.trim(), desc: deskPr(p.code, p.desc) })),
    dihapus: [],
  };
  // usulan setelah saran AI (tanpa mengubah klaim)
  let usulan = null;
  const sa = claim.aiStatus === "done" && claim.aiAnalysis ? bacaSaranKodingAI(claim.aiAnalysis) : null;
  if (sa) {
    const du = sa.diagnosisUtama || {};
    const gantiDU = !!du.kodeSaran && up(du.kodeSaran) !== up(claim.primaryDxCode);
    const hapus = new Set((sa.diagnosisSekunderHapus || []).filter((d) => d && d.kode).map((d) => up(d.kode)));
    const prHapus = new Set((sa.prosedurHapus || []).filter((p) => p && p.kode).map((p) => up(p.kode)));
    const duBaru = gantiDU ? { code: String(du.kodeSaran).trim(), desc: deskDx(du.kodeSaran, du.deskripsi), baru: true } : klaim.du;
    let sek = klaim.sek.filter((d) => !hapus.has(up(d.code)) && up(d.code) !== up(duBaru.code));
    (sa.diagnosisSekunderTambah || []).filter((d) => d && d.kode).forEach((d) => { if (!sek.some((x) => up(x.code) === up(d.kode)) && up(d.kode) !== up(duBaru.code)) sek.push({ code: String(d.kode).trim(), desc: deskDx(d.kode, d.deskripsi), baru: true }); });
    let pr = klaim.pr.filter((p) => !prHapus.has(up(p.code)));
    (sa.prosedurTambah || []).filter((p) => p && p.kode).forEach((p) => { if (!pr.some((x) => up(x.code) === up(p.kode))) pr.push({ code: String(p.kode).trim(), desc: deskPr(p.kode, p.deskripsi), baru: true }); });
    const dihapus = [...(gantiDU ? [{ code: klaim.du.code, ket: "diagnosis utama lama" }] : []),
      ...klaim.sek.filter((d) => hapus.has(up(d.code))).map((d) => ({ code: d.code, ket: "dx sekunder" })),
      ...klaim.pr.filter((p) => prHapus.has(up(p.code))).map((p) => ({ code: p.code, ket: "tindakan" }))];
    if (gantiDU || dihapus.length || sek.some((d) => d.baru) || pr.some((p) => p.baru)) usulan = { du: duBaru, sek, pr, dihapus };
  }
  const v = versi === "usulan" && usulan ? usulan : klaim;
  const salin = (teks, label) => {
    const ok = () => { setTersalin(label); setTimeout(() => setTersalin(""), 2000); };
    try { navigator.clipboard.writeText(teks).then(ok, () => window.prompt("Salin teks berikut:", teks)); } catch (e) { window.prompt("Salin teks berikut:", teks); }
  };
  const Kode = ({ code, baru }) => (
    <button type="button" onClick={() => salin(code, code)} title="Klik untuk menyalin kode"
      className={`font-mono font-semibold px-1.5 py-0.5 rounded border text-xs ${baru ? "bg-[#E4F3EC] border-[#BFE3D1] text-[#1E6B4C]" : "bg-white border-[#D7DEE3] text-[#0F2A3D]"} hover:border-[#0B7285]`}>
      {tersalin === code ? "Tersalin ✓" : code}
    </button>
  );
  const Baris = ({ no, it }) => (
    <li className="flex items-start gap-2 text-xs">
      {no != null && <span className="text-[#94A3AC] w-4 text-right shrink-0 pt-0.5">{no}.</span>}
      <Kode code={it.code} baru={it.baru} />
      <span className="text-[#334652] pt-0.5">{it.desc || <i className="text-[#94A3AC]">deskripsi tidak ada di referensi — cek di e-Klaim</i>}{it.baru && <b className="text-[#1E6B4C]"> · saran AI</b>}</span>
    </li>
  );
  const teksLembar = () => [
    `Diagnosis utama: ${v.du.code || "-"}${v.du.desc ? " - " + v.du.desc : ""}`,
    "Diagnosis sekunder:", ...(v.sek.length ? v.sek.map((d, i) => `${i + 1}. ${d.code}${d.desc ? " - " + d.desc : ""}`) : ["-"]),
    "Tindakan (ICD-9-CM):", ...(v.pr.length ? v.pr.map((p, i) => `${i + 1}. ${p.code}${p.desc ? " - " + p.desc : ""}`) : ["-"]),
  ].join("\n");
  const kodeDx = [v.du.code, ...v.sek.map((d) => d.code)].filter(Boolean).join("#");
  const kodePr = v.pr.map((p) => p.code).join("#");
  const tombol = "text-[11px] font-semibold px-2 py-1 rounded border border-[#D7DEE3] bg-white text-[#334652] hover:bg-[#F4F9FA]";
  return (
    <div className="border border-[#CFE4E8] rounded-lg overflow-hidden">
      <div className="bg-[#0B7285] text-white text-sm font-semibold px-3 py-2 flex flex-wrap items-center gap-2">
        <span>Lembar Input Koding e-Klaim</span>
        <span className="font-normal text-xs text-[#CFE9EE]">— klik kode untuk menyalin</span>
        {usulan && (
          <span className="ml-auto flex gap-1">
            <button type="button" onClick={() => setVersi("klaim")} className={`text-[11px] px-2 py-0.5 rounded ${versi === "klaim" ? "bg-white text-[#0B7285]" : "bg-white/15"}`}>Data klaim</button>
            <button type="button" onClick={() => setVersi("usulan")} className={`text-[11px] px-2 py-0.5 rounded ${versi === "usulan" ? "bg-white text-[#0B7285]" : "bg-white/15"}`}>Usulan setelah saran AI</button>
          </span>
        )}
      </div>
      {versi === "usulan" && usulan && <p className="text-[11px] bg-[#FBF8F0] text-[#9A6300] px-3 py-1.5">Usulan ini BELUM diverifikasi — pastikan setiap kode baru didukung rekam medis & disetujui DPJP sebelum diinput ke e-Klaim.</p>}
      <div className="p-3 space-y-2.5">
        <div><p className="text-[11px] text-[#94A3AC] mb-1">Diagnosis utama (ICD-10)</p>
          {v.du.code ? <ul><Baris it={v.du} /></ul> : <p className="text-xs text-[#94A3AC]">belum diisi</p>}</div>
        <div><p className="text-[11px] text-[#94A3AC] mb-1">Diagnosis sekunder (ICD-10)</p>
          {v.sek.length ? <ul className="space-y-1">{v.sek.map((d, i) => <Baris key={d.code + i} no={i + 1} it={d} />)}</ul> : <p className="text-xs text-[#94A3AC]">tidak ada</p>}</div>
        <div><p className="text-[11px] text-[#94A3AC] mb-1">Tindakan / prosedur (ICD-9-CM)</p>
          {v.pr.length ? <ul className="space-y-1">{v.pr.map((p, i) => <Baris key={p.code + i} no={i + 1} it={p} />)}</ul> : <p className="text-xs text-[#94A3AC]">tidak ada</p>}</div>
        {v.dihapus && v.dihapus.length > 0 && <p className="text-[11px] text-[#B3261E]">Disarankan dihapus: {v.dihapus.map((d) => `${d.code} (${d.ket})`).join(", ")}</p>}
        {claim.inacbgCode && versi === "klaim" && <p className="text-[11px] text-[#5B6B76]">Hasil grouping tercatat: <b className="font-mono">{claim.inacbgCode}</b>{parseAngka(claim.tarifKlaim) ? ` · Rp${parseAngka(claim.tarifKlaim).toLocaleString("id-ID")}` : ""}</p>}
        <div className="flex flex-wrap gap-1.5 pt-1">
          <button type="button" className={tombol} onClick={() => salin(teksLembar(), "lembar")}>{tersalin === "lembar" ? "Tersalin ✓" : "Salin lembar koding"}</button>
          {kodeDx && <button type="button" className={tombol} onClick={() => salin(kodeDx, "dx")}>{tersalin === "dx" ? "Tersalin ✓" : `Salin semua diagnosis (${kodeDx.split("#").length})`}</button>}
          {kodePr && <button type="button" className={tombol} onClick={() => salin(kodePr, "pr")}>{tersalin === "pr" ? "Tersalin ✓" : `Salin semua tindakan (${kodePr.split("#").length})`}</button>}
        </div>
        <p className="text-[10px] text-[#94A3AC]">"Salin semua" memakai pemisah # (format bridging e-Klaim, mis. I61.9#R40.2). Deskripsi bertanda "(kategori)" = judul kategori 3 karakter ICD-10; deskripsi lengkap sesuai e-Klaim.</p>
      </div>
    </div>
  );
}

function DetailModal({ claim, allClaims, onClose, onReanalyze, onMerge, onConfirmSeparate, onUpdateClaim }) {
  const loading = claim.aiStatus === "loading";
  const [editing, setEditing] = useState(false);
  const [editForm, setEditForm] = useState(null);

  const startEdit = () => {
    const s = claim.sep || {};
    setEditForm({
      inacbgCode: claim.inacbgCode || "", kelasRawat: claim.kelasRawat || "3",
      severityLevel: claim.severityLevel || "I", tarifKlaim: claim.tarifKlaim || "",
      sepNoSep: s.noSep || "", sepTglSep: s.tglSep || "", sepNoKartu: s.noKartu || "",
      sepDokter: s.dokter || "", sepSubSpesialis: s.subSpesialis || "", sepFaskesPerujuk: s.faskesPerujuk || "",
      sepDiagnosaAwal: s.diagnosaAwal || "", sepJenisKunjungan: s.jenisKunjungan || "", sepPoliPerujuk: s.poliPerujuk || "",
      sepKelasHak: s.kelasHak || "", sepPenjamin: s.penjamin || "", sepNoTelepon: s.noTelepon || "", sepCatatan: s.catatan || "",
      dariIGD: !!claim.dariIGD, igdKriteriaGawatDarurat: !!claim.igdKriteriaGawatDarurat, igdDirujuk: !!claim.igdDirujuk, igdLosJam: claim.igdLosJam || "",
      _tarifOtomatis: !parseAngka(claim.tarifKlaim) || parseAngka(claim.tarifKlaim) === tarifResmiUntuk(claim.inacbgCode, claim.kelasRawat),
    });
    // kode sudah ada tapi tarif masih kosong/0 → langsung isi dari tabel tarif RS
    const tAwal = tarifResmiUntuk(claim.inacbgCode, claim.kelasRawat);
    if (tAwal && !parseAngka(claim.tarifKlaim)) setEditForm((f) => ({ ...f, tarifKlaim: String(tAwal), _tarifOtomatis: true }));
    setEditing(true);
  };
  // Kode/kelas berubah → tarif klaim ikut tabel tarif RS, kecuali sudah diketik manual
  const ubahKodeKelas = (ubah) => {
    setEditForm((f) => {
      const baru = { ...f, ...ubah };
      const t = tarifResmiUntuk(baru.inacbgCode, baru.kelasRawat);
      if (t && (f._tarifOtomatis || !parseAngka(f.tarifKlaim))) { baru.tarifKlaim = String(t); baru._tarifOtomatis = true; }
      return baru;
    });
  };
  const saveEdit = () => {
    const { sepNoSep, sepTglSep, sepNoKartu, sepDokter, sepSubSpesialis, sepFaskesPerujuk,
      sepDiagnosaAwal, sepJenisKunjungan, sepPoliPerujuk, sepKelasHak, sepPenjamin, sepNoTelepon, sepCatatan,
      _tarifOtomatis, ...rest } = editForm;
    if (!rest.dariIGD) { rest.igdKriteriaGawatDarurat = false; rest.igdDirujuk = false; rest.igdLosJam = ""; }
    const sep = {
      noSep: sepNoSep.trim(), tglSep: sepTglSep.trim(), noKartu: sepNoKartu.trim(), dokter: sepDokter.trim(),
      subSpesialis: sepSubSpesialis.trim(), faskesPerujuk: sepFaskesPerujuk.trim(), diagnosaAwal: sepDiagnosaAwal.trim(),
      jenisKunjungan: sepJenisKunjungan.trim(), poliPerujuk: sepPoliPerujuk.trim(), kelasHak: sepKelasHak.trim(),
      penjamin: sepPenjamin.trim(), noTelepon: sepNoTelepon.trim(), catatan: sepCatatan.trim(),
    };
    const hasSepData = Object.values(sep).some((v) => v !== "");
    onUpdateClaim(claim.id, { ...rest, sep: hasSepData ? sep : null });
    setEditing(false);
  };

  return (
    <div className="fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center z-50 p-0 sm:p-4" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} className="bg-white w-full sm:max-w-2xl sm:rounded-2xl rounded-t-2xl max-h-[90vh] overflow-y-auto">
        <div className="sticky top-0 z-10 bg-white border-b border-[#E2E8ED] px-5 py-4 flex items-center justify-between shadow-sm">
          <div>
            <p className="text-xs text-[#94A3AC] font-mono">No. RM {claim.noRM}{claim.dpjp ? ` · ${claim.dpjp}` : ""}</p>
            <h3 style={{ fontFamily: "'Space Grotesk',sans-serif" }} className="text-base font-semibold text-[#0F2A3D]">{claim.namaPasien || "Klaim"} — {claim.inacbgCode || "(kode INA-CBG belum diisi)"}</h3>
          </div>
          <div className="flex items-center gap-1">
            {!editing && <button onClick={startEdit} title="Lengkapi/ubah kode INA-CBG, kelas rawat, severity, tarif" className="p-1.5 rounded-lg hover:bg-[#F0F3F5] text-[#5B6B76]"><Pencil size={18} /></button>}
            <button onClick={() => printClaims([claim])} title="Cetak berkas" className="p-1.5 rounded-lg hover:bg-[#F0F3F5] text-[#5B6B76]"><Printer size={18} /></button>
            <button onClick={onClose} className="p-1.5 rounded-lg hover:bg-[#F0F3F5]"><X size={18} /></button>
          </div>
        </div>

        {editing && editForm && (
          <div className="p-5 border-b border-[#E2E8ED] bg-[#F7FAFB] space-y-3">
            <p className="text-sm font-semibold text-[#0F2A3D]">Lengkapi / ubah data klaim</p>
            <p className="text-xs text-[#5B6B76]">Berguna terutama untuk mengisi kode INA-CBG setelah proses grouping e-Klaim selesai.</p>
            <div className="grid grid-cols-2 gap-3">
              <label className="block"><span className="block text-xs text-[#5B6B76] mb-1">Kode INA-CBG</span>
                <input value={editForm.inacbgCode} onChange={(e) => ubahKodeKelas({ inacbgCode: e.target.value.toUpperCase() })} placeholder="mis. A-4-10-III" className="w-full rounded-lg border border-[#D7DEE3] px-2.5 py-1.5 text-sm font-mono" /></label>
              <label className="block"><span className="block text-xs text-[#5B6B76] mb-1">Kelas Rawat</span>
                <select value={editForm.kelasRawat} onChange={(e) => ubahKodeKelas({ kelasRawat: e.target.value })} className="w-full rounded-lg border border-[#D7DEE3] px-2.5 py-1.5 text-sm bg-white">
                  <option value="3">Kelas 3</option><option value="2">Kelas 2</option><option value="1">Kelas 1</option></select></label>
              <label className="block"><span className="block text-xs text-[#5B6B76] mb-1">Severity</span>
                <select value={editForm.severityLevel} onChange={(e) => setEditForm({ ...editForm, severityLevel: e.target.value })} className="w-full rounded-lg border border-[#D7DEE3] px-2.5 py-1.5 text-sm bg-white">
                  <option value="I">I</option><option value="II">II</option><option value="III">III</option></select></label>
              <label className="block"><span className="block text-xs text-[#5B6B76] mb-1">Tarif Klaim (Rp)</span>
                <input type="number" value={editForm.tarifKlaim} onChange={(e) => setEditForm({ ...editForm, tarifKlaim: e.target.value, _tarifOtomatis: false })} className="w-full rounded-lg border border-[#D7DEE3] px-2.5 py-1.5 text-sm" />
                <InfoTarifOtomatis kode={editForm.inacbgCode} kelas={editForm.kelasRawat} tarif={editForm.tarifKlaim} otomatis={editForm._tarifOtomatis}
                  onIsi={(t) => setEditForm({ ...editForm, tarifKlaim: String(t), _tarifOtomatis: true })} /></label>
            </div>

            <div className="border-t border-[#E2E8ED] pt-3">
              <p className="text-sm font-semibold text-[#0F2A3D]">Data IGD</p>
              <p className="text-xs text-[#5B6B76] mb-2">Dicek terhadap Matriks Penjaminan Klaim IGD (BA Kemenkes-BPJS No. 3760/2024).</p>
              <label className="flex items-start gap-2 mb-2 cursor-pointer">
                <input type="checkbox" checked={editForm.dariIGD} onChange={(e) => setEditForm({ ...editForm, dariIGD: e.target.checked })} className="mt-0.5 w-4 h-4 accent-[#0B7285]" />
                <span className="text-sm text-[#334652]">Klaim ini berasal dari pelayanan IGD.</span>
              </label>
              {editForm.dariIGD && (
                <div className="ml-6 space-y-2">
                  <label className="flex items-start gap-2 cursor-pointer">
                    <input type="checkbox" checked={editForm.igdKriteriaGawatDarurat} onChange={(e) => setEditForm({ ...editForm, igdKriteriaGawatDarurat: e.target.checked })} className="mt-0.5 w-4 h-4 accent-[#0B7285]" />
                    <span className="text-sm text-[#334652]">Memenuhi salah satu kriteria Gawat Darurat (ancam nyawa, gangguan jalan napas/napas/sirkulasi, penurunan kesadaran, gangguan hemodinamik, atau perlu tindakan segera).</span>
                  </label>
                  {!editForm.igdKriteriaGawatDarurat && (() => {
                    const bukti = deteksiGawatDarurat(claim);
                    return bukti.length > 0 ? <p className="text-xs text-[#1E6B4C] bg-[#E4F3EC] rounded px-2 py-1">Terdeteksi di dokumen klaim: {bukti.join("; ")} — centang kotak di atas bila sesuai.</p> : null;
                  })()}
                  <label className="flex items-start gap-2 cursor-pointer">
                    <input type="checkbox" checked={editForm.igdDirujuk} onChange={(e) => setEditForm({ ...editForm, igdDirujuk: e.target.checked })} className="mt-0.5 w-4 h-4 accent-[#0B7285]" />
                    <span className="text-sm text-[#334652]">Pasien dirujuk ke faskes lain.</span>
                  </label>
                  <label className="block max-w-[200px]"><span className="block text-xs text-[#5B6B76] mb-1">Lama pelayanan di IGD (jam)</span>
                    <input type="number" value={editForm.igdLosJam} onChange={(e) => setEditForm({ ...editForm, igdLosJam: e.target.value })} className="w-full rounded-lg border border-[#D7DEE3] px-2.5 py-1.5 text-sm" /></label>
                </div>
              )}
            </div>

            <div className="border-t border-[#E2E8ED] pt-3">
              <p className="text-sm font-semibold text-[#0F2A3D]">Data SEP</p>
              <p className="text-xs text-[#5B6B76] mb-2">Lengkapi field yang tercetak di SEP tapi belum tersimpan/salah terbaca — akan langsung dipakai ulang untuk cek kelengkapan SEP.</p>
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                {[
                  ["sepNoSep", "No. SEP"], ["sepTglSep", "Tgl. SEP"], ["sepNoKartu", "No. Kartu BPJS"],
                  ["sepDokter", "Dokter (DPJP)"], ["sepSubSpesialis", "Sub/Spesialis"], ["sepFaskesPerujuk", "Faskes Perujuk"],
                  ["sepDiagnosaAwal", "Diagnosa Awal"], ["sepJenisKunjungan", "Jenis Kunjungan"], ["sepPoliPerujuk", "Poli Perujuk"],
                  ["sepKelasHak", "Kelas Hak"], ["sepPenjamin", "Penjamin"], ["sepNoTelepon", "No. Telepon Peserta"],
                ].map(([key, label]) => (
                  <label key={key} className="block">
                    <span className="block text-xs text-[#5B6B76] mb-1">{label}</span>
                    <input value={editForm[key]} onChange={(e) => setEditForm({ ...editForm, [key]: e.target.value })} className="w-full rounded-lg border border-[#D7DEE3] px-2.5 py-1.5 text-sm" />
                  </label>
                ))}
                <label className="block col-span-2 sm:col-span-3">
                  <span className="block text-xs text-[#5B6B76] mb-1">Catatan</span>
                  <input value={editForm.sepCatatan} onChange={(e) => setEditForm({ ...editForm, sepCatatan: e.target.value })} className="w-full rounded-lg border border-[#D7DEE3] px-2.5 py-1.5 text-sm" />
                </label>
              </div>
            </div>

            <div className="flex gap-2 pt-1">
              <button onClick={saveEdit} className="px-4 py-2 rounded-lg bg-[#0B7285] text-white text-xs font-semibold">Simpan & Skrining Ulang</button>
              <button onClick={() => setEditing(false)} className="px-4 py-2 rounded-lg border border-[#D7DEE3] text-xs font-medium text-[#334652]">Batal</button>
            </div>
          </div>
        )}

        <div className="p-5 space-y-5">
          <div className="flex items-center gap-3">
            <RiskBadge level={claim.riskLevel} />
            <span className="text-sm text-[#5B6B76]">Skor risiko: <b className="text-[#0F2A3D]">{claim.score}</b></span>
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 text-sm">
            <div><p className="text-xs text-[#94A3AC]">Diagnosis utama</p><p className="font-mono">{claim.primaryDxCode}</p></div>
            <div><p className="text-xs text-[#94A3AC]">Severity</p><p>{claim.severityLevel}</p></div>
            <div><p className="text-xs text-[#94A3AC]">Jenis kasus</p><p>{claim.jenisKasus}</p></div>
            <div><p className="text-xs text-[#94A3AC]">Jenis perawatan</p><p>{claim.jenisRawat || "Rawat Inap"}</p></div>
            <div><p className="text-xs text-[#94A3AC]">Kelas rawat</p><p>Kelas {claim.kelasRawat}</p></div>
            <div><p className="text-xs text-[#94A3AC]">LOS</p><p>{claim.los} hari</p></div>
            <div><p className="text-xs text-[#94A3AC]">Tarif klaim</p><p>Rp{parseAngka(claim.tarifKlaim).toLocaleString("id-ID")}</p></div>
            <div><p className="text-xs text-[#94A3AC]">Bukti penunjang</p><p>{claim.buktiPenunjang ? "Ada" : "Belum ditandai"}</p></div>
            <div><p className="text-xs text-[#94A3AC]">Special CMG</p><p>{claim.specialCMG ? claim.specialCMGKategori : "Tidak"}</p></div>
          </div>

          <LembarKodingEklaim claim={claim} />

          <div>
            <p className="text-sm font-semibold text-[#0F2A3D] mb-3">Tahapan Verifikasi — pola pikir digital Vedika BPJS</p>
            <div className="space-y-3">
              {Object.keys(STAGE_LABELS).map((stageKey) => {
                const stageFlags = claim.flags.filter((f) => f.stage === stageKey);
                const status = claim.stages ? claim.stages[stageKey] : (stageFlags.length > 0 ? "perlu_dicek" : "lolos");
                return (
                  <div key={stageKey} className={`rounded-lg border px-3 py-2.5 ${status === "lolos" ? "bg-[#E4F3EC] border-[#CDE8DA]" : "bg-[#FBF8F0] border-[#F0E6C8]"}`}>
                    <div className="flex items-center gap-2">
                      {status === "lolos" ? <CheckCircle2 size={15} className="text-[#1E6B4C] shrink-0" /> : <AlertTriangle size={15} className="text-[#9A6300] shrink-0" />}
                      <p className="text-sm font-medium text-[#0F2A3D]">{STAGE_LABELS[stageKey]}</p>
                      <span className={`text-xs ml-auto ${status === "lolos" ? "text-[#1E6B4C]" : "text-[#9A6300]"}`}>{status === "lolos" ? "Lolos" : `${stageFlags.length} perlu ditelaah`}</span>
                    </div>
                    {stageFlags.length > 0 && (
                      <ul className="mt-2 space-y-1.5 pl-6">
                        {stageFlags.map((f, i) => (
                          <li key={f.id + i} className="text-xs">
                            <span className="font-medium text-[#0F2A3D]">{f.label}</span>
                            <span className="text-[#5B6B76]"> — {f.detail}</span>
                          </li>
                        ))}
                      </ul>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          {claim.dataIntiLengkap === false && (
            <div className="bg-[#F0F3F5] border border-[#D7DEE3] rounded-lg p-3.5">
              <p className="text-sm font-semibold text-[#0F2A3D] mb-1 flex items-center gap-1.5"><ShieldQuestion size={15} className="text-[#5B6B76]" /> Skrining Belum Dapat Menilai Sepenuhnya</p>
              <p className="text-xs text-[#5B6B76]">
                Klaim ini belum punya {!claim.inacbgCode ? "kode INA-CBG" : ""}{!claim.inacbgCode && !(parseAngka(claim.tarifKlaim) > 0) ? " dan " : ""}{!(parseAngka(claim.tarifKlaim) > 0) ? "nilai tarif" : ""}, sehingga beberapa aturan skrining <b>tidak bisa dijalankan</b> — antara lain kesesuaian tarif terhadap tarif resmi Permenkes, konsistensi severity dengan kode, dan kewajaran tarif dibanding klaim sejenis.
              </p>
              <p className="text-xs text-[#5B6B76] mt-2">
                Karena itu status di atas ditandai <b>"Belum Lengkap"</b>, <b>bukan "Rendah"</b> — hasil skrining pada kondisi ini belum bisa dijadikan dasar bahwa klaim aman diajukan. Lengkapi dulu lewat tombol Edit (✏️) di atas, lalu skrining akan dihitung ulang otomatis.
              </p>
            </div>
          )}

          {!claim.inacbgCode && claim.primaryDxDesc && (() => {
            const candidates = findCandidateInacbgCodes(claim.primaryDxDesc, 4);
            if (candidates.length === 0) return null;
            return (
              <div className="bg-[#FBF8F0] border border-[#F0E6C8] rounded-lg p-3.5">
                <p className="text-sm font-semibold text-[#0F2A3D] mb-1">Kandidat Kode INA-CBG (perkiraan awal)</p>
                <p className="text-xs text-[#5B6B76] mb-3">Berdasarkan kemiripan kata kunci diagnosis dgn tabel tarif resmi Permenkes No. 3/2023 — BUKAN hasil grouper e-Klaim, cuma bahan pertimbangan awal. Tarif ditampilkan sesuai Kelas Rawat {claim.kelasRawat || "3"}.</p>
                <div className="space-y-1.5">
                  {candidates.map((c) => {
                    const tarif = c[2] === "RJ" ? c[3] : { "3": c[3], "2": c[4], "1": c[5] }[claim.kelasRawat || "3"];
                    return (
                      <div key={c[0]} className="flex items-center justify-between gap-2 text-xs bg-white rounded-lg px-2.5 py-2 border border-[#F0E6C8]">
                        <div className="min-w-0">
                          <span className="font-mono font-semibold text-[#0F2A3D]">{c[0]}</span>
                          <span className="text-[#5B6B76]"> — {c[1]}</span>
                        </div>
                        <span className="font-medium text-[#0F2A3D] whitespace-nowrap">{tarif ? `Rp${Number(tarif).toLocaleString("id-ID")}` : "-"}</span>
                      </div>
                    );
                  })}
                </div>
                <p className="text-xs text-[#0B7285] mt-3 flex items-start gap-1.5"><Sparkles size={13} className="mt-0.5 shrink-0" /> Kartu ini <b>gratis</b> (tanpa panggilan AI). Kalau salah satu kandidat di atas sudah cukup jelas & meyakinkan, tidak perlu klik "Jalankan Analisis" segala — langsung isi manual saja lewat tombol Edit (✏️) di atas.</p>
              </div>
            );
          })()}

          {(() => {
            const readmitFlag = claim.flags.find((f) => (f.id === "readmission" || f.id === "readmission30") && f.relatedClaimId);
            if (!readmitFlag) return null;
            const related = (allClaims || []).find((c) => c.id === readmitFlag.relatedClaimId);
            return (
              <div className="bg-[#F4F9FA] border border-[#CFE4E8] rounded-lg p-3.5">
                <p className="text-sm font-semibold text-[#0F2A3D] mb-1">Episode Terkait — Perlu Ditentukan</p>
                <p className="text-xs text-[#5B6B76] mb-3">Klaim ini terkait dengan episode No. RM {related ? related.noRM : "?"} ({related ? related.tglMasuk : "-"} s.d. {related ? related.tglKeluar : "-"}, jarak {readmitFlag.relatedClaimGap} hari). Menurut BA Kemenkes-BPJS No. 3760/2024: kalau pasien <b>dikembalikan ke DPJP perujuk</b> (Konsul Internal), ini seharusnya 1 episode — sebaiknya digabung. Kalau <b>tidak dikembalikan</b> (Rujukan Internal beda hari), ini sah sebagai 2 episode terpisah.</p>
                <div className="flex flex-wrap gap-2">
                  <button onClick={() => { if (related) onMerge(related.id, claim.id); onClose(); }} disabled={!related}
                    className="text-xs font-medium px-3 py-1.5 rounded-lg bg-[#0B7285] text-white disabled:opacity-40">Konsul Internal — Gabungkan Episode</button>
                  <button onClick={() => { if (related) onConfirmSeparate(claim.id, related.id); }} disabled={!related}
                    className="text-xs font-medium px-3 py-1.5 rounded-lg bg-white border border-[#D7DEE3] text-[#334652] disabled:opacity-40">Rujukan Internal — Sah Terpisah</button>
                </div>
              </div>
            );
          })()}

          {claim.notes && claim.notes.length > 0 && (
            <div>
              <p className="text-sm font-semibold text-[#0F2A3D] mb-2">Catatan validitas kode (non-skor)</p>
              <ul className="space-y-2">
                {claim.notes.map((n, i) => (
                  <li key={n.id + i} className="flex gap-2.5 bg-[#F4F9FA] border border-[#CFE4E8] rounded-lg px-3 py-2.5">
                    <Info size={16} className="text-[#0B7285] mt-0.5 shrink-0" />
                    <div><p className="text-sm font-medium text-[#0F2A3D]">{n.label}</p><p className="text-xs text-[#5B6B76] mt-0.5">{n.detail}</p></div>
                  </li>
                ))}
              </ul>
            </div>
          )}

          {claim.sep && (
            <div>
              <p className="text-sm font-semibold text-[#0F2A3D] mb-2">Kelengkapan SEP</p>
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                {Object.keys(SEP_FIELD_LABELS).map((f) => {
                  const val = claim.sep[f];
                  const filled = val && val.trim() !== "" && val.trim() !== "-";
                  return (
                    <div key={f} className={`flex items-center gap-1.5 text-xs px-2 py-1.5 rounded-lg border ${filled ? "bg-[#E4F3EC] border-[#CDE8DA] text-[#1E6B4C]" : "bg-[#FCE9E7] border-[#F5D2CE] text-[#B3261E]"}`}>
                      {filled ? <CheckCircle2 size={13} className="shrink-0" /> : <X size={13} className="shrink-0" />}
                      <span className="truncate" title={val || "(kosong)"}>{SEP_FIELD_LABELS[f]}</span>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          <div className="border-t border-[#E2E8ED] pt-4">
            <div className="flex items-center justify-between mb-2">
              <p className="text-sm font-semibold text-[#0F2A3D] flex items-center gap-1.5"><Sparkles size={15} className="text-[#0B7285]" /> Opini AI — bagian dari alur skrining</p>
              <button onClick={() => onReanalyze(claim.id)} disabled={loading} className="text-xs font-medium text-[#0B7285] hover:text-[#095e6b] inline-flex items-center gap-1 disabled:opacity-50">
                {loading ? <Loader2 size={13} className="animate-spin" /> : <Sparkles size={13} />} {loading ? "Menganalisis..." : claim.aiStatus === "done" ? "Analisis ulang" : "Jalankan analisis"}
              </button>
            </div>
            {claim.aiStatus === "error" && (
              <div className="text-xs text-[#B3261E] bg-[#FCE9E7] rounded-lg p-2.5">
                <p className="font-medium">Gagal menghubungi layanan AI:</p>
                <p className="mt-1 font-mono break-words">{claim.aiAnalysis || "Kesalahan tidak diketahui"}</p>
              </div>
            )}
            {claim.aiStatus === "done" && claim.aiAnalysis && <p className="text-sm text-[#334652] bg-[#F4F9FA] rounded-lg p-3 whitespace-pre-wrap">{teksOpiniTanpaBlok(claim.aiAnalysis)}</p>}
            {claim.aiStatus === "done" && claim.aiAnalysis && <KodeResmiDisebutAI teks={teksOpiniTanpaBlok(claim.aiAnalysis)} kelas={claim.kelasRawat} />}
            {claim.aiStatus === "done" && claim.aiAnalysis && <PanelSaranKoding claim={claim} onUpdateClaim={onUpdateClaim} />}
            <PanelInkonsistensi claim={claim} onUpdateClaim={onUpdateClaim} />
            {claim.aiStatus === "idle" && !loading && (
              <p className="text-xs text-[#94A3AC] italic">
                {claim.riskLevel === "Rendah"
                  ? "Klaim risiko Rendah (rawat jalan, atau rawat inap severity I bertarif < Rp5 jt) tidak dianalisis otomatis demi hemat biaya API — klik \"Jalankan analisis\" bila tetap ingin ditinjau AI."
                  : "Menunggu giliran dianalisis otomatis oleh AI (klaim risiko Sedang/Tinggi/Belum Lengkap diproses otomatis sebagai bagian dari skrining)."}
              </p>
            )}
          </div>

          <div className="border-t border-[#E2E8ED] pt-4 pb-1">
            <button onClick={onClose} className="w-full inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-[#F0F3F5] text-[#334652] text-sm font-semibold hover:bg-[#E2E8ED]">
              <X size={16} /> Tutup & Kembali ke Dashboard
            </button>
            <p className="text-center text-xs text-[#94A3AC] mt-2">Tips: klik area gelap di luar kotak ini juga menutup jendela ini.</p>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ----------------------------------------------------------------------
   DASHBOARD
---------------------------------------------------------------------- */
function Dashboard({ claims, onSelect, onDelete, onDeleteAll }) {
  const [filter, setFilter] = useState("Semua");
  const [query, setQuery] = useState("");
  const [bukaRekap, setBukaRekap] = useState(false);
  const [konfirmasiHapusSemua, setKonfirmasiHapusSemua] = useState(false);

  const handleHapusSemua = () => {
    if (!konfirmasiHapusSemua) { setKonfirmasiHapusSemua(true); return; }
    onDeleteAll();
    setKonfirmasiHapusSemua(false);
  };

  const counts = useMemo(() => ({
    Tinggi: claims.filter((c) => c.riskLevel === "Tinggi").length,
    Sedang: claims.filter((c) => c.riskLevel === "Sedang").length,
    "Belum Lengkap": claims.filter((c) => c.riskLevel === "Belum Lengkap").length,
    Rendah: claims.filter((c) => c.riskLevel === "Rendah").length,
  }), [claims]);

  const filtered = useMemo(() => {
    let list = [...claims].sort((a, b) => b.score - a.score);
    if (filter !== "Semua") list = list.filter((c) => c.riskLevel === filter);
    if (query.trim()) {
      const q = query.trim().toLowerCase();
      list = list.filter((c) => c.noRM.toLowerCase().includes(q) || (c.namaPasien || "").toLowerCase().includes(q) ||
        c.inacbgCode.toLowerCase().includes(q) || (c.dpjp || "").toLowerCase().includes(q));
    }
    return list;
  }, [claims, filter, query]);

  const exportFlagged = () => {
    const rows = claims.filter((c) => c.riskLevel !== "Rendah").map((c) => ({
      no_rm: c.noRM, nama_pasien: c.namaPasien, dpjp: c.dpjp, kode_inacbg: c.inacbgCode,
      severity: c.severityLevel, los: c.los, tarif_klaim: c.tarifKlaim,
      skor_risiko: c.score, level_risiko: c.riskLevel, penanda: c.flags.map((f) => f.label).join(" | "),
      opini_ai: c.aiStatus === "done" ? c.aiAnalysis : "",
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Klaim Perlu Review");
    XLSX.writeFile(wb, "klaim_perlu_review_inacbg.xlsx");
  };

  const gradingLabel = (lvl) => (lvl === "Tinggi" ? "Merah (Tinggi)" : lvl === "Sedang" ? "Kuning (Sedang)" : lvl === "Belum Lengkap" ? "Abu (Belum Dapat Dinilai)" : "Hijau (Rendah)");

  const exportSimutu = () => {
    const today = new Date().toISOString().slice(0, 10);
    const rows = claims.filter((c) => c.riskLevel !== "Rendah").map((c) => ({
      tanggal_lapor: today,
      unit_instalasi: "Rekam Medis / Verifikasi Klaim",
      kategori_insiden: "Potensi Ketidaksesuaian Klaim INA-CBG",
      sumber_data: `No. RM ${c.noRM} — Kode ${c.inacbgCode}${c.dpjp ? " — DPJP " + c.dpjp : ""}`,
      deskripsi_insiden: c.flags.map((f) => f.label).join("; "),
      opini_ai: c.aiStatus === "done" ? c.aiAnalysis : "",
      grading_risiko: gradingLabel(c.riskLevel),
      skor_risiko: c.score,
      akar_masalah: "",
      rekomendasi_pdsa: "",
      pic: "",
      status_tindak_lanjut: "Belum ditindaklanjuti",
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Insiden Klaim");
    XLSX.writeFile(wb, "ekspor_simutu_rs_insiden_klaim.xlsx");
  };

  if (claims.length === 0) {
    return (
      <div className="text-center py-16 text-[#94A3AC]">
        <ClipboardList size={36} className="mx-auto mb-3" />
        <p className="text-sm">Belum ada klaim yang diskrining. Tambahkan lewat "Input Manual" atau "Unggah Batch".</p>
      </div>
    );
  }

  return (
    <div className="space-y-5">
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
        {["Tinggi", "Sedang", "Belum Lengkap", "Rendah"].map((lvl) => (
          <div key={lvl} className="bg-white rounded-xl border border-[#E2E8ED] p-4">
            <RiskBadge level={lvl} />
            <p style={{ fontFamily: "'Space Grotesk',sans-serif" }} className="text-2xl font-bold text-[#0F2A3D] mt-2">{counts[lvl]}</p>
            <p className="text-xs text-[#94A3AC]">klaim</p>
          </div>
        ))}
      </div>

      <Section title="Daftar Klaim" subtitle={`${filtered.length} dari ${claims.length} klaim ditampilkan`}
        right={
          <div className="flex flex-wrap gap-3 items-center">

// Kode INA-CBG yang disebut di temuan tapi SUDAH TIDAK dipakai klaim (kode sudah diganti)
function kodeLamaDiTemuan(claim, it) {
  const kini = String(claim.inacbgCode || "").trim().toUpperCase();
  if (!kini) return [];
  const disebut = [...new Set(`${it.dokumenA} ${it.isiA} ${it.dokumenB} ${it.isiB} ${it.dampak}`.toUpperCase().match(/\b[A-Z]-\d-\d{2}-(?:0|III|II|I)\b/g) || [])];
  return disebut.length > 0 && !disebut.includes(kini) ? disebut : [];
}

// Panel inkonsistensi dokumen per klaim + pencatatan tindak lanjut (status & catatan)
function PanelInkonsistensi({ claim, onUpdateClaim }) {
  const daftar = daftarInkonsistensi(claim);
  if (daftar.length === 0) return null;
  const simpanTL = (key, patch) => {
    const tl = { ...(claim.tindakLanjutInkonsistensi || {}) };
    tl[key] = { ...(tl[key] || {}), ...patch, tgl: new Date().toISOString().slice(0, 10) };
    // Arsipkan juga temuannya supaya tetap ada walau opini AI dihapus/diulang
    onUpdateClaim(claim.id, { tindakLanjutInkonsistensi: tl, arsipInkonsistensi: gabungInkonsistensi(claim.arsipInkonsistensi, daftar.map(({ status, catatanTL, tglTL, ...it }) => it)) });
  };
  const warnaTingkat = { Tinggi: "bg-[#FCE9E7] text-[#B3261E]", Sedang: "bg-[#FBF8F0] text-[#9A6300]", Rendah: "bg-[#F0F3F5] text-[#5B6B76]" };
  return (
    <div className="mt-3 border border-[#F0E6C8] rounded-lg overflow-hidden">
      <div className="bg-[#9A6300] text-white text-sm font-semibold px-3 py-2">Inkonsistensi Dokumen ({daftar.length}) <span className="font-normal text-xs text-[#FBEFD5]">— bahan kajian RS, terekap di tab "Kajian Dokumen"</span></div>
      <ul className="divide-y divide-[#F0E6C8]">
        {daftar.map((it) => (
          <li key={it.key} className="p-3 text-sm space-y-1.5">
            <div className="flex flex-wrap items-center gap-1.5">
              <span className={`text-[11px] font-semibold px-2 py-0.5 rounded ${warnaTingkat[it.tingkat] || warnaTingkat.Sedang}`}>{it.tingkat}</span>
              <span className="text-xs font-medium text-[#0F2A3D]">{it.kategori}</span>
              <span className="text-xs text-[#94A3AC]">· unit terkait: {it.unitTerkait}</span>
            </div>
            <div className="grid sm:grid-cols-2 gap-1.5 text-xs">
              <p className="bg-[#F7F9FA] rounded px-2 py-1"><b>{it.dokumenA}</b>: {it.isiA}</p>
              <p className="bg-[#F7F9FA] rounded px-2 py-1"><b>{it.dokumenB}</b>: {it.isiB}</p>
            </div>
            {it.dampak && <p className="text-xs text-[#5B6B76]">{it.dampak}</p>}
            {(() => {
              const lama = kodeLamaDiTemuan(claim, it);
              if (!lama.length || it.status === "Sudah diperbaiki" || it.status === "Bukan masalah (sesuai)") return null;
              return (
                <div className="flex flex-wrap items-center gap-2 text-xs bg-[#E4F3EC] text-[#1E6B4C] rounded px-2 py-1.5">
                  <span>✓ Kode sudah diganti ({lama.join(", ")} → {claim.inacbgCode}) — kemungkinan sudah diperbaiki.</span>
                  {onUpdateClaim && <button type="button" onClick={() => simpanTL(it.key, { status: "Sudah diperbaiki", catatan: `Kode ${lama.join(", ")} diganti ${claim.inacbgCode}` })}
                    className="px-2 py-0.5 rounded bg-[#1E6B4C] text-white font-semibold">Tandai sudah diperbaiki</button>}
                </div>
              );
            })()}
            {onUpdateClaim && (
              <div className="flex flex-wrap gap-2 items-center">
                <select value={it.status} onChange={(e) => simpanTL(it.key, { status: e.target.value })} className="text-xs rounded border border-[#D7DEE3] px-2 py-1 bg-white">
                  {STATUS_TINDAK_LANJUT.map((st) => <option key={st} value={st}>{st}</option>)}
                </select>
                <input defaultValue={it.catatanTL} placeholder="Catatan tindak lanjut (opsional)…" onBlur={(e) => { if (e.target.value !== it.catatanTL) simpanTL(it.key, { catatan: e.target.value }); }}
                  className="flex-1 min-w-[160px] text-xs rounded border border-[#D7DEE3] px-2 py-1" />
                {it.tglTL && <span className="text-[11px] text-[#94A3AC]">diperbarui {it.tglTL}</span>}
              </div>
            )}
          </li>
        ))}
      </ul>
    </div>
  );
}

// Tab rekap lintas klaim — bahan kajian mutu dokumentasi RS
function KajianInkonsistensi({ claims, onSelect }) {
  const [fKategori, setFKategori] = useState("Semua");
  const [fUnit, setFUnit] = useState("Semua");
  const [fStatus, setFStatus] = useState("Semua");
  const [fTingkat, setFTingkat] = useState("Semua");
  const [cari, setCari] = useState("");

  const semua = useMemo(() => {
    const rows = [];
    claims.forEach((c) => daftarInkonsistensi(c).forEach((it) => rows.push({ ...it, claim: c })));
    return rows;
  }, [claims]);
  const sudahAI = claims.filter((c) => c.aiStatus === "done").length;
  const unitList = Array.from(new Set(semua.map((r) => r.unitTerkait))).sort();
  const kategoriList = Array.from(new Set([...KATEGORI_INKONSISTENSI, ...semua.map((r) => r.kategori)]));

  const tampil = semua.filter((r) =>
    (fKategori === "Semua" || r.kategori === fKategori) && (fUnit === "Semua" || r.unitTerkait === fUnit) &&
    (fStatus === "Semua" || r.status === fStatus) && (fTingkat === "Semua" || r.tingkat === fTingkat) &&
    (!cari.trim() || `${r.claim.noRM} ${r.claim.namaPasien} ${r.claim.dpjp} ${r.dokumenA} ${r.isiA} ${r.dokumenB} ${r.isiB}`.toLowerCase().indexOf(cari.trim().toLowerCase()) >= 0));

  const hitung = (fn) => {
    const m = {};
    tampil.forEach((r) => { const k = fn(r) || "-"; m[k] = (m[k] || 0) + 1; });
    return Object.entries(m).sort((a, b) => b[1] - a[1]);
  };
  const klaimTerdampak = new Set(tampil.map((r) => r.claim.id)).size;
  const belumTL = tampil.filter((r) => r.status === STATUS_TINDAK_LANJUT[0]).length;

  const ekspor = () => {
    const data = tampil.map((r) => ({
      "Tgl Masuk": r.claim.tglMasuk || "", "No. RM": r.claim.noRM || "", "Pasien": r.claim.namaPasien || "", "DPJP": r.claim.dpjp || "",
      "Jenis Rawat": r.claim.jenisRawat || "", "Kode INA-CBG": r.claim.inacbgCode || "", "Kategori": r.kategori, "Tingkat": r.tingkat,
      "Unit Terkait": r.unitTerkait, "Dokumen A": r.dokumenA, "Isi A": r.isiA, "Dokumen B": r.dokumenB, "Isi B": r.isiB,
      "Dampak": r.dampak, "Status Tindak Lanjut": r.status, "Catatan Tindak Lanjut": r.catatanTL, "Tgl Update": r.tglTL,

    const ringkas = [
      ...hitung((r) => r.kategori).map(([k, n]) => ({ Kelompok: "Kategori", Nilai: k, Jumlah: n })),
      ...hitung((r) => r.unitTerkait).map(([k, n]) => ({ Kelompok: "Unit terkait", Nilai: k, Jumlah: n })),
      ...hitung((r) => r.claim.dpjp).map(([k, n]) => ({ Kelompok: "DPJP", Nilai: k, Jumlah: n })),
      ...hitung((r) => r.status).map(([k, n]) => ({ Kelompok: "Status tindak lanjut", Nilai: k, Jumlah: n })),
    ];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ringkas.length ? ringkas : [{ Kelompok: "-", Nilai: "-", Jumlah: 0 }]), "Ringkasan");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data.length ? data : [{ Keterangan: "Belum ada temuan" }]), "Temuan");
    XLSX.writeFile(wb, `kajian_inkonsistensi_dokumen_${new Date().toISOString().slice(0, 10)}.xlsx`);
  };

  const Bar = ({ judul, isi }) => {
    const maks = Math.max(1, ...isi.map(([, n]) => n));
    return (
      <div className="bg-white border border-[#E2E8ED] rounded-xl p-4">
        <p className="text-sm font-semibold text-[#0F2A3D] mb-2">{judul}</p>

          <ul className="space-y-1.5">
            {isi.slice(0, 8).map(([k, n]) => (
              <li key={k} className="text-xs">
                <div className="flex justify-between gap-2"><span className="text-[#334652] truncate">{k}</span><span className="font-semibold text-[#0F2A3D]">{n}</span></div>
                <div className="h-1.5 bg-[#F0F3F5] rounded-full mt-0.5"><div className="h-full bg-[#9A6300] rounded-full" style={{ width: `${(n / maks) * 100}%` }} /></div>
              </li>
            ))}
          </ul>
        )}

  };
  const Pilih = ({ value, onChange, opsi, label }) => (

  return (

      </Section>

      <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">
        <Bar judul="Per kategori" isi={hitung((r) => r.kategori)} />
        <Bar judul="Per unit terkait" isi={hitung((r) => r.unitTerkait)} />
        <Bar judul="Per DPJP" isi={hitung((r) => r.claim.dpjp)} />

        {tampil.length === 0 ? (

function DpjpPattern({ claims }) {
  const stats = useMemo(() => {
    const groups = {};
    claims.forEach((c) => {
      const name = (c.dpjp || "").trim();
      if (!name) return;
      if (!groups[name]) groups[name] = [];
      groups[name].push(c);
    });
    const scores = claims.map((c) => c.score);
    const overallAvg = mean(scores);
    const overallSd = stddev(scores);
    return Object.entries(groups).map(([name, list]) => {
      const avg = mean(list.map((c) => c.score));
      const propSevIII = list.filter((c) => c.severityLevel === "III").length / list.length;
      const outlier = list.length >= 5 && overallSd > 0 && avg > overallAvg + 1.5 * overallSd;
      return { name, n: list.length, avg, propSevIII, outlier };
    }).sort((a, b) => b.avg - a.avg);
  }, [claims]);

  if (stats.length === 0) {
    return (
      <div className="text-center py-16 text-[#94A3AC]">
        <Users size={36} className="mx-auto mb-3" />
        <p className="text-sm">Belum ada data DPJP. Isi kolom DPJP saat input klaim agar pola per dokter dapat dianalisis.</p>
      </div>
    );
  }

  return (
    <Section title="Pola Skor Klaim per DPJP" subtitle="Statistik butuh minimal 5 klaim per DPJP untuk perbandingan yang bermakna">
      <div className="overflow-x-auto -mx-6 px-6">
        <table className="w-full text-sm">
          <thead><tr className="text-left text-xs text-[#5B6B76] border-b border-[#E2E8ED]">
            <th className="py-2 pr-4">DPJP</th><th className="py-2 pr-4">Jml Klaim</th><th className="py-2 pr-4">Rata-rata Skor</th>
            <th className="py-2 pr-4">% Severity III</th><th className="py-2 pr-4">Status</th>
          </tr></thead>
          <tbody>
            {stats.map((s) => (
              <tr key={s.name} className="border-b border-[#F0F3F5]">
                <td className="py-2.5 pr-4">{s.name}</td>
                <td className="py-2.5 pr-4">{s.n}</td>
                <td className="py-2.5 pr-4 font-semibold text-[#0F2A3D]">{s.avg.toFixed(1)}</td>
                <td className="py-2.5 pr-4">{(s.propSevIII * 100).toFixed(0)}%</td>
                <td className="py-2.5 pr-4">{s.outlier ? <RiskBadge level="Tinggi" /> : (s.n >= 5 ? <RiskBadge level="Rendah" /> : <span className="text-xs text-[#94A3AC]">Data belum cukup</span>)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <p className="text-xs text-[#94A3AC] mt-3">Status "Tinggi" berarti rata-rata skor klaim DPJP tersebut secara statistik jauh di atas rata-rata rumah sakit (&gt;1,5 simpangan baku), berdasarkan data yang sudah diinput — bukan tuduhan, melainkan sinyal untuk ditelaah tim koding/komite medik.</p>
    </Section>
  );
}
