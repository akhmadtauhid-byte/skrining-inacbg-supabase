// ============================================================================
// VALIDASI KLINIS DETERMINISTIK — menguji diagnosis yang dikode terhadap ANGKA
// yang tertulis di ringkasan klinis berkas (tanpa AI). Pola nyata pending: diagnosis
// "berat" (penentu severity) yang hasil penunjangnya justru tidak mendukung.
// ============================================================================
function ambilAngkaKlinis(teks, re) {
  const m = String(teks || "").match(re);
  if (!m) return null;
  const v = parseFloat(String(m[m.length - 1]).replace(",", "."));
  return isNaN(v) ? null : { nilai: v, kurangDari: /</.test(m[0]), kutipan: m[0].trim() };
}
const OBAT_ANTIDIABETIK_ORAL = /metformin|glikazid|gliclazid|glicasid|gliklazid|glimepirid|glibenklamid|glikuidon|acarbose|akarbose|pioglitazon|sitagliptin|vildagliptin|linagliptin/i;

function validasiKlinisDeterministik(claim) {
  const hasil = [];
  const dx = [claim.primaryDxCode, ...(claim.secondaryDx || []).map((d) => d.code)]
    .map((c) => String(c || "").trim().toUpperCase()).filter(Boolean);
  const ada = (re) => dx.filter((c) => re.test(c));
  const teks = String(claim.resumeMedis || "");
  const sepDxAwal = String((claim.sep && claim.sep.diagnosaAwal) || "").trim().toUpperCase();

  // 1. Infark miokard akut (I21/I22) tanpa kenaikan troponin
  const ima = ada(/^I2[12]/);
  if (ima.length) {
    const trop = ambilAngkaKlinis(teks, /troponin\s*[IT1]?\s*(?:hs)?\s*[:=]?\s*(<|&lt;)?\s*([0-9]+[.,]?[0-9]*)/i);
    if (trop && (trop.kurangDari || trop.nilai < 0.1)) {
      hasil.push({ id: "dxTidakDidukungLab", detail: `${ima.join("/")} (infark miokard akut) dikode, tetapi troponin tercatat "${trop.kutipan}" — di bawah nilai rujukan (<0,1 ng/mL). IMA/STEMI mensyaratkan kenaikan troponin + perubahan EKG iskemik (STEMI: ST elevasi). Bila EKG hanya sinus takikardia & troponin negatif, diagnosis ini sangat berisiko dikoreksi/dihapus verifikator — dan karena IMA biasanya penentu severity III, nilai klaim ikut turun.` });
    }
  }
  // 2. Ketoasidosis diabetik (E1x.1) tanpa bukti AGD / keton darah
  const kad = ada(/^E1[0-4]\.1/);
  if (kad.length && teks.length > 30 && !/AGD|analisa\s+gas|gas\s+darah|HCO3|bikarbonat|keton\s+darah|hidroksibutirat|anion\s+gap/i.test(teks)) {
    hasil.push({ id: "dxTidakDidukungLab", detail: `${kad.join("/")} (ketoasidosis diabetik) dikode, tetapi di berkas tidak ditemukan hasil AGD (pH/HCO3) maupun keton darah — hanya hiperglikemia/keton urin. Kriteria KAD: gula darah >250 mg/dL + asidosis metabolik (pH <7,3 dan/atau HCO3 <18) + ketonemia/ketonuria. Tanpa AGD, verifikator lazim mengoreksi ke diagnosis hiperglikemia tanpa ketoasidosis (severity bisa turun).` });
  }
  // 3. ARDS (J80) dengan PaO2/FiO2 > 300
  if (ada(/^J80/).length) {
    const pf = ambilAngkaKlinis(teks, /(?:PaO2\s*\/\s*FiO2|P\s*\/\s*F(?:\s*ratio)?)\s*[:=]?\s*([0-9]+[.,]?[0-9]*)/i);
    if (pf && pf.nilai > 300) {
      hasil.push({ id: "dxTidakDidukungLab", detail: `J80 (ARDS) dikode, tetapi tercatat "${pf.kutipan}" — kriteria Berlin mensyaratkan PaO2/FiO2 ≤300. Diagnosis berisiko dikoreksi; cek diagnosis yang lebih didukung data (mis. gagal napas J96.x).` });
    }
  }
  // 4. Tipe DM tidak konsisten: E10 (tipe 1) padahal riwayat/terapi menunjukkan tipe 2
  const e10 = ada(/^E10/);
  if (e10.length) {
    const bukti = [];
    if (/^E11/.test(sepDxAwal)) bukti.push(`diagnosa awal SEP ${sepDxAwal.slice(0, 40)}`);
    const tipe2 = teks.match(/DM\s*(?:tipe|type)?\s*(?:II|2)\b|diabetes\s+(?:melitus|mellitus)?\s*(?:tipe|type)\s*(?:II|2)\b/i);
    if (tipe2) bukti.push(`resume menulis "${tipe2[0]}"`);
    const oral = teks.match(OBAT_ANTIDIABETIK_ORAL);
    if (oral) bukti.push(`terapi antidiabetik oral (${oral[0]})`);
    if (bukti.length) {
      hasil.push({ id: "tipeDMTidakKonsisten", detail: `${e10.join("/")} = DM tipe 1 (insulin-dependent), tetapi ${bukti.join("; ")} menunjukkan DM tipe 2. Kode yang konsisten dengan riwayat pasien umumnya E11.x dengan digit ke-4 yang sama (mis. E10.1 → E11.1) — perbedaan tipe DM antar dokumen sering jadi alasan pending/koreksi.` });
    }
  }
  // 6. Syok (R57.x) padahal tekanan darah yang tercatat normal — alasan nyata Agustus
  //    2026: "DX R57.9 (X) TD DBN", "Hypovolaemic Shock (X) ... penurunan EF tdk ada".
  const syok = ada(/^R57/);
  if (syok.length) {
    const td = [];
    const reTD2 = /(?:\bTD\b|tekanan\s+darah|\bBP\b|tensi)\s*[:=]?\s*(\d{2,3})\s*\/\s*(\d{2,3})/gi;
    let m2;
    while ((m2 = reTD2.exec(teks)) !== null) td.push([Number(m2[1]), Number(m2[2])]);
    if (td.length >= 1 && Math.min(...td.map((t) => t[0])) >= 90) {
      const minTD = td.reduce((a, b) => (b[0] < a[0] ? b : a));
      hasil.push({ id: "dxTidakDidukungLab", detail: `${syok.join("/")} (syok) dikode, tetapi tekanan darah terendah yang tercatat ${minTD[0]}/${minTD[1]} mmHg (tidak ada sistolik <90). Verifikator lazim menghapus syok dengan alasan "TD DBN". Syok mensyaratkan hipotensi (sistolik <90 / MAP <65) yang butuh resusitasi cairan atau vasopresor, dan untuk syok kardiogenik bukti penurunan fungsi jantung (mis. EF turun pada ekokardiografi).` });
    }
  }
  // 5. Hipokalemia (E87.6) sebagai satu-satunya penaik severity — POLA PENDING NYATA
  //    RS INI (6 kasus, Apr-Jun 2026): "E87.6 hapus, kalium meningkat di hari yang
  //    sama", "hipokalemia bagian/akibat dari DU (diare/dehidrasi)", "EKG tidak memenuhi".
  const sekunder = (claim.secondaryDx || []).map((d) => String(d.code || "").trim().toUpperCase()).filter(Boolean);
  const sev = String(claim.severityLevel || "").toUpperCase();
  const primer = String(claim.primaryDxCode || "").trim().toUpperCase();
  if (sekunder.some((c) => /^E87\.6/.test(c)) && (sev === "II" || sev === "III") && claim.jenisRawat !== "Rawat Jalan") {
    const lainnya = sekunder.filter((c) => !/^E87\.6/.test(c));
    const alasan = [];
    const nilaiK = [];
    const reK = /kalium\s*(?:\(K\))?\s*[:=]?\s*([0-9]+[.,][0-9]+)/gi;
    let mK;
    while ((mK = reK.exec(teks)) !== null) { const v = parseFloat(mK[1].replace(",", ".")); if (!isNaN(v)) nilaiK.push(v); }
    // "Terkoreksi cepat" hanya dinilai pada rawat singkat (≤3 hari) — urutan angka di teks
    // tidak selalu kronologis, & rawat panjang bisa diawali hiperkalemia lalu turun.
    if (Number(claim.los) <= 3 && nilaiK.length >= 2 && Math.min(...nilaiK) < 3.5 && Math.max(...nilaiK) >= 3.3 && Math.max(...nilaiK) <= 5.5) {
      alasan.push(`kalium tercatat naik dari ${Math.min(...nilaiK)} ke ${Math.max(...nilaiK)} — terkoreksi cepat (pola "kalium meningkat di hari yang sama" → E87.6 dihapus)`);
    }
    if (/normal\s+(ECG|EKG)|sinus\s+rhythm|irama\s+sinus|EKG\s*:?\s*(dalam\s+batas\s+normal|normal)/i.test(teks)) {
      alasan.push("EKG tercatat normal / irama sinus tanpa gambaran hipokalemia (pola \"EKG tidak memenuhi\")");
    }
    if (/^(A0[0-9]|K52|K59\.1|E86|R11)/.test(primer) || /\bdiare\b|muntah\s+(hebat|terus|>|berulang)|dehidrasi/i.test(teks)) {
      alasan.push("hipokalemia dapat dinilai sebagai akibat/bagian dari diagnosis utama (diare/muntah/dehidrasi/demam tifoid) — pola \"hipokalemia include DU\"; contoh alasan verifikator: \"hipokalemia masuk ke dalam gambaran klinis atau komplikasi dari demam tifoid\"");
    }
    if (lainnya.length === 0 || alasan.length > 0) {
      hasil.push({ id: "hipokalemiaRawanDihapus", detail: `E87.6 (hipokalemia) ${lainnya.length === 0 ? "adalah SATU-SATUNYA diagnosis sekunder dan" : "kemungkinan"} menjadi penaik severity ke ${sev}. Pada data verifikasi klaim, hipokalemia sekunder berulang kali dihapus/dikoreksi verifikator (severity turun, mis. A-4-14-II → A-4-14-I). ${alasan.length ? "Temuan pada berkas ini: " + alasan.join("; ") + "." : ""} Pastikan terdokumentasi: kalium <3,5 yang bermakna klinis, koreksi kalium terencana (KCl drip/oral) dengan pemantauan serial, bukan sekadar hasil lab sekali yang langsung normal, dan bukan bagian dari perjalanan penyakit utama.` });
    }
  }
  return hasil;
}


function screenAllClaims(claims, weights) {
  const w = { ...DEFAULT_WEIGHTS, ...weights };

  const byInacbg = {};
  claims.forEach((c) => {
    const key = c.inacbgCode || "—";
    if (!byInacbg[key]) byInacbg[key] = [];
    byInacbg[key].push(c);
  });

  // agregasi per DPJP (butuh nama diisi & minimal 5 klaim untuk statistik bermakna)
  const byDpjp = {};
  claims.forEach((c) => {
    const name = (c.dpjp || "").trim();
    if (!name) return;
    if (!byDpjp[name]) byDpjp[name] = [];
    byDpjp[name].push(c);
  });

  // skor mentah tiap klaim TANPA rule DPJP dulu (untuk hitung rata-rata RS)
  const prelim = claims.map((claim) => computeFlags(claim, claims, byInacbg, w, false));
  const overallScores = prelim.map((p) => p.score);
  const overallAvg = mean(overallScores);
  const overallSd = stddev(overallScores);

  const dpjpStats = {};
  Object.entries(byDpjp).forEach(([name, list]) => {
    if (list.length < 5) return;
    const idxScores = list.map((c) => {
      const idx = claims.indexOf(c);
      return prelim[idx].score;
    });
    const avg = mean(idxScores);
    const propSevIII = list.filter((c) => c.severityLevel === "III").length / list.length;
    dpjpStats[name] = { n: list.length, avg, propSevIII };
  });

  return claims.map((claim, idx) => {
    const base = prelim[idx];
    const flags = [...base.flags];
    let score = base.score;

    const name = (claim.dpjp || "").trim();
    if (name && dpjpStats[name] && overallSd > 0) {
      const stat = dpjpStats[name];
      if (stat.avg > overallAvg + 1.5 * overallSd) {
        flags.push({
          id: "dpjpPattern",
          label: RULE_LABELS.dpjpPattern,
          detail: `DPJP "${name}" memiliki rata-rata skor klaim ${stat.avg.toFixed(1)} dari ${stat.n} klaim (rata-rata RS ${overallAvg.toFixed(1)}), dengan ${(stat.propSevIII * 100).toFixed(0)}% berseverity III. Perlu telaah pola koding pada DPJP ini.`,
          weight: w.dpjpPattern,
        });
        score += w.dpjpPattern;
      }
    }

    // Data inti wajib untuk skrining yang bermakna: tanpa kode INA-CBG & tarif,
    // beberapa aturan (kesesuaian tarif resmi, konsistensi severity vs kode,
    // kewajaran tarif antar-kelompok) TIDAK BISA dijalankan sama sekali. Karena
    // itu hasil "Rendah" pada kondisi ini menyesatkan — bukan berarti klaim aman,
    // tapi skriningnya memang belum bisa menilai. Tandai jelas sbg "Belum Lengkap".
    const adaKodeInacbg = !!(claim.inacbgCode && String(claim.inacbgCode).trim());
    const adaTarif = parseAngka(claim.tarifKlaim) > 0;
    const dataIntiLengkap = adaKodeInacbg && adaTarif;

    let riskLevel = "Rendah";
    if (score >= 5) riskLevel = "Tinggi";
    else if (score >= 2) riskLevel = "Sedang";
    // Hanya menggantikan label "Rendah" yang menyesatkan — temuan Sedang/Tinggi
    // tetap ditampilkan apa adanya karena itu hasil nyata dari aturan yang sempat jalan.
    else if (!dataIntiLengkap) riskLevel = "Belum Lengkap";

    // Ringkasan status per tahap — dipakai UI utk menampilkan pipeline verifikasi
    const stages = {};
    Object.keys(STAGE_LABELS).forEach((s) => { stages[s] = "lolos"; });
    flags.forEach((f) => { if (f.stage && stages[f.stage] !== undefined) stages[f.stage] = "perlu_dicek"; });
    // Tahap "kode" tidak boleh dinyatakan lolos kalau kode/tarifnya memang belum ada
    if (!dataIntiLengkap && stages.kode === "lolos") stages.kode = "perlu_dicek";

    return { ...claim, flags, score, riskLevel, dataIntiLengkap, notes: base.notes, stages };
  });
}

function computeFlags(claim, allClaims, byInacbg, w) {
  const flags = [];
  const notes = [];
  let score = 0;
  const add = (id, detail) => {
    flags.push({ id, label: RULE_LABELS[id], detail, weight: w[id], stage: RULE_STAGE[id] || "medis" });
    score += w[id];
  };

  const severity = claim.severityLevel;
  const secDx = claim.secondaryDx || [];
  const los = Number(claim.los);
  const isSurgical = claim.jenisKasus === "Bedah";
  const isRawatJalan = claim.jenisRawat === "Rawat Jalan";
  const procedures = claim.procedures || [];
  const tarif = parseAngka(claim.tarifKlaim);

  // 0. Sistem pengaman data — cek kewajaran seluruh field kritis (lihat sanityCheckClaim)
  notes.push(...sanityCheckClaim(claim));
  notes.push(...sepCompletenessCheck(claim));
  const kodeTL = cekKodeVsRiwayat(claim);
  if (kodeTL) notes.push({ id: "kodeTidakLazimDx", label: "Kode INA-CBG tidak lazim untuk diagnosis utama ini", detail: `${kodeTL.ringkas} Periksa kembali pemilihan diagnosis utama/prosedur di e-Klaim sebelum diajukan.` });

  // 1. Severity tinggi tanpa dx sekunder pendukung — hanya relevan utk rawat inap
  //    (rawat jalan umumnya tidak punya gradasi severity, kode INACBG-nya berakhiran -0)
  if (!isRawatJalan && severity === "III" && secDx.length < 2) {
    add("severityNoCC", `Level severity III biasanya membutuhkan komorbiditas/komplikasi (CC/MCC) yang jelas. Klaim ini hanya mencantumkan ${secDx.length} diagnosis sekunder.`);
  }
  // 2. LOS pendek utk severity tinggi — juga khusus rawat inap
  if (!isRawatJalan && severity === "III" && !isNaN(los) && los <= 2) {
    add("losShortForSeverity", `LOS ${los} hari tergolong pendek untuk kasus severity tertinggi. Perlu verifikasi kewajaran klinis.`);
  }
  // 2b. Rawat jalan dgn LOS >1 hari — tidak wajar, kunjungan rawat jalan mestinya satu hari
  if (isRawatJalan && !isNaN(los) && los > 1) {
    add("losRawatJalanTidakWajar", `Klaim ditandai Rawat Jalan tapi LOS tercatat ${los} hari — kunjungan rawat jalan seharusnya selesai dalam 1 hari. Periksa apakah jenis perawatan/tanggal salah baca.`);
  }
  // 3. Kode high-risk tanpa bukti penunjang
  const allDx = [claim.primaryDxCode, ...secDx.map((d) => d.code)].filter(Boolean);
  const foundHighRisk = new Set();
  allDx.forEach((code) => { const key = matchHighRiskDx(code); if (key) foundHighRisk.add(key); });
  if (foundHighRisk.size > 0 && !claim.buktiPenunjang) {
    foundHighRisk.forEach((key) => {
      const ref = HIGH_RISK_DX[key];
      flags.push({
        id: `highRiskDx-${key}`, label: `Kode rawan-upcoding: ${key} — ${ref.title}`,
        detail: `Perlu bukti penunjang: ${ref.need}.`, weight: w.highRiskDxNoEvidence, stage: "medis",
      });
      score += w.highRiskDxNoEvidence;
    });
  }
  // 3b. Kode rawan yang PENUNJANGNYA ADA — tetap ingatkan: yang dinilai verifikator
  //     bukan sekadar "ada pemeriksaan", tapi apakah HASILNYA memenuhi kriteria.
  if (foundHighRisk.size > 0 && claim.buktiPenunjang) {
    foundHighRisk.forEach((key) => {
      const ref = HIGH_RISK_DX[key];
      notes.push({ id: `highRiskDxCek-${key}`, label: `Kode rawan: ${key} — ${ref.title} (penunjang ada, cek kesesuaian kriteria)`, detail: `Pemeriksaan penunjang tercatat ada, tapi verifikator menilai apakah HASILNYA memenuhi kriteria: ${ref.need}. Hasil yang ada namun di luar ambang kriteria tetap berisiko pending/koreksi diagnosis.` });
    });
  }
  // 4. Dx sekunder berlebihan
  if (secDx.length > 8) {
    add("tooManySecondaryDx", `Tercatat ${secDx.length} diagnosis sekunder. Perlu dicek relevansi klinis masing-masing.`);
  }
  // 5. Bedah tanpa prosedur
  if (isSurgical && procedures.length === 0) {
    add("surgicalNoProcedure", "Jenis kasus ditandai Bedah namun tidak ada kode tindakan yang menyertai.");
  }
  // 6/8. Outlier statistik tarif & LOS dalam kelompok kode INACBG sama
  const group = byInacbg[claim.inacbgCode || "—"] || [];
  if (group.length >= 3) {
    const tarifs = group.map((c) => parseAngka(c.tarifKlaim)).filter((n) => !isNaN(n));
    const loses = group.map((c) => Number(c.los)).filter((n) => !isNaN(n));
    if (!isNaN(tarif) && tarifs.length >= 3 && !claim.specialCMG) {
      const q1 = quartile(tarifs, 0.25), q3 = quartile(tarifs, 0.75), iqr = q3 - q1;
      if (iqr > 0 && tarif > q3 + 1.5 * iqr) {
        add("tariffOutlierStat", `Tarif Rp${tarif.toLocaleString("id-ID")} di atas batas wajar kelompok (median ≈ Rp${median(tarifs).toLocaleString("id-ID")}, n=${group.length}).`);
      }
    }
    if (!isNaN(los) && loses.length >= 3) {
      const q1 = quartile(loses, 0.25), q3 = quartile(loses, 0.75), iqr = q3 - q1;
      if (iqr > 0 && los > q3 + 1.5 * iqr) {
        add("losOutlier", `LOS ${los} hari di luar rentang wajar kelompok (median ≈ ${median(loses)} hari, n=${group.length}).`);
      }
    }
  }
  // 7. Readmisi / fragmentasi — dua tingkat: ≤7 hari (perlu ditelaah, indikasi
  //    fragmentasi episode) dan 8-30 hari (standar resmi Vedika BPJS untuk
  //    "konfirmasi episode readmisi"). Menyertakan relatedClaimId supaya UI bisa
  //    menawarkan aksi gabung/konfirmasi terpisah (lihat Detail Modal).
  if (claim.noRM && claim.tglMasuk) {
    let matched = null; let matchedGap = null;
    allClaims.forEach((o) => {
      if (matched || o.id === claim.id || o.noRM !== claim.noRM || !o.tglKeluar) return;
      const gap = daysBetween(o.tglKeluar, claim.tglMasuk);
      const sameDx = (o.primaryDxCode || "").trim().toUpperCase() === (claim.primaryDxCode || "").trim().toUpperCase();
      if (gap !== null && gap >= 0 && gap <= 30 && sameDx) { matched = o; matchedGap = gap; }
    });
    const sudahDikonfirmasi = matched && (claim.confirmedSeparateEpisodes || []).indexOf(matched.id) >= 0;
    if (matched && !sudahDikonfirmasi && matchedGap <= 7) {
      flags.push({ id: "readmission", label: RULE_LABELS.readmission,
        detail: `Pasien No. RM ${claim.noRM} tercatat keluar dari episode lain dgn diagnosis utama sama dalam ${matchedGap} hari sebelum episode ini. Pola ini kadang mengindikasikan fragmentasi episode — ada baiknya dicek dulu apakah memang dua episode terpisah secara klinis, atau perlu digabung. Catatan: menurut Permenkes No. 26/2021 Bab III huruf E, readmisi TIDAK berlaku (dikecualikan) bila: (1) kondisi kegawatdaruratan, (2) penyakit kronis, (3) tindakan/prosedur/post-prosedur terjadwal sesuai indikasi medis yang memang tidak bisa diselesaikan dalam satu episode, atau (4) kunjungan pada FKRTL berbeda/kelas lebih tinggi — kalau salah satu berlaku, flag ini boleh diabaikan.`,
        weight: w.readmission, stage: "pola", relatedClaimId: matched.id, relatedClaimGap: matchedGap });
      score += w.readmission;
    } else if (matched && !sudahDikonfirmasi) {
      flags.push({ id: "readmission30", label: RULE_LABELS.readmission30,
        detail: `Pasien No. RM ${claim.noRM} readmisi dalam ${matchedGap} hari dgn diagnosis utama sama — sesuai definisi resmi Permenkes No. 26/2021 Bab III huruf E: "kunjungan rawat inap berulang di FKRTL yang sama dengan diagnosis utama yang sama dari episode rawat inap sebelumnya dalam waktu ≤30 hari". Dikecualikan bila: (1) kegawatdaruratan, (2) penyakit kronis, (3) tindakan/prosedur/post-prosedur terjadwal sesuai indikasi medis, atau (4) FKRTL berbeda/kelas lebih tinggi. Ada baiknya dicatat dulu alasannya (kambuh alami, rencana terapi bertahap, atau salah satu pengecualian di atas) sebelum diajukan.`,
        weight: w.readmission30, stage: "pola", relatedClaimId: matched.id, relatedClaimGap: matchedGap });
      score += w.readmission30;
    }
  }
  // 7b. Kesesuaian SEP dengan episode klaim (tanggal & kelas hak) — dua penyebab paling
  //     umum "SEP tidak sinkron" yang ditolak Vedika BPJS
  if (claim.sep) {
    const tglSep = claim.sep.tglSep;
    if (tglSep && claim.tglMasuk) {
      const gapSepMasuk = daysBetween(tglSep, claim.tglMasuk);
      const gapSepKeluar = claim.tglKeluar ? daysBetween(tglSep, claim.tglKeluar) : null;
      // SEP normalnya diterbitkan pada/sekitar tanggal masuk, dan tidak boleh setelah tanggal keluar
      const tglTidakWajar = gapSepMasuk !== null && (gapSepMasuk < -3 || gapSepMasuk > 3);
      const sepSetelahKeluar = gapSepKeluar !== null && gapSepKeluar < 0; // negatif = tglKeluar sebelum tglSep (SEP terbit setelah pasien pulang)
      if (tglTidakWajar || sepSetelahKeluar) {
        add("sepTanggalMismatch", `Tgl. SEP (${tglSep}) tidak sesuai episode klaim (masuk ${claim.tglMasuk}${claim.tglKeluar ? `, keluar ${claim.tglKeluar}` : ""}). SEP normalnya terbit pada/sekitar tanggal masuk dan tidak boleh setelah tanggal keluar.`);
      }
    }
    const kelasHak = claim.sep.kelasHak;
    if (kelasHak && claim.kelasRawat) {
      const kelasHakNum = (kelasHak.match(/\d/) || [])[0];
      if (kelasHakNum && kelasHakNum !== String(claim.kelasRawat)) {
        add("sepKelasMismatch", `Kelas hak SEP "${kelasHak}" berbeda dari kelas rawat klaim (Kelas ${claim.kelasRawat}). Perlu dikonfirmasi apakah ada naik/turun kelas dan penyesuaian selisih biaya sesuai ketentuan.`);
      }
    }
  }

  // 8. FRAGMENTASI RAWAT JALAN — pola nyata paling sering di data pending RS ini (30/140
  //    kasus Juni 2026): klaim rawat jalan kode konsultasi umum (Q-5-18-0 dkk) dengan
  //    banyak diagnosis sekunder lintas-organ, indikasi klaim gabungan dari beberapa
  //    poli/konsul internal yang seharusnya dipisah per episode.
  if (isRawatJalan) {
    const genericConsult = ["Q-5-18-0", "Q-5-42-0", "Q-5-44-0"];
    if (genericConsult.indexOf((claim.inacbgCode || "").trim()) >= 0 && secDx.length >= 3) {
      add("fragmentasiRawatJalan", `Klaim Rawat Jalan kode "${claim.inacbgCode}" (konsultasi umum) dengan ${secDx.length} diagnosis sekunder lintas-organ. Pola ini sangat sering ditandai Vedika BPJS sebagai "Potensi Fragmentasi/konsul internal" — periksa apakah ini sebenarnya beberapa kunjungan poli berbeda yang digabung jadi satu klaim. Definisi resmi fragmentasi (Permenkes No. 26/2021 Bab III huruf E): kunjungan rawat jalan berulang di FKRTL yang sama dengan diagnosis sama dari episode sebelumnya dalam ≤7 hari — dikecualikan bila (1) kegawatdaruratan, (2) penyakit kronis, (3) rangkaian tindakan/prosedur/post-prosedur terjadwal sesuai indikasi medis, atau (4) konsultasi hasil pemeriksaan penunjang yang tidak bisa selesai dalam satu episode (baca juga aturan Episode Bab III huruf D — lihat contoh B/C/D di pedoman: pemeriksaan penunjang lintas-hari yang diikuti konsul hasil TETAP sah 1 episode/2 episode terpisah, bukan otomatis fragmentasi).`);
    }
  }

  // 9b. KNS (Kondisi Non-Spesifik) berlanjut >3 bulan — pola nyata #1 di data pending RS
  //     ini (32/140 kasus): diagnosis belum definitif (Bab XVIII R00-R99, Z09.8 follow-up,
  //     E46 malnutrisi YTK) yang masih dipakai pada kunjungan berulang melewati 3 bulan.
  const isNonSpecificDx = (code) => {
    if (!code) return false;
    const c = code.trim().toUpperCase();
    return c.startsWith("R") || c.startsWith("Z09") || c.startsWith("E46");
  };
  if (claim.noRM && claim.tglMasuk) {
    const allDxThis = [claim.primaryDxCode, ...secDx.map((d) => d.code)];
    if (allDxThis.some(isNonSpecificDx)) {
      const priorNonSpecific = allClaims.find((o) => {
        if (o.id === claim.id || o.noRM !== claim.noRM || !o.tglMasuk) return false;
        const gap = daysBetween(o.tglMasuk, claim.tglMasuk);
        if (gap === null || Math.abs(gap) < 90) return false;
        const oDx = [o.primaryDxCode, ...(o.secondaryDx || []).map((d) => d.code)];
        return oDx.some(isNonSpecificDx);
      });
      if (priorNonSpecific) {
        add("knsLebihTigaBulan", `Diagnosis non-spesifik (mis. kode R.., Z09.8, atau E46) tercatat lagi pada pasien No. RM ${claim.noRM}, berjarak >3 bulan dari kunjungan sebelumnya dengan pola diagnosis serupa. Vedika BPJS sering pending kasus KNS >3 bulan — pertimbangkan apakah sudah waktunya diagnosis definitif ditegakkan.`);
      }
    }
  }

  // 9c. Kode prosedur duplikat dalam bulan kalender yang sama — indikasi tindakan
  //     dilakukan/ditagih berulang tanpa jarak wajar (pola nyata: 3/140 kasus).
  if (procedures.length > 0 && claim.noRM && claim.tglMasuk) {
    const thisMonth = claim.tglMasuk.slice(0, 7);
    const dupeMonth = allClaims.find((o) => {
      if (o.id === claim.id || o.noRM !== claim.noRM || !o.tglMasuk) return false;
      if (o.tglMasuk.slice(0, 7) !== thisMonth) return false;
      const oProcCodes = (o.procedures || []).map((p) => p.code);
      return procedures.some((p) => oProcCodes.indexOf(p.code) >= 0);
    });
    if (dupeMonth) {
      add("prosedurDuplikatBulan", `Kode prosedur yang sama tercatat lebih dari sekali dalam bulan ${thisMonth} untuk pasien No. RM ${claim.noRM}. Verifikator sering mempertanyakan tindakan berulang dalam periode singkat — pastikan ada indikasi klinis yang mendukung pengulangan.`);
    }
  }

  // 9c2. Matriks Ketentuan Penjaminan & Penagihan Klaim IGD — Lampiran BA Kemenkes-BPJS
  //      No. 3760/2024. Kasus dijamin sbg RAWAT INAP hanya bila memenuhi kriteria gawat
  //      darurat DAN (tidak dirujuk ATAU pelayanan >6 jam) DAN indikasi rawat inap terpenuhi.
  //      Tanpa kriteria gawat darurat sama sekali = berisiko dianggap "false emergency"
  //      yang TIDAK DIJAMIN sama sekali menurut matriks resmi.
  if (claim.dariIGD) {
    const losJam = Number(claim.igdLosJam);
    const buktiGD = claim.igdKriteriaGawatDarurat ? [] : deteksiGawatDarurat(claim);
    if (!claim.igdKriteriaGawatDarurat && buktiGD.length > 0) {
      notes.push({ id: "igdKriteriaTerdeteksi", label: "Kriteria gawat darurat terdeteksi dari dokumen klaim", detail: `Kotak "Memenuhi kriteria Gawat Darurat" belum dicentang, tetapi dokumen klaim mencatat: ${buktiGD.join("; ")}. Kriteria gawat darurat dianggap terpenuhi — pastikan tercatat juga di lembar triase IGD, lalu centang kotak itu di Edit (✏) untuk konfirmasi.` });
    } else if (!claim.igdKriteriaGawatDarurat) {
      add("igdMismatch", `Klaim asal IGD ditandai belum memenuhi kriteria gawat darurat. Menurut Matriks Penjaminan Klaim IGD (Lampiran BA Kemenkes-BPJS No. 3760/2024), kasus IGD idealnya memenuhi salah satu kriteria gawat darurat (ancam nyawa, gangguan napas/sirkulasi, penurunan kesadaran, gangguan hemodinamik, atau perlu tindakan segera) — ada baiknya dicek ulang dan didokumentasikan di lembar triase sebelum diajukan, supaya tidak berisiko dipertanyakan sebagai kasus non-emergency.`);
    }
    if ((claim.igdKriteriaGawatDarurat || buktiGD.length > 0) && claim.jenisRawat !== "Rawat Jalan" && claim.igdLosJam !== "" && claim.igdLosJam != null && !isNaN(losJam) && losJam < 6 && !claim.igdDirujuk) {
      add("igdMismatch", `Klaim IGD diklaim sebagai Rawat Inap, tapi lama pelayanan IGD tercatat ${losJam} jam (<6 jam) dan pasien tidak dirujuk. Menurut matriks resmi, penjaminan sebagai RITL memerlukan salah satu: pelayanan IGD >6 jam, ATAU telah memenuhi indikasi medis rawat inap dan menempati ruang perawatan dengan visitasi DPJP — pastikan salah satu syarat ini terdokumentasi (Resume Medis DPJP, asuhan keperawatan IGD).`);
    }
  }

  // 9d. Kode A04.9 — riwayat spesifik RS ini sering dikoreksi Vedika karena dianggap
  //     "kode gabungan" pencernaan + infeksi bakteri yang tumpang tindih (9/140 kasus).
  if ((claim.primaryDxCode || "").trim().toUpperCase().indexOf("A04.9") === 0) {
    notes.push({ id: "kodeA049Watch", label: RULE_LABELS.kodeA049Watch, detail: `Kode A04.9 sebagai diagnosis utama sering dikoreksi Vedika BPJS dengan alasan "kode gabung pencernaan dan bacterial infection" — periksa apakah kode ini sudah paling spesifik (bukan kode gabungan berlebihan) sebelum diajukan.` });
  }

  // 9d2. Deteksi otomatis pola koreksi koding resmi (BA Kemenkes-BPJS 2023) untuk
  //      pasangan kode yang paling jelas & terdeteksi tanpa perlu penilaian klinis —
  //      kode gabungan yang sering dikoding terpisah padahal seharusnya satu kode saja.
  (() => {
    const allDxUpper = [claim.primaryDxCode, ...secDx.map((d) => d.code)].map((c) => (c || "").trim().toUpperCase());
    const has = (prefix) => allDxUpper.some((c) => c.indexOf(prefix) === 0);
    if (has("K35.2") && has("K63.1")) {
      notes.push({ id: "koreksiKodingGabungan", label: "Pola koreksi resmi: K35.2 + K63.1 seharusnya digabung", detail: `BA Kemenkes-BPJS 2023: apendisitis perforasi (K35.2) sudah mewakili kondisi perforasi usus — K63.1 tidak perlu dikode terpisah. Pertimbangkan hapus K63.1.` });
    }
    if (has("K80") && (has("K83.0") || has("K83.1"))) {
      notes.push({ id: "koreksiKodingGabungan", label: "Pola koreksi resmi: K80.- + K83.- seharusnya digabung", detail: `BA Kemenkes-BPJS 2023: kolelitiasis (K80.-) dgn kolangitis/obstruksi duktus biliaris sebaiknya pakai kode gabungan (mis. K80.3/K80.4), bukan K83.0/K83.1 dikode terpisah.` });
    }
    if (has("O34.2")) {
      notes.push({ id: "koreksiKodingGabungan", label: "Pola koreksi resmi: O34.2 kemungkinan seharusnya O75.7", detail: `BA Kemenkes-BPJS 2023: persalinan pervaginam pasca SC sebelumnya seharusnya dikode O75.7 (vaginal delivery following previous caesarean section), bukan O34.2, kalau memang persalinannya pervaginam.` });
    }
    if (has("R57") && !has("R57.0")) {
      notes.push({ id: "koreksiKodingGabungan", label: "Pola koreksi resmi: R57 kemungkinan seharusnya O75.1", detail: `BA Kemenkes-BPJS 2023: syok dalam konteks persalinan seharusnya dikode O75.1 (Shock during or following labour and delivery), bukan R57 yang terlalu umum — cek apakah konteksnya obstetri.` });
    }
    if (has("O15.1")) {
      notes.push({ id: "koreksiKodingGabungan", label: "Pola koreksi resmi: O15.1 kemungkinan seharusnya O14.1", detail: `BA Kemenkes-BPJS 2023: "impending eklamsia" adalah pre-eklamsia berat (O14.1), bukan eklamsia sesungguhnya (O15.1) — periksa istilah di resume medis.` });
    }
  })();

  // 9e. Ganti balut / perawatan luka berulang — kalau sudah berkali-kali di RS untuk
  //     pasien yang sama, Vedika sering minta dirujuk balik ke PPK1. TERBUKTI dari data
  //     pending nyata RS ini (400 kasus, April-Juni 2026): ini penyebab pending #3
  //     terbanyak — 52 kasus (13%), persis di kisaran KNS (20%) & fragmentasi (15%).
  //     Sebelumnya cuma catatan info (tidak memengaruhi skor) — DIPERBAIKI jadi penanda
  //     berbobot supaya risiko klaim ini tercermin di skor, bukan cuma catatan pasif.
  if (procedures.some((p) => (p.code || "").trim().indexOf("93.57") === 0) && claim.noRM) {
    const priorGantiBalut = allClaims.filter((o) => o.id !== claim.id && o.noRM === claim.noRM &&
      (o.procedures || []).some((p) => (p.code || "").trim().indexOf("93.57") === 0));
    if (priorGantiBalut.length >= 1) {
      add("gantiBalutBerulang", `Prosedur ganti balut (93.57) tercatat ${priorGantiBalut.length + 1}x untuk pasien No. RM ${claim.noRM} di sistem ini. Vedika BPJS sering pending perawatan luka berulang dengan alasan "kembali ke PPK1" (13% dari kasus pending RS ini, April-Juni 2026) — pertimbangkan rujukan balik ke Puskesmas/FKTP bila kondisi sudah stabil.`);
    }
  }

  // 9f. Diagnosis sekunder KOSONG padahal tindakan rawat inap banyak/berat — pola
  //     khas dokumentasi/koding tidak lengkap. Merugikan RS dua arah: kondisi penyerta
  //     yang ditatalaksana tidak terkode (DOWNCODING), dan tindakan berat tampak tidak
  //     terjustifikasi di mata verifikator (PENDING).
  //     Dibatasi ke tindakan KRITIS saja — di data 6.867 klaim RI RS ini, aturan
  //     "≥3 tindakan apa pun" akan menandai 4.184 klaim (terlalu bising), sedangkan
  //     tindakan kritis tanpa diagnosis sekunder hanya 33 klaim (mis. RJP tanpa
  //     kode henti jantung) — sinyal yang benar-benar layak ditelaah.
  const KODE_TINDAKAN_KRITIS = ["96.04", "96.05", "96.70", "96.71", "96.72", "99.60", "99.61", "99.62", "99.63", "31.1", "31.29", "34.04", "38.93", "39.95", "00.17"];
  const tindakanKritis = procedures.filter((p) => KODE_TINDAKAN_KRITIS.indexOf((p.code || "").trim()) >= 0);
  if (!isRawatJalan && secDx.length === 0 && tindakanKritis.length > 0) {
    add("dxSekunderKosongTindakanKompleks", `Rawat inap dengan tindakan kritis (${tindakanKritis.map((p) => p.code).join(", ")}) tetapi TANPA satu pun diagnosis sekunder. Tindakan seberat ini biasanya disertai kondisi penyerta/komplikasi yang ditatalaksana (mis. gagal napas, henti jantung, gangguan asam-basa, infeksi penyerta) — telusuri resume medis, CPPT, hasil lab/AGD/radiologi: kondisi yang ditegakkan dokter & ditatalaksana tapi belum dikode = potensi DOWNCODING (RS rugi) sekaligus membuat tindakan tampak tidak terjustifikasi bagi verifikator.`);
  }
  // 9g. Klaim bernilai tinggi dgn lama rawat sangat singkat — hampir pasti ditelaah
  //     lebih dalam oleh verifikator (termasuk kasus meninggal/pulang paksa).
  if (!isRawatJalan && !isNaN(tarif) && tarif >= 10000000 && !isNaN(los) && los <= 2) {
    add("klaimTinggiLosSingkat", `Klaim Rp${tarif.toLocaleString("id-ID")} untuk lama rawat ${los} hari${claim.caraPulang ? ` (cara pulang: ${claim.caraPulang})` : ""}. Klaim bernilai tinggi dengan rawat singkat hampir selalu ditelaah lebih dalam oleh verifikator — pastikan diagnosis utama memenuhi kriteria klinis objektif (angka lab/AGD/radiologi yang tercatat) dan setiap tindakan penentu grouping (intubasi/ventilator/prosedur mayor) punya indikasi, jam, dan laporan tindakan yang jelas.`);
  }
  // 9h. Tarif INA-CBG jauh di atas tagihan riil RS (billing)
  const tarifRSAngka = Number(String(claim.tarifRS || "").replace(/\D/g, ""));
  if (tarifRSAngka > 0 && !isNaN(tarif) && tarif > tarifRSAngka * 2) {
    add("tarifJauhDiAtasBilling", `Tarif INA-CBG Rp${tarif.toLocaleString("id-ID")} lebih dari 2× tagihan riil RS (billing Rp${tarifRSAngka.toLocaleString("id-ID")}). INA-CBG memang tarif paket, jadi ini bukan pelanggaran dengan sendirinya — tapi selisih sebesar ini sering membuat verifikator memeriksa ulang apakah kode penentu grouping (terutama prosedur) benar-benar sesuai dokumentasi.`);
  }
  // 9i. Vonis telaah AI atas ISI berkas ikut menentukan level risiko. Sebelumnya opini
  //     AI hanya tampil sbg teks, sehingga klaim yang jelas bermasalah menurut bacaan
  //     AI (diagnosis tidak didukung hasil penunjang, dll) tetap berlabel "Rendah".
  const vonisAI = bacaRisikoPendingAI(claim.aiAnalysis, claim.aiStatus);
  if (vonisAI.level === "TINGGI") {
    add("aiRisikoPendingTinggi", `Telaah AI atas isi berkas menilai risiko pending TINGGI — ${vonisAI.alasan || "lihat Opini AI di bawah"}`);
  } else if (vonisAI.level === "SEDANG") {
    add("aiRisikoPendingSedang", `Telaah AI atas isi berkas menilai risiko pending SEDANG — ${vonisAI.alasan || "lihat Opini AI di bawah"}`);
  }

  // 9k. Validasi klinis deterministik (angka lab vs diagnosis, konsistensi tipe DM)
  validasiKlinisDeterministik(claim).forEach((v) => add(v.id, v.detail));

  // 9m. Aturan dari ALASAN PENDING NYATA Agustus 2026 (124 kasus, dicocokkan per SEP ke
  //     6.851 klaim e-Klaim Agustus). Angka "n/pending" di komentar = berapa klaim
  //     Agustus yang memenuhi pola & berapa yang benar-benar dipending verifikator.
  (() => {
    const kodeDx = [claim.primaryDxCode, ...secDx.map((d) => d.code)].map((c) => String(c || "").trim().toUpperCase()).filter(Boolean);
    const primer = String(claim.primaryDxCode || "").trim().toUpperCase();
    const sekunder = secDx.map((d) => String(d.code || "").trim().toUpperCase()).filter(Boolean);
    const kodePx = procedures.map((p) => String(p.code || "").trim());
    const teksKlinis = String(claim.resumeMedis || "");
    const daftarTD = [];
    const reTD = /(?:\bTD\b|tekanan\s+darah|\bBP\b|tensi)\s*[:=]?\s*(\d{2,3})\s*\/\s*(\d{2,3})/gi;
    let mTD;
    while ((mTD = reTD.exec(teksKlinis)) !== null) daftarTD.push([Number(mTD[1]), Number(mTD[2])]);

    // a. ETT bagian dari RJP (1/1 pending; alasan "Tindakan ETT(X) masuk dalam/bagian
    //    pada Resusitasi Jantung Paru"). 96.04 dapat menggeser grouping ke J-1-20.
    if (!isRawatJalan && kodePx.includes("96.04") && kodePx.some((c) => /^99\.6[0-3]$/.test(c))) {
      add("ettBagianRJP", `Intubasi (96.04) dikode bersama RJP (${kodePx.filter((c) => /^99\.6/.test(c)).join(", ")}). Verifikator lazim menolak pola ini dengan alasan "Tindakan ETT masuk dalam/bagian pada Resusitasi Jantung Paru" — intubasi yang dilakukan sebagai bagian dari resusitasi tidak dikode terpisah, dan grouping bisa turun (mis. dari J-1-20). Kode 96.04 hanya dipertahankan bila intubasi punya indikasi & waktu tersendiri di luar episode RJP (mis. intubasi elektif untuk gagal napas sebelum henti jantung), terdokumentasi di laporan tindakan dengan jam yang jelas.`);
    }
    // b. A49.9 sebagai DU rawat inap (29 klaim, 14 pending = 48%). Alasan nyata:
    //    "DX A049 kode gabung pencernaan dan bacterial infection", "A49.9 → B34.9, kenaikan
    //    leukosit tidak signifikan/normal", "indikasi rawat inap lebih pada ISPA sebagai DU".
    if (!isRawatJalan && /^A49\.9/.test(primer)) {
      add("kodeA499Gabung", `Diagnosis utama A49.9 (infeksi bakteri YTT). Pada data verifikasi klaim, hampir separuh klaim rawat inap dengan DU A49.9 dipending. Alasan verifikator: (1) "kode gabung pencernaan dan bacterial infection" — bila ada keluhan GI (diare/muntah/GEA), pakai kode infeksi saluran cerna yang spesifik, bukan A49.9; (2) "A49.9 → B34.9, kenaikan leukosit tidak signifikan/normal" — infeksi bakteri wajib didukung leukositosis bermakna/CRP/PCT/kultur, kalau tidak dikoreksi jadi infeksi virus; (3) "indikasi rawat inap lebih pada ISPA sebagai DU" — bila fokus infeksi jelas (ISPA, ISK, dll), fokus itulah DU-nya. Pastikan resume mencantumkan fokus infeksi & angka leukosit/penanda infeksi.`);
    }
    // c. Preeklampsia O14.x (14 klaim, 7 pending = 50%). Alasan: "PEB tdk memenuhi > O13",
    //    "Pre-Eclampsia (O14.1) X (TD DBN) =>> O13".
    const o14 = kodeDx.filter((c) => /^O14/.test(c));
    if (o14.length) {
      const maxSis = daftarTD.length ? Math.max(...daftarTD.map((t) => t[0])) : null;
      const maxDia = daftarTD.length ? Math.max(...daftarTD.map((t) => t[1])) : null;
      const tdInfo = maxSis !== null ? ` TD tertinggi yang terbaca di berkas: ${maxSis}/${maxDia}${maxSis < 160 && maxDia < 110 ? " — BELUM mencapai kriteria berat (≥160/110)" : ""}${maxSis < 140 && maxDia < 90 ? " dan bahkan dalam batas normal (pola \"TD DBN\")" : ""}.` : "";
      const proteinNeg = /protein\s*urin\w*\s*[:=]?\s*(negatif|neg\b|\(-\)|-\s|trace|\+1\b|positif\s*1\b)/i.test(teksKlinis);
      add("pebTidakMemenuhi", `${o14.join("/")} (preeklampsia) dikode. Pada data verifikasi klaim, sekitar separuh klaim dengan O14.x dipending dengan alasan "PEB tidak memenuhi → O13" / "TD DBN → O13".${tdInfo}${proteinNeg ? " Protein urin tercatat negatif/rendah." : ""} Pastikan terdokumentasi: TD ≥140/90 pada usia kehamilan >20 minggu + proteinuria (atau disfungsi organ) untuk preeklampsia, dan TD ≥160/110 atau tanda pemberatan (trombositopenia, gangguan fungsi hati/ginjal, edema paru, gangguan visual/serebral) untuk O14.1. Tanpa itu, verifikator mengoreksi ke O13 (hipertensi gestasional) dan severity bisa turun.`);
    }
    // d. Kondisi akut/gawat dikode sekunder sementara DU kondisi kronis/umum (18 klaim,
    //    8 pending = 44%). Alasan: "J96.0 sbg DU, kondisi akut", "I21.2 jadi DU",
    //    "R57.0 sbg DU", "DU: I50.0", "DX K92.0 = DU", "DU: J90, resource terbesar".
    const RE_AKUT = /^(I21|I22|I46|J96\.0|J80|J81|R57|N17|I50|K92\.[0-2]|I6[0-4]|J90|J93|K65)/;
    const akutSekunder = sekunder.filter((c) => RE_AKUT.test(c));
    if (!isRawatJalan && akutSekunder.length && !RE_AKUT.test(primer) && !/^A4[01]/.test(primer)) {
      add("kondisiAkutBukanDU", `Kondisi akut/gawat ${akutSekunder.join(", ")} dikode sebagai diagnosis SEKUNDER, sedangkan diagnosis utama ${primer}. Pola ini sering dipending — alasan verifikator: "J96.0 sbg DU, kondisi akut", "I21.2 jadi DU, kondisi akut jadi DU", "R57.0 sbg DU", "DU: I50.0", "K92.0 = DU (klinis & tatalaksana ++)", "DU: J90, ada tindakan, resource terbesar". Kaidah MB: kondisi yang paling banyak menyerap sumber daya / alasan utama perawatan menjadi DU. Pilih salah satu: jadikan kondisi akut itu DU (bila memang alasan rawat & tatalaksana terbesar), atau hapus bila kriterianya tidak terpenuhi (mis. "R57.9 TD DBN", "syok hipovolemik tanpa bukti hemodinamik").`);
    } else if (!isRawatJalan && sekunder.some((c) => /^J90/.test(c)) && kodePx.some((c) => /^34\.9[12]$/.test(c))) {
      add("kondisiAkutBukanDU", `Efusi pleura (J90) dikode SEKUNDER padahal dilakukan tindakan torakosentesis/pungsi pleura (${kodePx.filter((c) => /^34\.9/.test(c)).join(", ")}), dengan diagnosis utama ${primer}. Alasan pending yang pernah ditemui: "DU: J90, ada tindakan, resource terbesar" — kondisi yang ditindak & menyerap sumber daya terbesar menjadi DU. Tinjau ulang pemilihan DU sesuai kaidah MB.`);
    }
    // e. Rawat inap LOS 1 hari (masuk & pulang hari yang sama) — 3 klaim, 3 pending (100%).
    //    Alasan: "RI → RJ, LOS 1 hari rujuk, tatalaksana kegawatdaruratan, visit DPJP
    //    spesialis (-)", "rawat inap kurang dari 6 jam rujuk (RI - RJ)".
    if (!isRawatJalan && !isNaN(los) && los <= 1 && !/meninggal/i.test(String(claim.caraPulang || ""))) {
      add("rawatInapSatuHari", `Rawat inap dengan lama rawat ${los} hari (masuk & pulang di hari yang sama)${claim.caraPulang ? `, cara pulang: ${claim.caraPulang}` : ""}. Klaim rawat inap dengan LOS 1 hari sangat sering dipending dan dikoreksi jadi rawat jalan — alasan: "LOS 1 hari rujuk, tatalaksana kegawatdaruratan, visit DPJP spesialis (-)", "rawat inap kurang dari 6 jam, rujuk". Pasien yang hanya distabilkan lalu dirujuk umumnya dijamin sebagai rawat jalan/IGD. Bila tetap diajukan RI, pastikan ada visit DPJP spesialis, tatalaksana rawat inap (bukan hanya kegawatdaruratan), dan jam masuk–keluar yang jelas.`);
    }
    // f. Persalinan tanpa Z37 (alasan console algoritma: "Diagnosa sekunder Z37 tidak
    //    diinput pada persalinan").
    if (kodeDx.some((c) => /^O8[0-4]/.test(c)) && !kodeDx.some((c) => /^Z37/.test(c))) {
      add("persalinanTanpaZ37", `Ada kode persalinan (${kodeDx.filter((c) => /^O8[0-4]/.test(c)).join(", ")}) tetapi tidak ada kode luaran persalinan Z37.- (mis. Z37.0 lahir hidup tunggal). Console algoritma Vedika memending klaim ini dengan alasan "Diagnosa sekunder Z37 tidak diinput pada persalinan".`);
    }
  })();

  // 9l. Inkonsistensi tanggal & diagnosis antar dokumen — sebagai TEMUAN skrining
  //     (ikut menentukan skor), bukan hanya catatan kajian. Temuan yang sudah ditandai
  //     "Sudah diperbaiki" / "Bukan masalah (sesuai)" di panel tidak dihitung lagi.
  const inkTerstruktur = cekInkonsistensiTerstruktur(claim).filter((it) => !inkonsistensiDitutup(claim, it.key));
  const inkTgl = inkTerstruktur.filter((it) => it.kategori === "Waktu/jam");
  if (inkTgl.length) {
    add("inkonsistensiTanggal", `${inkTgl.length} tanggal dokumen tidak sesuai episode rawat (${claim.tglMasuk} s.d. ${claim.tglKeluar || claim.tglMasuk}): ${inkTgl.map((it) => `${it.dokumenA} "${it.isiA}"${it.tingkat === "Sedang" ? " (kemungkinan hari-bulan tertukar)" : ""}`).join("; ")}. Detail & tindak lanjut di panel Inkonsistensi Dokumen.`);
  }
  const inkDx = inkTerstruktur.filter((it) => it.kategori !== "Waktu/jam");
  if (inkDx.length) {
    add("inkonsistensiDiagnosis", `${inkDx.length} ketidaksesuaian diagnosis antara dokumen DPJP dan kode klaim: ${inkDx.map((it) => `${it.dokumenA} "${it.isiA}" vs ${it.dokumenB} "${it.isiB}"`).join("; ")}.`);
  }
  if (claim.aiStatus === "done" && claim.aiAnalysis) {
    const aiTinggi = ekstrakInkonsistensi(claim.aiAnalysis)
      .filter((it) => it.tingkat === "Tinggi" && !inkonsistensiDitutup(claim, it.key) && !inkTerstruktur.some((x) => x.key === it.key));
    if (aiTinggi.length) {
      add("inkonsistensiDokumenAI", `${aiTinggi.length} inkonsistensi tingkat Tinggi ditemukan AI: ${aiTinggi.slice(0, 4).map((it) => `${it.dokumenA} "${it.isiA}" vs ${it.dokumenB} "${it.isiB}"`).join("; ")}${aiTinggi.length > 4 ? "; …" : ""}.`);
    }
  }

  // 9j. CDI — kode yang kemungkinan terlewat (downcoding) / tindakan tanpa indikasi
  notes.push(...deteksiCDI(claim, allClaims));

  // 9. Validasi format/blok ICD-10 (diagnosis utama & sekunder) + cek kategori 3-digit presisi.
  // Kalau kategori presisinya tidak ada di ~1.120 referensi lokal, JANGAN cuma bilang "tidak
  // ditemukan" — pakai deskripsi klinis yang SUDAH ada di data klaim (hasil pembacaan dokumen
  // oleh AI saat upload, hasil analisis klinis AI, atau ketikan manual pengguna) sbg pengganti,
  // supaya pembacaan tetap lengkap tanpa perlu mengarang entri referensi baru yang tidak terverifikasi.
  const dxToCheck = [["Diagnosis utama", claim.primaryDxCode, claim.primaryDxDesc], ...secDx.map((d, i) => [`Dx sekunder #${i + 1}`, d.code, d.desc])];
  dxToCheck.forEach(([label, code, desc]) => {
    if (!code) return;
    const res = findICD10Chapter(code);
    if (!res.valid) {
      notes.push({ id: "icd10FormatInvalid", label: RULE_LABELS.icd10FormatInvalid, detail: `${label} "${code}" tidak sesuai format ICD-10 atau di luar blok kode resmi (WHO ICD-10 2010). Periksa kembali penulisan kode.` });
    } else {
      const cat = findICD10Category3(code);
      if (!cat.known) {
        const d = (desc || "").trim();
        notes.push(d
          ? { id: "icd10CategoryUnknown", label: "Kategori ICD-10 tidak ada di referensi lokal — dilengkapi dari data yang sudah tercatat", detail: `${label} "${code}": kategori 3-digitnya tidak ada di ~1.120 kategori referensi lokal sistem ini (cakupan tidak 100% lengkap), tapi deskripsi klinisnya sudah tercatat dari hasil pembacaan dokumen/analisis: "${d}" — dipakai sbg acuan pengganti. Kode kemungkinan tetap valid; verifikasi manual ke buku ICD-10 tetap dianjurkan untuk kepastian akhir.` }
          : { id: "icd10CategoryUnknown", label: "Kategori ICD-10 tidak ditemukan di referensi", detail: `${label} "${code}": blok babnya benar, tapi kategori 3-digitnya tidak ditemukan pada ~1.120 kategori referensi sistem ini, dan belum ada deskripsi klinis tercatat untuk kode ini. Bisa jadi kode ini tetap valid — verifikasi manual ke buku ICD-10 dianjurkan.` });
      }
    }
  });
  // 10. Validasi kategori ICD-9-CM (prosedur) + cek kode presisi 3-4 digit — pola sama: pakai
  // deskripsi prosedur yang sudah tercatat sbg pengganti kalau kode presisinya tidak ada di referensi.
  procedures.forEach((p, i) => {
    if (!p.code) return;
    const res = findICD9Category(p.code);
    if (!res.valid) {
      notes.push({ id: "icd9CategoryUnknown", label: RULE_LABELS.icd9CategoryUnknown, detail: `Prosedur #${i + 1} "${p.code}" tidak sesuai format kategori ICD-9-CM (2-digit, 00–99). Periksa kembali penulisan kode.` });
    } else {
      const exact = findICD9ProcExact(p.code);
      if (!exact.known) {
        const d = (p.desc || "").trim();
        notes.push(d
          ? { id: "icd9ProcUnknown", label: "Kode prosedur ICD-9-CM tidak ada di referensi lokal — dilengkapi dari data yang sudah tercatat", detail: `Prosedur #${i + 1} "${p.code}": kode presisinya tidak ada di ~3.972 kode referensi lokal, tapi deskripsinya sudah tercatat: "${d}" — dipakai sbg acuan pengganti. Verifikasi manual tetap dianjurkan untuk kepastian akhir.` }
          : { id: "icd9ProcUnknown", label: "Kode prosedur ICD-9-CM tidak ditemukan di referensi", detail: `Prosedur #${i + 1} "${p.code}": kategorinya benar, tapi kode presisinya tidak ditemukan pada ~3.972 kode referensi sistem ini, dan belum ada deskripsi prosedur tercatat untuk kode ini. Bisa jadi tetap valid — verifikasi manual dianjurkan.` });
      }
    }
  });
  // 11. Konsistensi severity level vs suffix kode INA-CBG
  const suf = inacbgSuffix(claim.inacbgCode);
  if (suf && severity && suf !== severity) {
    add("severityCodeMismatch", `Kode INA-CBG "${claim.inacbgCode}" berakhiran -${suf}, namun severity level yang dipilih adalah ${severity}. Kode dan severity level seharusnya konsisten.`);
  }
  // 12. Tarif klaim vs tarif resmi sesuai set tarif RS (tipe, kepemilikan, regional)
  //     + validasi silang jenis rawat (Inap/Jalan) terhadap tabel resmi
  const ref = TARIF_REF_MAP[claim.inacbgCode];
  if (ref) {
    const [, deskripsi, jenisRefRIRJ, k3, k2, k1] = ref;
    const jenisResmi = jenisRefRIRJ === "RJ" ? "Rawat Jalan" : "Rawat Inap";
    if (claim.jenisRawat && claim.jenisRawat !== jenisResmi) {
      add("jenisRawatMismatch", `Klaim ditandai "${claim.jenisRawat}", tapi kode INA-CBG "${claim.inacbgCode}" menurut tabel resmi Permenkes No. 3/2023 termasuk kelompok "${jenisResmi}". Periksa kembali jenis perawatan atau kode INA-CBG-nya.`);
    }
    // Rawat Jalan hanya punya satu tarif (tidak ada pembedaan kelas 1/2/3)
    const official = jenisRefRIRJ === "RJ" ? k3 : (claim.kelasRawat ? { "3": k3, "2": k2, "1": k1 }[claim.kelasRawat] : null);
    if (official && !isNaN(tarif) && !claim.specialCMG && tarif > official * 1.05) {
      add("tariffAboveOfficial", `Tarif klaim Rp${tarif.toLocaleString("id-ID")} melebihi tarif resmi INA-CBG Rp${official.toLocaleString("id-ID")} (${jenisRefRIRJ === "RJ" ? "Rawat Jalan" : `Kelas ${claim.kelasRawat}`}, ${labelTarif()}) untuk "${deskripsi}".`);
    } else if (jenisRefRIRJ !== "RJ" && !claim.kelasRawat) {
      notes.push({ id: "kelasRawatMissing", label: "Kelas rawat belum diisi", detail: "Isi kelas rawat (1/2/3) agar tarif klaim dapat dibandingkan dengan tarif resmi Permenkes No. 3/2023." });
    }
  } else if (claim.inacbgCode) {
    notes.push({ id: "kodeTidakDitemukan", label: "Kode tidak ada di tabel referensi", detail: `Kode INA-CBG "${claim.inacbgCode}" tidak ditemukan pada tabel tarif yang dipakai rumah sakit Anda (${labelTarif()}). Periksa penulisan kode, atau kode termasuk kelompok/regional lain di luar cakupan referensi ini.` });
  } else {
    notes.push({ id: "kodeInacbgKosong", label: "Kode INA-CBG belum diisi", detail: "Klaim ini belum punya kode INA-CBG — biasanya karena diunggah dari SEP/Resume Medis sebelum proses grouping di aplikasi e-Klaim selesai. Lengkapi kode INA-CBG begitu sudah tersedia (edit klaim ini) supaya validasi tarif & severity bisa jalan sepenuhnya." });
  }

  return { flags, notes, score };
}

/* ----------------------------------------------------------------------
   ANALISIS AI — bagian terintegrasi dari alur skrining (bukan fitur terpisah)
---------------------------------------------------------------------- */
// Analisis deskripsi klinis bebas (bahasa dokter) jadi saran koding terstruktur —
// dipakai di Input Manual supaya user bisa tempel/ketik keluhan + pemeriksaan fisik +
// hasil penunjang apa adanya, tanpa perlu tahu kode ICD-10/ICD-9-CM/INA-CBG duluan.
async function analyzeClinicalText(clinicalText, jenisKasus, jenisRawat) {
  const textOut = await aiTeks({ tugas: "analisis_teks", teksKlinis: clinicalText, jenisKasus, jenisRawat }, 4000);
  if (!textOut) throw new Error("Respons AI kosong.");
  const clean = textOut.replace(/```json|```/g, "").trim();
  let result;
  try {
    result = JSON.parse(clean);
  } catch (e) {
    throw new Error("Gagal membaca hasil analisis AI (format tidak sesuai). Coba lagi atau tulis deskripsi lebih jelas.");
  }
  // Kandidat kode INA-CBG dari tabel tarif resmi (lokal, tanpa panggilan AI tambahan) —
  // berdasarkan deskripsi diagnosis paling mungkin yang baru saja disarankan AI.
  // Riwayat klaim nyata RS ini diprioritaskan — kalau ada preseden, jadikan kandidat
  // #1 (ditandai lewat elemen ke-6 array), baru tambah kandidat kata kunci sbg pelengkap.
  // WAJIB ikut cek ada/tidaknya prosedur yang disarankan AI — tarif operasi vs kontrol
  // biasa bisa beda 3-30x lipat utk diagnosis yang sama (lihat catatan di data riwayat).
  const adaProsedurAI = (result.procedures || []).some((p) => (p.code || "").trim());
  const riwayatRS = findRiwayatInacbg(result.primaryDxCode, adaProsedurAI, "3");
  const kandidatKataKunci = findCandidateInacbgCodes(result.primaryDxDesc, 4);
  result.kandidatInacbg = riwayatRS
    ? [[riwayatRS[3], `${riwayatRS[4]} (riwayat RS ini, ${riwayatRS[5]}x preseden)`, "RI", riwayatRS[6], riwayatRS[6], riwayatRS[6]], ...kandidatKataKunci].slice(0, 4)
    : kandidatKataKunci;
  return result;
}



// Tarif resmi dari tabel tarif RS yang login, untuk kode INA-CBG + kelas rawat.
// Rawat jalan hanya punya satu tarif. null = kode tidak ada / tarif tidak tersedia.
function tarifResmiUntuk(kode, kelas) {
  const row = TARIF_REF_MAP[String(kode || "").trim().toUpperCase()];
  if (!row) return null;
  if (row[2] === "RJ") return row[3] || null;
  const k = String(kelas || "3");
  const v = k === "1" ? row[5] : k === "2" ? row[4] : row[3];
  return v || null;
}

// Bukti kriteria gawat darurat (Matriks Penjaminan IGD, BA 3760/2024) yang TERTULIS di
// ringkasan klinis / diagnosis klaim. Dipakai supaya klaim IGD dengan kondisi gawat yang
// terdokumentasi tidak ditandai "belum memenuhi kriteria" hanya karena kotak belum dicentang.
function deteksiGawatDarurat(claim) {
  const teks = String(claim.resumeMedis || "");
  const bukti = [];
  const negasi = (idx) => /(tidak|tanpa|tdk|bukan|disangkal|negatif)\s+(ada\s+)?$/i.test(teks.slice(Math.max(0, idx - 18), idx));
  const kata = [
    [/penurunan kesadaran|tidak sadar|somnolen|sopor|stupor|koma\b|delirium/i, "penurunan kesadaran"],
    [/syok|shock|renjatan/i, "syok"],
    [/henti jantung|cardiac arrest|henti napas|apne(a|u)\b|RJP|resusitasi jantung/i, "henti jantung/napas"],
    [/gagal napas|distres(s)? (napas|pernapasan)|respiratory (failure|distress)|sianosis/i, "gangguan napas"],
    [/kejang|status epileptikus|konvulsi/i, "kejang"],
    [/intubasi|ventilator|ETT\b/i, "tindakan jalan napas segera"],
    [/perdarahan (aktif|masif|intraserebral|intrakranial)|hematemesis|ICH\b/i, "perdarahan berat"],
    [/STEMI|infark miokard akut/i, "sindrom koroner akut"],
  ];
  kata.forEach(([re, nama]) => {
    const m = re.exec(teks);
    if (m && !negasi(m.index)) bukti.push(nama);
  });
  const gcs = teks.match(/GCS\s*[:=]?\s*(\d{1,2})(?!\d)/i) || teks.match(/GCS\s*[:=]?\s*E\s*(\d)\s*[VM]?\s*(\d)\s*[VM]?\s*(\d)/i);
  if (gcs) {
    const nilai = gcs.length > 2 ? Number(gcs[1]) + Number(gcs[2]) + Number(gcs[3]) : Number(gcs[1]);
    if (nilai >= 3 && nilai < 15 && !bukti.includes("penurunan kesadaran")) bukti.push(`penurunan kesadaran (GCS ${nilai})`);
  }
  const spo2 = teks.match(/(SpO2|SaO2|saturasi(\s+oksigen)?|sat\.?\s*O2)\s*[:=]?\s*(\d{2,3})\s*%?/i);
  if (spo2 && Number(spo2[3]) < 90) bukti.push(`hipoksemia (SpO2 ${spo2[3]}%)`);
  const td = teks.match(/(TD|tekanan darah)\s*[:=]?\s*(\d{2,3})\s*\/\s*\d{2,3}/i);
  if (td && Number(td[2]) < 90) bukti.push(`hipotensi (TD ${td[2]}/…)`);
  const dx = [claim.primaryDxCode, ...(claim.secondaryDx || []).map((d) => d.code)].map((c) => String(c || "").toUpperCase());
  if (dx.some((c) => /^(I46|R57|J96\.0|J80|R40\.2|I21|I6[0-2]|G41|T78\.2|R65\.1|E1[0-4]\.0|E1[0-4]\.1|O15)/.test(c))) bukti.push("diagnosis kegawatan (kode ICD-10)");
  return [...new Set(bukti)];
}

async function runClaimAI(claim, allClaims) {
  const officialRef = TARIF_REF_MAP[claim.inacbgCode];
  const officialDesc = officialRef ? officialRef[1] : null;
  const dxCatTitle = (() => {
    const cat = findICD10Category3(claim.primaryDxCode);
    return cat.known ? cat.title : null;
  })();
  const kodeKosong = !claim.inacbgCode || !claim.inacbgCode.trim();
  const candidates = kodeKosong ? findCandidateInacbgCodes(claim.primaryDxDesc) : [];

  // Riwayat klaim NYATA RS ini (49.012 klaim tervalidasi, hasil grouper e-Klaim
  // sungguhan Jan-Juli 2026) — sumber PALING otoritatif utk saran kode, di atas
  // kandidat kata kunci maupun riwayat 1 pasien perorangan di bawah ini. WAJIB
  // ikut cek ada/tidaknya prosedur — tarif operasi vs kontrol biasa beda jauh.
  const adaProsedurKlaim = (claim.procedures || []).some((p) => (p.code || "").trim());
  const riwayatRS = kodeKosong ? findRiwayatInacbg(claim.primaryDxCode, adaProsedurKlaim, claim.kelasRawat) : null;

  // Riwayat pasien ini SENDIRI di sistem kita — kalau pernah masuk sebelumnya dengan
  // diagnosis utama yang sama, kode INA-CBG yang dipakai waktu itu adalah petunjuk kuat
  // (bukan jaminan pasti, karena kondisi klinis bisa beda tiap episode).
  // Seluruh episode lain pasien ini (bukan cuma yang diagnosisnya sama) — dasar
  // rekomendasi diagnosis yang sesuai RIWAYAT pasien (kondisi kronis, kontrol ulang).
  const riwayatEpisodeLain = (allClaims || [])
    .filter((c) => c.id !== claim.id && c.noRM && claim.noRM && c.noRM === claim.noRM)
    .sort((a, b) => String(b.tglMasuk || "").localeCompare(String(a.tglMasuk || "")))
    .slice(0, 6)
    .map((c) => `${c.tglMasuk || "?"} ${c.jenisRawat || ""}: utama ${c.primaryDxCode || "-"}${(c.secondaryDx || []).length ? `, sekunder ${(c.secondaryDx || []).map((d) => d.code).join("/")}` : ""}${(c.procedures || []).length ? `, prosedur ${(c.procedures || []).map((p) => p.code).join("/")}` : ""}${c.inacbgCode ? `, ${c.inacbgCode}` : ""}`)
    .join("; ");
  const temuanCDI = (claim.notes || []).filter((n) => String(n.id || "").indexOf("cdi") === 0).map((n) => n.label).join("; ");

  const riwayatPasien = (allClaims || []).filter((c) =>
    c.id !== claim.id && c.noRM && claim.noRM && c.noRM === claim.noRM &&
    c.inacbgCode && (c.primaryDxCode || "").trim().toUpperCase() === (claim.primaryDxCode || "").trim().toUpperCase()
  ).slice(0, 3);

  // Instruksi AI (persona, batasan anti-upcoding, kaidah koding, KNS, pola pending &
  // profil RS, struktur jawaban) disusun di SERVER (Edge Function skrining-ai).

  // Blok DINAMIS — beda tiap klaim, TIDAK di-cache
  const claimData = `Data klaim:
- Jenis Perawatan: ${claim.jenisRawat || "Rawat Inap"}
- Diagnosis utama: ${claim.primaryDxCode} - ${claim.primaryDxDesc}${dxCatTitle ? ` (kategori ICD-10 resmi: ${dxCatTitle})` : ""}
- Diagnosis sekunder: ${(claim.secondaryDx || []).map((d) => `${d.code} (${d.desc})`).join("; ") || "tidak ada"}
- Prosedur: ${(claim.procedures || []).map((p) => `${p.code} (${p.desc})`).join("; ") || "tidak ada"}
- Kode INA-CBG: ${kodeKosong ? "BELUM DIISI" : claim.inacbgCode}${officialDesc ? ` — deskripsi RESMI menurut tabel tarif Permenkes No. 3/2023: "${officialDesc}"` : (!kodeKosong ? " (kode tidak ditemukan di tabel tarif referensi sistem)" : "")}${(() => { const tl = !kodeKosong && cekKodeVsRiwayat(claim); return tl ? `\n- Pemeriksaan otomatis kode vs pola grouping: ${tl.ringkas}` : ""; })()}
${kodeKosong && riwayatRS && riwayatRS[7] === "acuan" ? `- Pola grouping acuan sistem (data historis grouper e-Klaim sungguhan, ${riwayatRS[5]}x preseden di RS rujukan — logika grouper INA-CBG berlaku nasional; PALING otoritatif karena riwayat RS ini sendiri belum mencakup diagnosis ini; ${adaProsedurKlaim ? "dengan" : "tanpa"} prosedur): kode "${riwayatRS[3]}" (${riwayatRS[4]}) paling sering dipakai utk diagnosis "${claim.primaryDxCode}" di Kelas ${riwayatRS[2]}${riwayatRS[6] ? `, tarif resmi RS ini Rp${Number(riwayatRS[6]).toLocaleString("id-ID")}` : ""}\n` : ""}${kodeKosong && riwayatRS && riwayatRS[7] !== "acuan" ? `- Riwayat klaim RS ini (data historis, PALING otoritatif — ${riwayatRS[5]}x preseden nyata${RIWAYAT_INFO.periode ? " " + RIWAYAT_INFO.periode : ""}, ${adaProsedurKlaim ? "dengan" : "tanpa"} prosedur): kode "${riwayatRS[3]}" (${riwayatRS[4]}) paling sering dipakai utk diagnosis "${claim.primaryDxCode}" di Kelas ${riwayatRS[2]}, tarif median Rp${Number(riwayatRS[6]).toLocaleString("id-ID")}\n` : ""}${kodeKosong && riwayatPasien.length > 0 ? `- Riwayat pasien ini di sistem (episode sebelumnya dgn diagnosis utama sama, No. RM ${claim.noRM}): ${riwayatPasien.map((c) => `kode "${c.inacbgCode}" dipakai pada ${c.tglMasuk || "?"} (severity ${c.severityLevel}, LOS ${c.los} hari, tarif waktu itu Rp${parseAngka(c.tarifKlaim).toLocaleString("id-ID")})`).join("; ")}\n` : ""}${kodeKosong && candidates.length > 0 ? `- Kandidat kode dari tabel tarif resmi (berdasarkan kemiripan kata kunci diagnosis, BUKAN hasil grouper — cuma bahan pertimbangan; tarif ditampilkan sesuai Kelas Rawat pasien = Kelas ${claim.kelasRawat || "3"}): ${candidates.map((c) => {
    const jenisRefRIRJ = c[2];
    const tarifPerKelas = jenisRefRIRJ === "RJ" ? c[3] : { "3": c[3], "2": c[4], "1": c[5] }[claim.kelasRawat || "3"];
    return `${c[0]} = "${c[1]}"${tarifPerKelas ? ` (perkiraan tarif Rp${Number(tarifPerKelas).toLocaleString("id-ID")})` : ""}`;
  }).join("; ")}\n` : ""}- Severity: ${claim.severityLevel}${claim.jenisRawat === "Rawat Jalan" ? " (tidak relevan utk rawat jalan)" : ""}, Jenis kasus: ${claim.jenisKasus}, Kelas rawat: ${claim.kelasRawat}
- Lama rawat: ${claim.los} hari, Tarif klaim: Rp${parseAngka(claim.tarifKlaim).toLocaleString("id-ID")}
- DPJP: ${claim.dpjp || "(tidak diisi)"}
- Ringkasan resume medis (resume/CPPT/lab/AGD/radiologi dari berkas): ${claim.resumeMedis || "(tidak dilampirkan)"}
- Cara pulang: ${claim.caraPulang || "(tidak tercatat)"}
- Tagihan riil RS (billing): ${claim.tarifRS ? "Rp" + Number(String(claim.tarifRS).replace(/\D/g, "")).toLocaleString("id-ID") : "(tidak tercatat)"}
- Skor aturan administratif otomatis (BUKAN penilaian klinis): ${claim.score} (${claim.riskLevel})
- Penanda skrining otomatis yang terpicu: ${(claim.flags || []).map((f) => f.label).join("; ") || "tidak ada"}
- Riwayat episode lain pasien ini di sistem (No. RM sama): ${riwayatEpisodeLain || "tidak ada"}
- Temuan CDI otomatis (kode yang mungkin terlewat — tetap verifikasi ke data tertulis): ${temuanCDI || "tidak ada"}`;

  let text = await aiTeks({ tugas: "analisis_klaim", varian: kodeKosong ? "kode_kosong" : "normal", dataKlaim: claimData }, 8000);
  if (!text) {
    throw new Error("Respons AI kosong. Coba klik \"Analisis ulang\" — biasanya berhasil di percobaan berikutnya.");
  }
  // Pengaman: kalau ternyata masih berhenti sebelum baris Rekomendasi (mis. karena
  // model memotong sendiri), tandai jelas supaya pengguna tahu perlu jalankan ulang.
  if (!/Rekomendasi:/i.test(text)) {
    text += "\n\n_(Catatan: respons AI tampak terpotong sebelum baris Rekomendasi. Klik \"Analisis ulang\" untuk mencoba lagi.)_";
  }
  return text;
}

function RiskBadge({ level }) {
  const map = {
    Tinggi: { bg: "#FCE9E7", fg: "#B3261E", icon: ShieldAlert },
    Sedang: { bg: "#FCF1DD", fg: "#9A6300", icon: ShieldQuestion },
    "Belum Lengkap": { bg: "#F0F3F5", fg: "#5B6B76", icon: ShieldQuestion },
    Rendah: { bg: "#E4F3EC", fg: "#1E6B4C", icon: ShieldCheck },
  };
  const s = map[level] || map.Rendah;
  const Icon = s.icon;
  return (
    <span style={{ background: s.bg, color: s.fg }} className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold whitespace-nowrap">
      <Icon size={13} /> {level}
    </span>
  );
}

function AiStatusIcon({ status }) {
  if (status === "loading") return <Loader2 size={15} className="text-[#0B7285] animate-spin" title="Sedang dianalisis AI" />;
  if (status === "done") return <Sparkles size={15} className="text-[#0B7285]" title="Sudah dianalisis AI" />;
  if (status === "error") return <AlertTriangle size={15} className="text-[#B3261E]" title="Analisis AI gagal" />;
  return <span className="text-[#DCE3E7] text-xs" title="Belum dianalisis AI">—</span>;
}

function FlagFingerprint({ flags }) {
  // 4 indikator tahap verifikasi (Administrasi/Kode/Medis/Pola Sistemik) — lebih
  // ringkas & bermakna daripada daftar titik per-aturan, konsisten dgn pipeline
  // di Detail Modal.
  const stageKeys = Object.keys(STAGE_LABELS);
  const triggeredStages = new Set(flags.map((f) => f.stage).filter(Boolean));
  return (
    <div className="flex gap-1" title={`${flags.length} penanda terpicu`}>
      {stageKeys.map((s) => (
        <div key={s} title={STAGE_LABELS[s]} style={{ width: 8, height: 8, borderRadius: "50%", background: triggeredStages.has(s) ? "#B3261E" : "#DCE3E7" }} />
      ))}

    </div>
  );
}

function Section({ title, subtitle, children, right }) {
  return (
    <div className="bg-white rounded-xl border border-[#E2E8ED] p-5 sm:p-6">
      <div className="flex items-start justify-between mb-4 gap-3 flex-wrap">
        <div>
          <h2 style={{ fontFamily: "'Space Grotesk',sans-serif" }} className="text-lg font-semibold text-[#0F2A3D]">{title}</h2>
          {subtitle && <p className="text-sm text-[#5B6B76] mt-0.5">{subtitle}</p>}
        </div>
        {right}
      </div>
      {children}
    </div>
  );
}

function TextField({ label, value, onChange, placeholder, type = "text", mono = false, required }) {
  return (
    <label className="block">
      <span className="block text-xs font-medium text-[#5B6B76] mb-1">{label} {required && <span className="text-[#B3261E]">*</span>}</span>
      <input type={type} value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder}
        className={`w-full rounded-lg border border-[#D7DEE3] px-3 py-2 text-sm text-[#0F2A3D] focus:outline-none focus:ring-2 focus:ring-[#0B7285]/40 focus:border-[#0B7285] ${mono ? "font-mono" : ""}`} />
    </label>
  );
}

function SelectField({ label, value, onChange, options, required }) {
  return (
    <label className="block">
      <span className="block text-xs font-medium text-[#5B6B76] mb-1">{label} {required && <span className="text-[#B3261E]">*</span>}</span>
      <select value={value} onChange={(e) => onChange(e.target.value)}
        className="w-full rounded-lg border border-[#D7DEE3] px-3 py-2 text-sm text-[#0F2A3D] bg-white focus:outline-none focus:ring-2 focus:ring-[#0B7285]/40 focus:border-[#0B7285]">
        {options.map((o) => <option key={o.value ?? o} value={o.value ?? o}>{o.label ?? o}</option>)}
      </select>
    </label>
  );
}

const SPECIAL_CMG_OPTIONS = ["special procedure", "special drugs", "special investigation", "special prosthesis", "subacute cases", "chronic cases"];

function emptyClaim() {
  return {
    id: crypto.randomUUID(),
    noRM: "", namaPasien: "", dpjp: "",
    tglMasuk: "", tglKeluar: "", los: "",
    primaryDxCode: "", primaryDxDesc: "",
    secondaryDx: [], procedures: [],
    inacbgCode: "", severityLevel: "I", jenisKasus: "Medis", jenisRawat: "Rawat Inap", kelasRawat: "3",
    tarifKlaim: "", buktiPenunjang: false,
    specialCMG: false, specialCMGKategori: SPECIAL_CMG_OPTIONS[0],
    resumeMedis: "", sep: null, aiStatus: "idle", aiAnalysis: "",
    // Field SEP (opsional) — diisi manual bila ingin kelengkapan SEP ikut diskrining
    sepNoSep: "", sepTglSep: "", sepNoKartu: "", sepSubSpesialis: "", sepFaskesPerujuk: "",
    sepDiagnosaAwal: "", sepJenisKunjungan: "", sepPoliPerujuk: "", sepKelasHak: "",
    sepPenjamin: "", sepNoTelepon: "", sepCatatan: "",
    // Field IGD (opsional) — isi bila episode berasal dari IGD, dicek terhadap Matriks
    // Ketentuan Penjaminan & Penagihan Klaim IGD (Lampiran BA Kemenkes-BPJS No. 3760/2024)
    dariIGD: false, igdKriteriaGawatDarurat: false, igdDirujuk: false, igdLosJam: "",
    confirmedSeparateEpisodes: [],
  };
}

function InputManual({ onAdd }) {
  const [claim, setClaim] = useState(emptyClaim());
  const set = (field) => (val) => setClaim((c) => ({ ...c, [field]: val }));
  const tarifOtomatis = useRef(true);
  const setKodeKelas = (field) => (val) => setClaim((c) => {
    const baru = { ...c, [field]: field === "inacbgCode" ? String(val).toUpperCase() : val };
    const t = tarifResmiUntuk(baru.inacbgCode, baru.kelasRawat);
    if (t && (tarifOtomatis.current || !parseAngka(c.tarifKlaim))) { baru.tarifKlaim = String(t); tarifOtomatis.current = true; }
    return baru;
  });

  // Bantuan AI: analisis deskripsi klinis bebas jadi saran koding
  const [clinicalText, setClinicalText] = useState("");
  const [analyzing, setAnalyzing] = useState(false);
  const [analysisResult, setAnalysisResult] = useState(null);
  const [analysisError, setAnalysisError] = useState("");

  const handleAnalyze = async () => {
    if (!clinicalText.trim()) return;
    setAnalyzing(true); setAnalysisError(""); setAnalysisResult(null);
    try {
      const result = await analyzeClinicalText(clinicalText, claim.jenisKasus, claim.jenisRawat);
      setAnalysisResult(result);
    } catch (e) {
      setAnalysisError(e && e.message ? e.message : "Gagal menganalisis. Coba lagi.");
    }
    setAnalyzing(false);
  };

  const terapkanAnalisis = () => {
    if (!analysisResult) return;
    setClaim((c) => ({
      ...c,
      primaryDxCode: analysisResult.primaryDxCode || c.primaryDxCode,
      primaryDxDesc: analysisResult.primaryDxDesc || c.primaryDxDesc,
      secondaryDx: (analysisResult.secondaryDx && analysisResult.secondaryDx.length > 0) ? analysisResult.secondaryDx : c.secondaryDx,
      procedures: (analysisResult.procedures && analysisResult.procedures.length > 0) ? analysisResult.procedures : c.procedures,
      severityLevel: analysisResult.severityLevel || c.severityLevel,
      resumeMedis: c.resumeMedis || clinicalText,
    }));
  };

  useEffect(() => {
    const d = losBetween(claim.tglMasuk, claim.tglKeluar);
    if (d !== null && d >= 0) setClaim((c) => ({ ...c, los: String(d) }));
  }, [claim.tglMasuk, claim.tglKeluar]);

  const addRow = (field) => setClaim((c) => ({ ...c, [field]: [...c[field], { code: "", desc: "" }] }));
  const updateRow = (field, idx, key, val) => setClaim((c) => {
    const rows = [...c[field]]; rows[idx] = { ...rows[idx], [key]: val }; return { ...c, [field]: rows };
  });
  const removeRow = (field, idx) => setClaim((c) => ({ ...c, [field]: c[field].filter((_, i) => i !== idx) }));

  // Kode INA-CBG & tarif SERING memang belum ada saat input manual (mis. klaim baru
  // berisi SEP + diagnosis, belum di-grouping lewat e-Klaim) — jangan wajibkan, sama
  // seperti kebijakan yang sudah berlaku di alur unggah dokumen. Cukup No. RM &
  // diagnosis utama sebagai syarat minimum yang benar-benar wajib.
  const canSubmit = claim.noRM && claim.primaryDxCode;
  // Untuk input manual, sembunyikan peringatan "field kosong" (sudah ditandai * wajib diisi)
  // — pengaman di sini fokus pada nilai yang SUDAH diisi tapi tidak wajar (tanggal, LOS, tarif).
  const sanityWarnings = useMemo(
    () => sanityCheckClaim(claim).filter((w) => !["sanityNoRM", "sanityDxKosong", "sanityTarifKosong"].includes(w.id)),
    [claim]
  );

  return (
    <div className="space-y-5">
      <Section title="✨ Bantuan AI: Analisis dari Deskripsi Klinis" subtitle="Tempel/ketik keluhan, pemeriksaan fisik, & hasil penunjang bahasa dokter apa adanya — AI akan menguraikannya jadi saran koding">
        <textarea value={clinicalText} onChange={(e) => setClinicalText(e.target.value)} rows={5}
          placeholder="Contoh: Pasien datang dengan keluhan demam 3 hari, mual (+), nyeri ulu hati (+). Suhu 38.3, nadi 104, RR 22, SpO2 96%. Lab: leukosit 5.300, trombosit 297.000. Ro thorax: pulmo normal. Diagnosis: viral infection..."
          className="w-full rounded-lg border border-[#D7DEE3] px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#0B7285]/40" />
        <div className="flex items-center gap-3 mt-3">
          <button onClick={handleAnalyze} disabled={analyzing || !clinicalText.trim()}
            className="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-lg bg-[#0F2A3D] text-white text-sm font-semibold disabled:opacity-40 disabled:cursor-not-allowed hover:bg-[#1a3d55]">
            {analyzing ? <Loader2 size={15} className="animate-spin" /> : <Sparkles size={15} />} {analyzing ? "Menganalisis..." : "Analisis dengan AI"}
          </button>
        </div>
        {analysisError && (
          <div className="mt-3 text-xs bg-[#FCE9E7] text-[#B3261E] rounded-lg p-2.5"><p className="font-medium">Gagal menganalisis:</p><p className="mt-1 font-mono break-words">{analysisError}</p></div>
        )}
        {analysisResult && (
          <div className="mt-3 bg-[#F4F9FA] border border-[#CFE4E8] rounded-lg p-3.5 space-y-3">
            {analysisResult.tingkatKepastian && (
              <div className={`text-xs font-medium rounded-lg px-2.5 py-1.5 inline-flex items-center gap-1.5 ${analysisResult.tingkatKepastian === "Rendah" ? "bg-[#FBF8F0] text-[#9A6300]" : analysisResult.tingkatKepastian === "Sedang" ? "bg-[#F4F9FA] text-[#0B7285]" : "bg-[#E4F3EC] text-[#1E6B4C]"}`}>
                Tingkat kepastian: {analysisResult.tingkatKepastian}{analysisResult.tingkatKepastian === "Rendah" ? " — cuma dari keluhan & tanda vital, wajib pemeriksaan lanjutan" : ""}
              </div>
            )}
            <div className="grid sm:grid-cols-2 gap-3 text-sm">
              <div><p className="text-xs text-[#94A3AC]">Diagnosis Utama (kandidat paling mungkin)</p><p className="font-mono font-medium">{analysisResult.primaryDxCode}</p><p className="text-xs text-[#5B6B76]">{analysisResult.primaryDxDesc}</p></div>
              <div><p className="text-xs text-[#94A3AC]">Severity (saran)</p><p className="font-medium">{analysisResult.severityLevel}</p><p className="text-xs text-[#5B6B76]">{analysisResult.severityAlasan}</p></div>
            </div>
            {analysisResult.diagnosisBanding && analysisResult.diagnosisBanding.length > 0 && (

          // Versi PRESISI: ikut mempertimbangkan ADA/TIDAKNYA PROSEDUR (paling menentukan —
          // tarif operasi vs kontrol biasa bisa beda 3-30x lipat utk diagnosis yang sama,
