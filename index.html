// Muat pdf.js dari CDN untuk ekstraksi teks PDF di sisi browser
function loadPdfLib() {
  if (window.PDFLib) return Promise.resolve(window.PDFLib);
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js";
    script.onload = () => resolve(window.PDFLib);
    script.onerror = () => reject(new Error("Gagal memuat pustaka pemangkas PDF."));
    document.head.appendChild(script);
  });
}

// Pangkas PDF jadi cuma N halaman pertama — dipakai otomatis utk dokumen besar/panjang
// (mis. berkas klaim yg tergabung dgn laporan billing panjang) SEBELUM dikirim ke AI,
// supaya file yg dikirim tetap kecil & bisa lewat jalur dokumen PDF native yg andal,
// tanpa perlu pengguna memisahkan halaman secara manual.
async function trimPdfToFirstPages(file, maxPages) {
  const PDFLib = await loadPdfLib();
  const bytes = await file.arrayBuffer();
  const srcDoc = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });
  const totalPages = srcDoc.getPageCount();
  const pagesToCopy = Math.min(maxPages, totalPages);
  const newDoc = await PDFLib.PDFDocument.create();
  const indices = Array.from({ length: pagesToCopy }, (_, i) => i);
  const copiedPages = await newDoc.copyPages(srcDoc, indices);
  copiedPages.forEach((p) => newDoc.addPage(p));
  const newBytes = await newDoc.save();
  return { blob: new Blob([newBytes], { type: "application/pdf" }), totalPages, pagesCopied: pagesToCopy };
}

function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    script.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      resolve(window.pdfjsLib);
    };
    script.onerror = () => reject(new Error("Gagal memuat pustaka pembaca PDF."));
    document.head.appendChild(script);
  });
}

async function extractPdfText(file) {
  const pdfjsLib = await loadPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = "";
  const maxPages = Math.min(pdf.numPages, 60); // batas wajar per unggahan
  const pageTexts = [];
  const imagePages = []; // index 0-based halaman yg isinya (sebagian besar) GAMBAR hasil scan
  const OPS = pdfjsLib.OPS || {};
  const opGambar = [OPS.paintImageXObject, OPS.paintJpegXObject, OPS.paintInlineImageXObject, OPS.paintImageXObjectRepeat].filter((x) => x !== undefined);
  for (let i = 1; i <= maxPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    // Susun ulang per BARIS berdasarkan posisi vertikal (bukan urutan acak di file),
    // supaya label & nilainya tetap sebaris — mis. "No. SEP : 0169R0100826V000596"
    // di form SEP 2 kolom tidak tercampur dengan isi kolom sebelahnya.
    const baris = [];
    content.items.forEach((it) => {
      if (!it.str || !it.str.trim()) return;
      const y = it.transform ? it.transform[5] : 0;
      const x = it.transform ? it.transform[4] : 0;
      let b = baris.find((row) => Math.abs(row.y - y) <= 3);
      if (!b) { b = { y, items: [] }; baris.push(b); }
      b.items.push({ x, s: it.str });
    });
    baris.sort((a, b) => b.y - a.y);
    const pageText = baris.map((b) => b.items.sort((p, q) => p.x - q.x).map((p) => p.s).join("  ")).join("\n");
    pageTexts.push(pageText);
    // Deteksi halaman bergambar BESAR (hasil scan/foto — mis. SEP yang discan) —
    // logo kecil di kop surat diabaikan.
    let adaGambarBesar = false;
    try {
      const ops = await page.getOperatorList();
      for (let k = 0; k < ops.fnArray.length; k++) {
        if (!opGambar.includes(ops.fnArray[k])) continue;
        const a = ops.argsArray[k] || [];
        const w = Number(a[1]) || (a[0] && a[0].width) || 0;
        const h = Number(a[2]) || (a[0] && a[0].height) || 0;
        if (w * h >= 300000) { adaGambarBesar = true; break; }
      }
    } catch (e) { /* abaikan — cukup pakai deteksi teks */ }
    if (pageText.replace(/\s/g, "").length < 30 || adaGambarBesar) imagePages.push(i - 1);
    text += `\n\n=== Halaman ${i} ===\n${pageText}`;
  }
  return { text: text.trim(), pages: pdf.numPages, pagesRead: maxPages, pageTexts, imagePages };
}

// Untuk PDF hasil pindai/foto (tidak ada lapisan teks): render tiap halaman jadi
// gambar, lalu kirim ke AI vision untuk "dibaca" langsung — berfungsi sebagai OCR.
async function pdfPagesToImages(file, maxPages = 8, scale = 2, pageOffset = 0) {
  const pdfjsLib = await loadPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const startPage = 1 + pageOffset;
  const endPage = Math.min(pdf.numPages, pageOffset + maxPages);
  const images = [];
  for (let i = startPage; i <= endPage; i++) {
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement("canvas");
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    const ctx = canvas.getContext("2d");
    await page.render({ canvasContext: ctx, viewport }).promise;
    const dataUrl = canvas.toDataURL("image/jpeg", 0.94);
    images.push(dataUrl.split(",")[1]); // buang prefix "data:image/jpeg;base64,"
  }
  return { images, pages: pdf.numPages, pagesRead: endPage - startPage + 1 };
}

// Pangkas PDF ke daftar halaman TERTENTU (0-based) — dipakai utk dokumen panjang
// supaya yang dikirim ke AI cuma halaman relevan (SEP, Berkas Klaim, Resume, hasil scan).
async function trimPdfToPages(file, indices) {
  const PDFLib = await loadPdfLib();
  const srcDoc = await PDFLib.PDFDocument.load(await file.arrayBuffer(), { ignoreEncryption: true });
  const total = srcDoc.getPageCount();
  const valid = indices.filter((i) => i >= 0 && i < total);
  const newDoc = await PDFLib.PDFDocument.create();
  const copied = await newDoc.copyPages(srcDoc, valid);
  copied.forEach((p) => newDoc.addPage(p));
  const bytes = await newDoc.save();
  return { blob: new Blob([bytes], { type: "application/pdf" }), totalPages: total, pagesCopied: valid.length };
}

// Pilih halaman paling relevan dari PDF panjang: halaman pertama, halaman berkata
// kunci (SEP/Berkas Klaim/Resume), lalu halaman GAMBAR hasil scan (yang tak bisa
// dibaca jalur teks) — maksimal maxHal halaman, urutan asli dipertahankan.
function pilihHalamanPenting(info, maxHal) {
  // Prioritas: halaman 1 → dokumen kunci (SEP/berkas klaim/resume/CPPT/triase/AGD/
  // radiologi) → halaman GAMBAR hasil scan (isinya tak terbaca jalur teks) → 2 halaman
  // terakhir (biasanya billing) → halaman teks lain (mis. puluhan hasil gula darah
  // berulang — teksnya tetap ikut terkirim lewat lapisan teks digital).
  const kunciUtama = /ELEGIBILITAS|No\.?\s*SEP|Nomor\s*SEP|Berkas\s+Klaim|Hasil\s+Grouping|RESUME|Ringkasan\s+Pulang|S\.?O\.?A\.?P|CPPT|TRIASE|LAPORAN\s+(OPERASI|TINDAKAN)|GAS\s+DARAH|RADIOLOGI/i;
  const kunciLain = /LABORATORIUM|THORAX|BILLING|RINCIAN\s+BIAYA|Rekam\s+Medis/i;
  const utama = info.pageTexts.map((t, i) => (kunciUtama.test(t) ? i : -1)).filter((i) => i >= 0);
  const lain = info.pageTexts.map((t, i) => (kunciLain.test(t) ? i : -1)).filter((i) => i >= 0);
  const akhir = [info.pages - 2, info.pages - 1].filter((i) => i >= 0);
  // Scan MURNI (tanpa teks sama sekali) didahulukan — halaman yg punya teks digital
  // + gambar latar tetap terbaca lewat teks pelengkap, jadi bisa menyusul belakangan.
  const scanMurni = info.imagePages.filter((i) => !info.pageTexts[i] || info.pageTexts[i].replace(/\s/g, "").length < 30);
  const urut = [];
  [0, ...utama, ...scanMurni, ...akhir, ...info.imagePages, ...lain].forEach((i) => { if (!urut.includes(i)) urut.push(i); });
  return urut.slice(0, maxHal).sort((a, b) => a - b);
}

// Foto dari HP sering >5MB (batas per gambar API) atau berformat yang tidak didukung
// API — normalkan dulu di browser: ubah ke JPEG, sisi terpanjang maks 2000px (masih
// sangat tajam utk dibaca, jauh di bawah batas ukuran).
// Render halaman TERTENTU (0-based) jadi gambar JPEG ringan — dipakai bila PDF hasil
// pangkas tetap kebesaran (scan resolusi tinggi), supaya halaman penting tetap terbaca.
async function pdfPagesToImagesByIndex(file, indices, maxSisi = 1400, kualitas = 0.75) {
  const pdfjsLib = await loadPdfJs();
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const images = [];
  for (const i of indices) {
    if (i < 0 || i >= pdf.numPages) continue;
    const page = await pdf.getPage(i + 1);
    const v1 = page.getViewport({ scale: 1 });
    const scale = Math.min(2, maxSisi / Math.max(v1.width, v1.height));
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(viewport.width);
    canvas.height = Math.round(viewport.height);
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport }).promise;
    images.push(canvas.toDataURL("image/jpeg", kualitas).split(",")[1]);
  }
  return images;
}

async function normalizeImageForAI(file, maxSisi = 2000) {
  const dataUrl = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error("Gagal membaca file gambar."));
    r.readAsDataURL(file);
  });
  const img = await new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => rej(new Error("Format gambar ini tidak bisa dibuka browser (mis. HEIC dari iPhone). Ubah dulu ke JPG/PNG — di iPhone: Pengaturan → Kamera → Format → \"Paling Kompatibel\", atau kirim lewat screenshot."));
    im.src = dataUrl;
  });
  const skala = Math.min(1, maxSisi / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.round(img.naturalWidth * skala));
  canvas.height = Math.max(1, Math.round(img.naturalHeight * skala));
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  let kualitas = 0.9;
  let out = canvas.toDataURL("image/jpeg", kualitas);
  while (out.length > 4.5 * 1024 * 1024 * 1.37 && kualitas > 0.5) {
    kualitas -= 0.1;
    out = canvas.toDataURL("image/jpeg", kualitas);
  }
  return out.split(",")[1];
}

// Nama file sering memuat No. SEP (mis. "0169R0180526V000405_TARSO.pdf") — ganti
// pemisah jadi spasi supaya pola nomor di dalamnya bisa dikenali.
function namaUntukPola(file) {
  return String((file && file.name) || "").replace(/[_\-.]+/g, " ");
}

// Pengaman DETERMINISTIK (tanpa AI): cari pola baku No. SEP, No. Kartu, Tgl. SEP &
// No. RM langsung dari teks dokumen / nama file / jawaban AI. Dipakai mengisi field
// yang kosong — atau mengoreksi No. SEP yang salah baca AI — selama polanya tunggal
// & tidak ambigu.
// Format No. SEP BPJS: 8 karakter kode faskes (mis. 0169R010) + 4 digit bulan-tahun
// + huruf V + 6 digit urut → 19 karakter, mis. 0169R0100826V000596.
function cariPolaSep(teks) {
  const t = String(teks || "");
  const semuaSep = Array.from(new Set((t.match(/\b\d{4}[A-Z]\d{3}\d{4}V\d{6}\b/gi) || []).map((s) => s.toUpperCase())));
  const ambil = (re) => { const m = t.match(re); return m ? m[1].trim() : ""; };
  return {
    noSep: semuaSep.length === 1 ? semuaSep[0] : "",
    noKartu: ambil(/(?:No\.?\s*Kartu|Nomor\s*Peserta|No\.?\s*Peserta)\s*:?\s*(\d{13})\b/i),
    tglSep: ambil(/Tgl\.?\s*SEP\s*:?\s*(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4})/i),
    noRM: ambil(/(?:\(\s*MR\s*:?\s*|Nomor\s+Rekam\s+Medis\s*:?\s*|No\.?\s*(?:Rekam\s*Medis|RM)\s*:?\s*)(\d{3,10})\b/i),
    adaHalamanSep: /ELEGIBILITAS\s+PESERTA/i.test(t),
  };
}

// Jawaban AI kadang terselip kalimat pembuka/penutup, atau koma menggantung —
// jangan langsung gagal, ambil bagian JSON-nya saja.
function parseJsonLonggar(teks) {
  const t = String(teks || "").replace(/```json|```/g, "").trim();
  try { return JSON.parse(t); } catch (e) { /* lanjut ke cara longgar */ }
  const awal = t.search(/[\[{]/);
  const akhir = Math.max(t.lastIndexOf("]"), t.lastIndexOf("}"));
  if (awal >= 0 && akhir > awal) {
    const potong = t.slice(awal, akhir + 1);
    try { return JSON.parse(potong); } catch (e) { /* lanjut */ }
    try { return JSON.parse(potong.replace(/,\s*([}\]])/g, "$1")); } catch (e) { /* lanjut */ }
  }
  throw new Error("Jawaban AI bukan JSON yang valid (kemungkinan terpotong atau terselip teks lain). Coba unggah ulang file ini.");
}

  const parsePipe = (s) => (s || "").split("|").filter(Boolean).map((pair) => {

  });

  const rowsToClaims = (rows, petunjuk = null) => rows.map((r) => {

    const tglKeluar = String(r.tgl_keluar || "").slice(0, 10);
    const los = losBetween(tglMasuk, tglKeluar);
    const kodeInacbg = String(r.kode_inacbg || "");
    // Tentukan jenis rawat: pakai yang eksplisit dari dokumen bila ada, kalau tidak
    // coba deteksi otomatis dari tabel tarif resmi (kode RJ selalu berakhiran -0).
    let jenisRawat = String(r.jenis_rawat || "").trim();
    if (jenisRawat !== "Rawat Inap" && jenisRawat !== "Rawat Jalan") {
      const ref = TARIF_REF_RAW.find((row) => row[0] === kodeInacbg);
      jenisRawat = ref ? (ref[2] === "RJ" ? "Rawat Jalan" : "Rawat Inap") : "Rawat Inap";
    }
    // Data SEP (untuk cek kelengkapan administratif, terpisah dari skor risiko upcoding).
    // Toleran terhadap variasi penamaan field dari AI: snake_case (no_sep), camelCase
    // (noSep), maupun field yang tercecer di level atas objek — supaya SEP yang jelas
    // ada di dokumen tidak salah terbaca sbg "tidak ada".
    const sepRaw = r.sep && typeof r.sep === "object" ? r.sep : {};
    // Pencocokan nama field TOLERAN: huruf besar/kecil, garis bawah, spasi & titik
    // diabaikan (no_sep = noSep = "No. SEP" = NOMOR_SEP), dicari di object sep
    // maupun di level atas — supaya SEP yang jelas ada tidak terbaca "kosong" hanya
    // karena AI memakai variasi nama field.
    const normKey = (k) => String(k).toLowerCase().replace(/[^a-z0-9]/g, "");
    const petaSep = {};
    Object.keys(sepRaw).forEach((k) => { petaSep[normKey(k)] = sepRaw[k]; });
    const petaAtas = {};
    Object.keys(r).forEach((k) => { if (k !== "sep") petaAtas[normKey(k)] = r[k]; });
    const isiValid = (v) => v !== undefined && v !== null && typeof v !== "object" && String(v).trim() !== "" && String(v).trim() !== "-";
    const ambilSep = (...kandidat) => {
      const ks = kandidat.map(normKey);
      for (const k of ks) if (isiValid(petaSep[k])) return String(petaSep[k]).trim();
      for (const k of ks) if (isiValid(petaAtas[k])) return String(petaAtas[k]).trim();
      return "";
    };
    const sep = {
      noSep: ambilSep("no_sep", "nomor_sep", "sep_no", "no_sep_bpjs", "nomor_sep_bpjs", "sep_number"),
      tglSep: ambilSep("tgl_sep", "tanggal_sep", "sep_date"),
      noKartu: ambilSep("no_kartu", "nomor_kartu", "no_peserta", "nomor_peserta", "no_kartu_bpjs", "no_bpjs"),
      dokter: ambilSep("dokter", "dpjp_sep", "nama_dokter"),
      subSpesialis: ambilSep("sub_spesialis", "spesialis", "sub_spesialis_poli"),
      faskesPerujuk: ambilSep("faskes_perujuk", "faskes", "asal_rujukan"),
      diagnosaAwal: ambilSep("diagnosa_awal", "diagnosis_awal", "diagnosa"),
      jenisKunjungan: ambilSep("jenis_kunjungan", "jns_kunjungan"),
      poliPerujuk: ambilSep("poli_perujuk", "poli"),
      kelasHak: ambilSep("kelas_hak", "kls_hak", "hak_kelas"),
      penjamin: ambilSep("penjamin"),
      noTelepon: ambilSep("no_telepon", "telepon", "no_telp", "no_hp"),
      catatan: ambilSep("catatan"),
    };
    // Pengaman deterministik dari pola teks/nama file (hanya utk dokumen 1 pasien,
    // supaya tidak tertukar antar pasien pada dokumen berisi banyak pasien).
    const pakaiPetunjuk = !!petunjuk && rows.length === 1;
    const sepAdaIsiAwal = Object.values(sep).some((v) => v !== "");
    if (pakaiPetunjuk && (sepAdaIsiAwal || petunjuk.adaHalamanSep)) {
      // No. SEP dari lapisan teks PDF/nama file itu PERSIS (bukan tebakan baca
      // gambar) — utamakan bila AI mengosongkan atau salah baca 1-2 karakter.
      if (petunjuk.noSep && sep.noSep.toUpperCase() !== petunjuk.noSep) sep.noSep = petunjuk.noSep;
      if (!sep.noKartu && petunjuk.noKartu) sep.noKartu = petunjuk.noKartu;
      if (!sep.tglSep && petunjuk.tglSep) sep.tglSep = petunjuk.tglSep;
    }
    const hasSepData = Object.values(sep).some((v) => v !== "");
    return {
      id: crypto.randomUUID(),
      noRM: String(r.no_rm || (pakaiPetunjuk ? petunjuk.noRM : "") || ""), namaPasien: String(r.nama_pasien || ""), dpjp: String(r.dpjp || ""),
      tglMasuk, tglKeluar, los: los !== null ? String(los) : String(r.los || ""),
      primaryDxCode: String(r.diagnosis_utama_kode || ""), primaryDxDesc: String(r.diagnosis_utama_desk || ""),
      secondaryDx: parsePipe(r.diagnosis_sekunder), procedures: parsePipe(r.prosedur),
      inacbgCode: kodeInacbg, severityLevel: String(r.severity_level || "I").trim() || "I",
      jenisKasus: String(r.jenis_kasus || "Medis").trim() || "Medis",
      jenisRawat,
      kelasRawat: String(r.kelas_rawat || "3").trim() || "3",
      tarifKlaim: String(parseAngka(r.tarif_klaim)),
      buktiPenunjang: String(r.bukti_penunjang || "").trim().toLowerCase() === "ya",
      specialCMG: String(r.special_cmg || "").trim().toLowerCase() === "ya",
      specialCMGKategori: SPECIAL_CMG_OPTIONS[0], resumeMedis: String(r.ringkasan_klinis || "").trim(),
      caraPulang: String(r.cara_pulang || "").trim(),
      tanggalDokumen: Array.isArray(r.tanggal_dokumen) ? r.tanggal_dokumen.filter((t) => t && typeof t === "object").slice(0, 40) : [],
      diagnosisDokumen: Array.isArray(r.diagnosis_dokumen) ? r.diagnosis_dokumen.filter((t) => t && typeof t === "object").slice(0, 30) : [],
      tarifRS: String(r.tarif_rs || "").replace(/[.,]\d{1,2}$/, "").replace(/\D/g, ""),
      sep: hasSepData ? sep : null,
      aiStatus: "idle", aiAnalysis: "",
      dariIGD: false, igdKriteriaGawatDarurat: false, igdDirujuk: false, igdLosJam: "",
      confirmedSeparateEpisodes: [],
    };
  }).filter((c) => c.noRM); // hanya wajibkan No. RM — kode INA-CBG boleh kosong (mis. dari
  // SEP+Resume Medis sebelum grouping e-Klaim), diisi menyusul manual saat sudah tersedia

  const handleExcelAsync = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: "binary" });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { defval: "" });
        const claims = rowsToClaims(rows);
        if (claims.length === 0) reject(new Error("Tidak ada baris valid ditemukan. Pastikan kolom no_rm dan kode_inacbg terisi."));
        else resolve(claims);
      } catch (err) { reject(new Error("Gagal membaca file. Pastikan format sesuai template (.xlsx atau .csv).")); }
    };
    reader.onerror = () => reject(new Error("Gagal membaca file."));
    reader.readAsBinaryString(file);
  });



  const callClaudeExtract = async (content) => {
    const textOut = await aiTeks({ tugas: "ekstraksi", konten: content }, 8000);
    const clean = (textOut || "").replace(/```json|```/g, "").trim();
    // Simpan jawaban mentah AI apa adanya — dipakai panel diagnostik supaya bisa
    // dipastikan apakah AI memang tidak mengirim field tertentu (mis. tarif/SEP),
    // atau justru kode kita yang salah memprosesnya.
    setRawAiResponse(clean.slice(0, 6000));
    return parseJsonLonggar(clean);
  };

  // Jalur teks: untuk PDF yang lapisan teksnya bisa dibaca langsung (cepat & murah)
  const handlePdfText = async (text, pages, pagesRead) => {
    const content = [
      { type: "text", text: `Teks dokumen PDF rumah sakit berikut diberi penanda "=== Halaman N ===" untuk tiap halaman (${pagesRead} dari ${pages} halaman):\n"""\n${text.slice(0, 60000)}\n"""` },
      { type: "text", text: "[[SKEMA_EKSTRAKSI]]" },
    ];
    return callClaudeExtract(content);
  };

  // Jalur vision/OCR: tiap halaman dirender jadi gambar lalu dibaca langsung oleh AI vision.
  // Dipakai untuk PDF hasil pindai/foto, ATAU sebagai percobaan ulang otomatis bila jalur teks gagal
  // (mis. karena PDF memakai font non-standar sehingga teksnya rusak saat diekstrak).
  // Kirim PDF ASLI langsung ke Anthropic (bukan diubah jadi gambar dulu di browser) —
  // memakai kemampuan native Claude membaca dokumen PDF, melewati proses render-canvas
  // pdf.js yang kadang gagal/tidak akurat untuk PDF hasil scanner tertentu. Dipakai
  // sebagai jalur utama untuk file yang cukup kecil (≤15MB, batas wajar request API).
  const fileToBase64Raw = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = () => reject(new Error("Gagal membaca file PDF."));
    reader.readAsDataURL(file);
  });

  const blokTeksPelengkap = (teks) => (teks && teks.trim().length > 50
    ? [{ type: "text", text: `Pelengkap — teks lapisan digital dari SELURUH halaman PDF (termasuk halaman yang mungkin tidak ikut terkirim sbg gambar/dokumen di atas), diberi penanda "=== Halaman N ===":\n"""\n${teks.slice(0, 40000)}\n"""` }]
    : []);

  const handlePdfNative = async (file, note, teksPelengkap) => {
    const base64 = await fileToBase64Raw(file);
    const content = [
      { type: "document", source: { type: "base64", media_type: "application/pdf", data: base64 } },
      ...blokTeksPelengkap(teksPelengkap),
      { type: "text", text: `Dokumen di atas berisi berkas klaim rumah sakit (${note || "PDF"}).\n\n[[SKEMA_EKSTRAKSI]]` },
    ];
    return callClaudeExtract(content);
  };

  // Halaman-halaman (sudah dirender jadi gambar) + teks pelengkap → ekstraksi
  const handleImagesExtract = async (images, note, teksPelengkap) => {
    const content = [
      ...images.map((img) => ({ type: "image", source: { type: "base64", media_type: "image/jpeg", data: img } })),
      ...blokTeksPelengkap(teksPelengkap),
      { type: "text", text: `Gambar di atas adalah halaman-halaman berkas klaim rumah sakit (${note || "dibaca sebagai gambar"}).\n\n[[SKEMA_EKSTRAKSI]]` },
    ];
    return callClaudeExtract(content);
  };

  const handlePdfVision = async (file, note) => {
    // Tahap 1: baca 3 halaman pertama dulu di kualitas tinggi (fokus, tidak "kebanjiran"
    // banyak halaman sekaligus) — cukup untuk sebagian besar berkas klaim (SEP + Resume
    // + Berkas Klaim Individual biasanya cuma 2-4 halaman).
    const stage1 = await pdfPagesToImages(file, 3, 2);
    const promptDasar = (pagesRead, pages) =>
      `Gambar di atas adalah ${pagesRead} dari ${pages} halaman total berkas klaim rumah sakit (${note || "dibaca sebagai gambar"}).\n\n[[SKEMA_EKSTRAKSI]]`;

    const content1 = [
      ...stage1.images.map((img) => ({ type: "image", source: { type: "base64", media_type: "image/jpeg", data: img } })),
      { type: "text", text: promptDasar(stage1.pagesRead, stage1.pages) },
    ];
    const result1 = await callClaudeExtract(content1);
    const arr1 = Array.isArray(result1) ? result1 : [result1];
    const cukupLengkap = arr1.length > 0 && arr1.every((r) => r.no_rm) && arr1.some((r) => r.kode_inacbg || r.tarif_klaim);

    if (cukupLengkap || stage1.pages <= stage1.pagesRead) {
      return result1;
    }

    // Tahap 2: data belum lengkap (kode INA-CBG/tarif masih kosong) padahal masih ada
    // halaman lain — perluas jadi 12 halaman sebagai upaya kedua.
    const stage2 = await pdfPagesToImages(file, 12, 2);
    const content2 = [
      ...stage2.images.map((img) => ({ type: "image", source: { type: "base64", media_type: "image/jpeg", data: img } })),
      { type: "text", text: promptDasar(stage2.pagesRead, stage2.pages) },
    ];
    return callClaudeExtract(content2);
  };

  // Foto langsung dari kamera HP (JPG/PNG/WEBP) — tidak perlu diubah ke PDF dulu.
  // Cara paling alami dipakai dari Android: jepret berkas klaim, langsung unggah.
  const fileToBase64 = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = () => reject(new Error("Gagal membaca file gambar."));
    reader.readAsDataURL(file);
  });

  const handleImageAsync = async (file) => {
    setPdfMode("vision");
    const base64 = await normalizeImageForAI(file);
    const mediaType = "image/jpeg";
    const content = [
      { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
      { type: "text", text: `Foto di atas berisi berkas klaim rumah sakit (dipotret langsung, mungkin agak miring/silau — baca semaksimal mungkin).\n\n[[SKEMA_EKSTRAKSI]]` },
    ];
    const rows = await callClaudeExtract(content);
    const claims = rowsToClaims(Array.isArray(rows) ? rows : [rows], cariPolaSep(`${namaUntukPola(file)}\n${JSON.stringify(rows)}`));
    if (claims.length === 0) {
      throw new Error("AI tidak menemukan No. RM sama sekali dari foto ini. Coba foto ulang dengan pencahayaan lebih baik dan pastikan seluruh berkas masuk bingkai, atau gunakan input manual.");
    }
    return claims;
  };

  const handlePdfAsync = async (file) => {
    setDebugText("");
    let info;
    try {
      info = await extractPdfText(file);
    } catch (eBuka) {
      // PDF terkunci password / strukturnya tidak standar sehingga pembaca PDF di
      // browser gagal membukanya — jangan langsung menyerah, kirim file aslinya ke AI.
      if (file.size > 15 * 1024 * 1024) {
        throw new Error(`Dokumen "${file.name}" tidak bisa dibuka pembaca PDF di browser (${eBuka && eBuka.message ? eBuka.message : "format tidak dikenali"}) dan terlalu besar untuk dikirim utuh. Buka file itu lalu "Print → Save as PDF" ulang, kemudian unggah hasilnya.`);
      }
      setPdfMode("vision");
      const rowsAsli = await handlePdfNative(file, "PDF yang tidak bisa dibuka pembaca di browser, dibaca langsung oleh AI");
      const claimsAsli = rowsToClaims(Array.isArray(rowsAsli) ? rowsAsli : [rowsAsli], cariPolaSep(`${namaUntukPola(file)}\n${JSON.stringify(rowsAsli)}`));
      if (claimsAsli.length === 0) throw new Error(`AI tidak menemukan No. RM dari dokumen "${file.name}".`);
      return claimsAsli;
    }
    const { text, pages, pagesRead } = info;
    const halamanBerteks = info.pageTexts.filter((t) => t.replace(/\s/g, "").length >= 30).length;
    const isScanLike = halamanBerteks === 0;
    // HYBRID: sebagian halaman teks digital (mis. Berkas Klaim dari e-Klaim) tapi ada
    // halaman GAMBAR hasil scan (mis. SEP/resume/resep yang discan). Jalur teks saja
    // BUTA terhadap halaman gambar — inilah penyebab SEP yang jelas ada di berkas
    // terbaca kosong. Untuk kasus ini PDF dikirim sbg dokumen asli (AI melihat teks +
    // gambar tiap halaman).
    const isHybrid = !isScanLike && info.imagePages.length > 0;
    setDebugText(text.slice(0, 3000));
    let rows = [];
    let usedVision = false;
    let peringatanUkuran = null;

    if (isScanLike) {
      setPdfMode("vision");
      // Dokumen besar/panjang (mis. berkas klaim tergabung dgn laporan billing panjang)
      // — coba BERTAHAP dari halaman paling sedikit dulu (1 halaman), baru diperluas kalau
      // hasilnya belum lengkap.
      const perluDipangkas = file.size > 15 * 1024 * 1024 || pages > 3;
      let fileToSend = file;
      let dipangkas = false;
      let errorPemangkasan = null;
      let jmlHalamanDikirim = pages;

      const cobaTahap = async (maxPages) => {
        const trimmed = await trimPdfToFirstPages(file, maxPages);
        if (trimmed.blob.size > 15 * 1024 * 1024) {
          // Scan resolusi tinggi: hasil pangkas masih >15MB → render jadi gambar ringan
          const imgs = await pdfPagesToImagesByIndex(file, Array.from({ length: trimmed.pagesCopied }, (_, i) => i));
          const hasilGbr = await handleImagesExtract(imgs, `hasil pindai, ${imgs.length} dari ${trimmed.totalPages} halaman dirender jadi gambar`, "");
          return { hasil: hasilGbr, f: file, pagesCopied: trimmed.pagesCopied, totalPages: trimmed.totalPages };
        }
        const f = new File([trimmed.blob], file.name, { type: "application/pdf" });
        const hasil = await handlePdfNative(f, `hasil pindai, dipangkas otomatis ke ${trimmed.pagesCopied} dari ${trimmed.totalPages} halaman`);
        return { hasil, f, pagesCopied: trimmed.pagesCopied, totalPages: trimmed.totalPages };
      };

      const cukupLengkap = (hasil) => {
        const arr = Array.isArray(hasil) ? hasil : [hasil];
        return arr.length > 0 && arr.every((r) => r.no_rm) && arr.some((r) => r.kode_inacbg || r.tarif_klaim)
          && arr.some((r) => String(r.ringkasan_klinis || "").trim().length > 80);
      };

      if (perluDipangkas) {
        try {
          for (const n of [3, 10, 20]) {
            const nPakai = Math.min(n, pages);
            const percobaan = await cobaTahap(nPakai);
            if (!percobaan) continue;
            jmlHalamanDikirim = percobaan.pagesCopied;
            rows = percobaan.hasil; usedVision = true; dipangkas = true; fileToSend = percobaan.f;
            if (cukupLengkap(percobaan.hasil) || nPakai >= pages) break;
          }
          if (dipangkas) {
            peringatanUkuran = `Dokumen "${file.name}" punya ${pages} halaman — sistem otomatis mencoba bertahap (3 → 10 → 20 halaman pertama) sampai data klaim & data klinis cukup lengkap, hasil akhir pakai ${jmlHalamanDikirim} halaman pertama. Kalau data masih kurang lengkap, kemungkinan bagian pentingnya ada di halaman setelah itu — coba pisahkan & unggah halaman "Berkas Klaim Individual Pasien" + SEP-nya saja.`;
          }
        } catch (e) {
          errorPemangkasan = `Proses pemangkasan otomatis gagal: ${e && e.message ? e.message : "kesalahan tidak diketahui"}.`;
        }
      }

      if (!dipangkas) {
        if (fileToSend.size > 15 * 1024 * 1024) {
          throw new Error(`Dokumen "${file.name}" berukuran ${(file.size / 1024 / 1024).toFixed(1)}MB, ${pages} halaman — terlalu besar untuk dibaca andal oleh sistem ini.${errorPemangkasan ? ` (${errorPemangkasan})` : ""} Solusi paling pasti: pisahkan dulu halaman SEP + "Berkas Klaim Individual Pasien"-nya saja memakai aplikasi pemisah PDF (mis. ilovepdf.com/split_pdf, atau Print → Save as PDF pilih halaman tertentu), lalu unggah file kecil itu.`);
        }
        setPdfMode("vision");
        try {
          rows = await handlePdfNative(fileToSend, "hasil pindai/foto, dibaca sebagai dokumen PDF asli");
          usedVision = true;
        } catch (e) {
          setPdfMode("vision-retry");
          rows = await handlePdfVision(fileToSend, "percobaan cadangan setelah jalur dokumen PDF asli gagal");
          usedVision = true;
        }
      }
    } else if (isHybrid) {
      setPdfMode("vision");
      // Teks digital SELURUH halaman ikut dikirim sbg pelengkap — halaman teks yang
      // tidak ikut terpilih (mis. puluhan hasil gula darah) tetap terbaca isinya.
      const MAX_HAL = 30;
      const besar = pages > MAX_HAL || file.size > 15 * 1024 * 1024;
      const penting = besar ? pilihHalamanPenting(info, MAX_HAL) : Array.from({ length: pages }, (_, i) => i);
      let berhasil = false;
      try {
        let fileKirim = file;
        let catatan = `${pages} halaman, campuran teks digital & halaman hasil scan`;
        if (besar) {
          const trimmed = await trimPdfToPages(file, penting);
          fileKirim = new File([trimmed.blob], file.name, { type: "application/pdf" });
          catatan = `${trimmed.pagesCopied} halaman terpilih dari ${pages} halaman (SEP/berkas klaim/resume/hasil scan/billing)`;
        }
        if (fileKirim.size <= 15 * 1024 * 1024) {
          rows = await handlePdfNative(fileKirim, catatan, text);
          berhasil = true;
        }
      } catch (e1) { /* lanjut ke jalur gambar */ }
      if (!berhasil) {
        // Scan resolusi tinggi membuat PDF hasil pangkas tetap >15MB — render halaman
        // terpilih jadi gambar ringan supaya SEP/lab/EKG hasil scan tetap terbaca.
        try {
          setPdfMode("vision-retry");
          const imgs = await pdfPagesToImagesByIndex(file, penting.slice(0, MAX_HAL));
          rows = await handleImagesExtract(imgs, `${imgs.length} halaman terpilih dari ${pages} halaman, dirender jadi gambar`, text);
          berhasil = true;
        } catch (e2) { /* lanjut ke jalur teks */ }
      }
      if (!berhasil) {
        // Jalan terakhir: setidaknya halaman teks digital (Berkas Klaim/resume) tetap terbaca
        setPdfMode("text");
        rows = await handlePdfText(text, pages, pagesRead);
      }
      usedVision = berhasil;
      if (besar) peringatanUkuran = `Dokumen "${file.name}" punya ${pages} halaman (${(file.size / 1024 / 1024).toFixed(1)}MB) — sistem memilih ${Math.min(penting.length, MAX_HAL)} halaman paling relevan (SEP, berkas klaim, resume, hasil scan, billing) + seluruh teks digital untuk dibaca AI.`;
    } else {
      setPdfMode("text");
      rows = await handlePdfText(text, pages, pagesRead);
    }

    const petunjukDari = (hasil) => cariPolaSep(`${namaUntukPola(file)}\n${text}\n${JSON.stringify(hasil)}`);
    let claims = rowsToClaims(Array.isArray(rows) ? rows : [rows], petunjukDari(rows));

    // Percobaan ulang otomatis bila jalur teks tidak menghasilkan data valid — bisa
    // jadi teksnya rusak akibat font PDF non-standar. Utamakan dokumen PDF asli.
    if (claims.length === 0 && !usedVision) {
      setPdfMode("vision-retry");
      let ulang;
      try {
        if (file.size > 15 * 1024 * 1024) throw new Error("terlalu besar");
        ulang = await handlePdfNative(file, "percobaan ulang setelah ekstraksi teks gagal");
      } catch (e) {
        ulang = await handlePdfVision(file, "percobaan ulang setelah ekstraksi teks gagal");
      }
      claims = rowsToClaims(Array.isArray(ulang) ? ulang : [ulang], petunjukDari(ulang));
      usedVision = true;
    }

    if (claims.length === 0) {
      throw new Error(`AI tidak menemukan No. RM sama sekali dari dokumen ini meski sudah dicoba lewat pembacaan teks${usedVision ? " maupun AI vision" : ""}. Kemungkinan PDF ini memakai format/font yang sulit dibaca otomatis, atau memang bukan berkas klaim (No. RM wajib ada; kode INA-CBG boleh kosong jika belum di-generate e-Klaim).`);
    }
    if (peringatanUkuran) claims._peringatanUkuran = peringatanUkuran;
    return claims;
  };

  // Orkestrasi multi-file: proses satu per satu berurutan (supaya tidak membanjiri
  // API dengan panggilan paralel), setiap file yang berhasil LANGSUNG ditambahkan ke
  // Dashboard begitu selesai — file lain yang gagal tidak menghentikan yang lain.
  const handleFiles = async (fileList) => {
    const files = Array.from(fileList);
    setError("");
    setSizeWarnings([]);
    setJustAdded(null);
    const errors = [];
    let totalAdded = 0;
    let completed = 0;
    const active = new Set();

    const isImageFile = (file) => /\.(jpe?g|png|webp|heic|heif)$/i.test(file.name.toLowerCase()) || (file.type && file.type.startsWith("image/"));
    const isPdfFile = (file) => file.name.toLowerCase().endsWith(".pdf") || file.type === "application/pdf";

    const processOne = async (file) => {
      active.add(file.name);
      setFileProgress({ completed, total: files.length, active: Array.from(active) });
      try {
        const name = file.name.toLowerCase();
        const claims = isPdfFile(file) ? await handlePdfAsync(file)
          : isImageFile(file) ? await handleImageAsync(file)
          : await handleExcelAsync(file);
        onAddMany(claims);
        setJustAdded((prev) => [...(prev || []), ...claims]);
        totalAdded += claims.length;
        if (claims._peringatanUkuran) setSizeWarnings((prev) => [...prev, claims._peringatanUkuran]);
      } catch (err) {
        errors.push(`"${file.name}": ${err.message || "gagal diproses"}`);
      }
      active.delete(file.name);
      completed += 1;
      setFileProgress({ completed, total: files.length, active: Array.from(active) });
    };

    // Excel/CSV tidak butuh AI — proses dulu semua, cepat & tidak perlu antre.
    const instantFiles = files.filter((f) => !isPdfFile(f) && !isImageFile(f));
    const aiFiles = files.filter((f) => isPdfFile(f) || isImageFile(f));
    for (const f of instantFiles) await processOne(f);

    // PDF/foto butuh panggilan AI — proses paralel terbatas (3 sekaligus) supaya
    // lebih cepat dari satu-satu murni, tapi tidak sampai membanjiri/kena limit API.
    const CONCURRENCY = 3;
    let idx = 0;
    const worker = async () => {
      while (idx < aiFiles.length) {
        const file = aiFiles[idx++];
        await processOne(file);
      }
    };
    await Promise.all(Array.from({ length: Math.min(CONCURRENCY, aiFiles.length) }, worker));

    setFileProgress(null);
    if (errors.length > 0) {
      setError(`${errors.length} dari ${files.length} file gagal diproses:\n${errors.join("\n")}${totalAdded > 0 ? `\n\n(${totalAdded} klaim dari file lain tetap berhasil ditambahkan)` : ""}`);
    }
  };

  return (
    <div className="space-y-5">
      <Section title="Unggah Klaim Massal" subtitle="Unggah file Excel/CSV, atau PDF berkas klaim untuk diskrining — bisa pilih beberapa file sekaligus"
        right={<button onClick={downloadTemplate} className="inline-flex items-center gap-1.5 text-xs font-medium text-[#0B7285] hover:text-[#095e6b]"><Download size={14} /> Unduh Template</button>}>
        <label htmlFor="claimFileInput"
          onDrop={(e) => { e.preventDefault(); if (!fileProgress && e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files); }}

          {fileProgress ? (
            <>
              <Loader2 size={28} className="text-[#0B7285] mb-2 animate-spin" />
              <p className="text-sm text-[#334652] font-medium">
                {fileProgress.completed} dari {fileProgress.total} file selesai
              </p>
              <p className="text-xs text-[#94A3AC] mt-1">
                {fileProgress.active && fileProgress.active.length > 0
                  ? `Sedang diproses: ${fileProgress.active.join(", ")}`

              </p>
              <div className="w-64 h-1.5 bg-[#E2E8ED] rounded-full mt-3 overflow-hidden">
                <div className="h-full bg-[#0B7285] transition-all" style={{ width: `${(fileProgress.completed / fileProgress.total) * 100}%` }} />

            <>

              <p className="text-xs text-[#94A3AC] mt-1">Format: .xlsx, .xls, .csv, .pdf, .jpg, .png, .webp — di HP bisa langsung pilih "Kamera" untuk jepret berkas klaim, tidak perlu diubah ke PDF dulu</p>
            </>

          <input id="claimFileInput" ref={fileRef} type="file" multiple accept=".xlsx,.xls,.csv,.pdf,.jpg,.jpeg,.png,.webp,.heic,.heif,application/pdf,image/*" className="hidden" onChange={(e) => e.target.files.length > 0 && handleFiles(e.target.files)} />
        </label>
        {!fileProgress && (
          <div className="mt-3 flex items-center gap-2">
            <div className="h-px flex-1 bg-[#E2E8ED]" /><span className="text-[10px] text-[#94A3AC]">kalau area di atas tidak merespons di HP</span><div className="h-px flex-1 bg-[#E2E8ED]" />
          </div>
        )}
        {!fileProgress && (
          <label htmlFor="claimFileInputFallback" className="mt-2 flex items-center justify-center gap-2 border border-[#D7DEE3] rounded-lg py-2.5 text-sm font-medium text-[#0B7285] cursor-pointer hover:bg-[#F4F9FA]">
            <Upload size={15} /> Tombol Pilih File Cadangan
            <input id="claimFileInputFallback" type="file" multiple accept=".xlsx,.xls,.csv,.pdf,.jpg,.jpeg,.png,.webp,.heic,.heif,application/pdf,image/*" className="hidden" onChange={(e) => e.target.files.length > 0 && handleFiles(e.target.files)} />

        <p className="text-xs text-[#94A3AC] mt-3 flex items-start gap-1.5"><Info size={13} className="mt-0.5 shrink-0" /> Unggah banyak file/foto sekaligus akan diproses satu per satu berurutan (bukan bersamaan) supaya tidak membanjiri panggilan AI. Tiap file yang berhasil langsung masuk Dashboard — kalau ada yang gagal, sisanya tetap diproses dan hasilnya tetap tersimpan. PDF berbasis teks dibaca langsung; PDF hasil pindai & foto langsung (JPG/PNG) otomatis dibaca lewat AI vision. Berkas klaim multi-halaman (SEP + resume medis + Berkas Klaim Individual) untuk satu pasien akan digabung jadi satu entri klaim.</p>
        {sizeWarnings.length > 0 && (
          <div className="mt-3 space-y-2">
            {sizeWarnings.map((w, i) => (
              <div key={i} className="flex items-start gap-2 bg-[#FBF8F0] text-[#9A6300] text-xs rounded-lg px-3 py-2.5"><AlertTriangle size={14} className="mt-0.5 shrink-0" /> {w}</div>
            ))}

        {error && (
          <div className="mt-3">
            <div className="flex items-start gap-2 bg-[#FCE9E7] text-[#B3261E] text-sm rounded-lg px-3 py-2 whitespace-pre-wrap"><AlertTriangle size={16} className="mt-0.5 shrink-0" /> {error}</div>
            {debugText && (
              <details className="mt-2">
                <summary className="text-xs text-[#0B7285] cursor-pointer hover:text-[#095e6b]">Lihat teks hasil ekstraksi (debug)</summary>

      {justAdded && (() => {
        const previewIssues = justAdded.map((c) => ({ claim: c, issues: sanityCheckClaim(c) }));
        const flaggedCount = previewIssues.filter((p) => p.issues.length > 0).length;
        return (
        <Section title={`✅ ${justAdded.length} klaim otomatis ditambahkan & diskrining`}

              <span><b>Pengaman data:</b> {flaggedCount} dari {justAdded.length} klaim punya nilai yang tidak wajar (lihat ikon ⚠ di baris terkait) — kemungkinan salah baca oleh AI. Data tetap tersimpan; silakan koreksi manual di Dashboard bila perlu (hapus lalu input ulang, atau edit langsung di rekam medis rujukan).</span>

          <div className="overflow-x-auto -mx-6 px-6">

                <th className="py-2 pr-4">Kode INACBG</th><th className="py-2 pr-4">Sev.</th><th className="py-2 pr-4">LOS</th><th className="py-2 pr-4">Tarif</th>

              <tbody>
                {previewIssues.slice(0, 8).map(({ claim: c, issues }) => (
                  <tr key={c.id} className="border-b border-[#F0F3F5]" title={issues.map((i) => i.detail).join(" | ")}>

                    <td className="py-2 pr-4 font-mono">{c.noRM}</td>

}

/* ----------------------------------------------------------------------

   Modal untuk satu klaim, atau Dashboard untuk rekap beberapa klaim sekaligus)
